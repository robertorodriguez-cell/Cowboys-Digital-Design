<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Illustrator Workspace Trainer</title>
<style>
:root{
  --bg:#e4e4e4;--panel:#f3f3f3;--panel2:#e9e9e9;--border:#cdcdcd;--text:#1d1d1d;--muted:#666;
  --hover:#dadada;--active:#c6c6c6;--canvas:#b9b9b9;--input:#fff;--accent:#1473e6;--maroon:#8A0635;--good:#1d8a3a;--bad:#c62828;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-size:13px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1c1c1c;--panel:#323232;--panel2:#282828;--border:#474747;--text:#e8e8e8;--muted:#a0a0a0;--hover:#404040;--active:#505050;--canvas:#535353;--input:#1e1e1e;--good:#4caf50;--bad:#ef5350}
}
:root[data-theme="dark"]{--bg:#1c1c1c;--panel:#323232;--panel2:#282828;--border:#474747;--text:#e8e8e8;--muted:#a0a0a0;--hover:#404040;--active:#505050;--canvas:#535353;--input:#1e1e1e;--good:#4caf50;--bad:#ef5350}
html.proj{font-size:17px}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
kbd{font:inherit;font-weight:600;border:1px solid var(--border);border-radius:.25rem;padding:0 .3rem;background:var(--panel2)}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;display:grid;grid-template-rows:auto auto auto 1fr auto}

/* App bar */
#appbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;padding:.35rem .7rem;background:var(--panel2);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.55rem}
.mark{width:1.9rem;height:1.9rem;border-radius:.35rem;background:var(--maroon);color:#fff;display:grid;place-items:center;font:700 .95rem Cambria,Georgia,serif}
.brand b{font-family:Cambria,Georgia,serif;font-size:1.1rem}
.brand small{color:var(--muted);margin-left:.3rem}
.modes{display:flex;border:1px solid var(--border);border-radius:.4rem;overflow:hidden;margin-left:auto}
.modes button{border:0;background:var(--panel);padding:.35rem .8rem;cursor:pointer}
.modes button+button{border-left:1px solid var(--border)}
.modes button.on{background:var(--maroon);color:#fff}
.appbtn{border:1px solid var(--border);background:var(--panel);border-radius:.35rem;padding:.3rem .6rem;cursor:pointer}
.appbtn.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* Menu bar */
#menubar{display:flex;background:var(--panel);border-bottom:1px solid var(--border);padding:0 .3rem;overflow-x:auto;scrollbar-width:none;position:relative}
#menubar button{border:0;background:none;padding:.32rem .7rem;white-space:nowrap;border-radius:.2rem;cursor:default}
#menubar button:hover,#menubar button.open{background:var(--hover)}
.dropdown{position:fixed;z-index:60;min-width:16rem;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.35);padding:.25rem 0;border-radius:.25rem}
.mi{display:flex;justify-content:space-between;align-items:center;gap:1.6rem;padding:.3rem .9rem;position:relative;white-space:nowrap;cursor:default}
.mi:hover{background:var(--accent);color:#fff}
.mi kbd{border:0;background:none;padding:0;font-weight:400;color:var(--muted)}
.mi:hover>kbd,.mi:hover>.arr{color:#e6f0ff}
.msep{height:1px;background:var(--border);margin:.25rem 0}
.mi .sub{display:none;position:absolute;left:100%;top:-.3rem;min-width:15rem;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.35);padding:.25rem 0;border-radius:.25rem}
.dropdown.flip .sub{left:auto;right:100%}
.mi.has-sub:hover>.sub,.mi.has-sub.open>.sub{display:block}

/* Control bar */
#control{display:flex;align-items:center;gap:.75rem;padding:.3rem .7rem;background:var(--panel);border-bottom:1px solid var(--border);min-height:2.5rem;overflow-x:auto;white-space:nowrap;position:relative}
#control .lbl{font-weight:600;min-width:7.5rem}
.ctl{display:flex;align-items:center;gap:.3rem;color:var(--muted)}
.spacer{flex:1}
.mini{width:1.35rem;height:1.35rem;border:1px solid #888;border-radius:.15rem;cursor:pointer;flex:none;padding:0;background:#fff}
select,input[type=number],input[type=text]{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:.25rem;padding:.15rem .3rem;font:inherit}
input[type=number]{width:4.4rem}
.none{background:linear-gradient(to top right,transparent calc(50% - 1.5px),#e0302e calc(50% - 1.5px),#e0302e calc(50% + 1.5px),transparent calc(50% + 1.5px)),#fff!important}

/* Main */
#main{display:grid;grid-template-columns:auto 1fr minmax(16rem,20rem);min-height:0}
#toolbar{background:var(--panel);border-right:1px solid var(--border);padding:.3rem;display:grid;grid-template-columns:repeat(2,2.1rem);gap:.1rem;align-content:start;overflow-y:auto;position:relative}
#toolbar.single{grid-template-columns:2.1rem}
.tbtop{grid-column:1/-1;height:1.2rem;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;border-radius:.2rem}
.tbtop:hover{background:var(--hover)}
.tool{position:relative;height:2.1rem;border:0;background:none;border-radius:.25rem;display:grid;place-items:center;cursor:pointer;padding:0;touch-action:none}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--active)}
.tool .ico{width:1.35rem;height:1.35rem;pointer-events:none}
.tri{position:absolute;right:1px;bottom:1px;width:.55rem;height:.55rem;display:block}
.tri::after{content:"";position:absolute;right:1px;bottom:1px;border-left:.32rem solid transparent;border-bottom:.32rem solid currentColor;opacity:.75}
.tool.hint{animation:pulse .5s 5 alternate}
@keyframes pulse{to{background:var(--maroon);color:#fff}}
@media (prefers-reduced-motion:reduce){.tool.hint{animation:none;background:var(--maroon);color:#fff}}
.tsep{grid-column:1/-1;height:1px;background:var(--border);margin:.2rem 0}
.fs{grid-column:1/-1;position:relative;width:3.7rem;height:3.7rem;margin:.5rem auto .1rem}
.fsbox{position:absolute;width:2.2rem;height:2.2rem;border:1px solid #888;cursor:pointer;padding:0;background:#fff}
.fsFill{left:0;top:0;z-index:2}
.fsStroke{left:1.1rem;top:1.1rem;z-index:1}
.fs.stroke-on .fsStroke{z-index:3}
.fsStroke::after{content:"";position:absolute;inset:.5rem;background:var(--panel);border:1px solid #888}
.fsSm{position:absolute;width:1.05rem;height:1.05rem;border:0;background:none;padding:0;cursor:pointer;font-size:.8rem;line-height:1;color:var(--text)}
.fsSwap{right:-.35rem;top:-.25rem}
.fsDef{left:-.3rem;bottom:-.3rem}
.fsDef::before,.fsDef::after{content:"";position:absolute;width:.55rem;height:.55rem;border:1px solid var(--text)}
.fsDef::before{left:0;top:0;background:#fff;z-index:1}
.fsDef::after{left:.3rem;top:.3rem;background:none;border-width:2px}
.fsmodes{grid-column:1/-1;display:flex;justify-content:center;gap:.2rem;margin-bottom:.3rem}
.fsmodes button{width:1.1rem;height:1.1rem;border:1px solid #888;padding:0;cursor:pointer;border-radius:.1rem}
#flyout{position:fixed;z-index:55;background:var(--panel);border:1px solid var(--border);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.35);padding:.25rem;border-radius:.3rem;min-width:15rem}
.fi{display:flex;align-items:center;gap:.6rem;width:100%;border:0;background:none;padding:.35rem .5rem;cursor:pointer;border-radius:.2rem;text-align:left}
.fi:hover{background:var(--accent);color:#fff}
.fi.on{font-weight:700}
.fi .ico{width:1.3rem;height:1.3rem;flex:none}
.fi span{flex:1}
.fi kbd{border:0;background:none;font-weight:400;opacity:.75}

#canvasWrap{position:relative;background:var(--canvas);min-width:0;min-height:0;overflow:hidden}
#stage{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.selbox{fill:none;stroke:#1473e6;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.selbox.thin{stroke-dasharray:3 2}
.anc{fill:#fff;stroke:#1473e6;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.anc.first,.anc.on{fill:#1473e6}
.anc.hot{pointer-events:all;cursor:move}
.hnd{fill:#1473e6;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:all;cursor:pointer}
.hnd.ghost{pointer-events:none}
.hline{stroke:#1473e6;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.hdl{fill:#fff;stroke:#1473e6;stroke-width:1;vector-effect:non-scaling-stroke}
.rubber{stroke:#1473e6;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
.marq{fill:rgba(20,115,230,.08);stroke:#1473e6;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
#stage.outline .obj{fill:none!important;stroke:#000!important;stroke-width:1px!important;vector-effect:non-scaling-stroke;filter:none!important;opacity:1!important}
#stage.outline text.obj{fill:#000!important;stroke:none!important}
.txtin{position:absolute;z-index:15;background:rgba(255,255,255,.92);color:#000;border:1px dashed var(--accent);padding:0 .2rem;min-width:9rem;outline:none;line-height:1.15}

#quizBar{position:absolute;left:50%;top:.8rem;transform:translateX(-50%);width:min(42rem,94%);z-index:20;background:var(--panel);border:2px solid var(--maroon);border-radius:.6rem;padding:.75rem 1rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.35)}
.qtop{display:flex;gap:1rem;color:var(--muted);font-size:.9rem}
.qtop b{color:var(--maroon)}
:root[data-theme="dark"] .qtop b{color:#e57399}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qtop b{color:#e57399}}
.qtop span:last-child{margin-left:auto}
.qtext{font-size:1.3rem;margin:.35rem 0;font-family:Cambria,Georgia,serif}
.qfb{min-height:1.4em;color:var(--muted)}
.qfb.ok{color:var(--good);font-weight:600}
.qfb.bad{color:var(--bad);font-weight:600}
.qbtns{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.3rem}
.qbtns button,.qa button{border:1px solid var(--border);background:var(--panel2);border-radius:.3rem;padding:.3rem .7rem;cursor:pointer}
.qa button:hover,.qbtns button:hover{background:var(--hover)}
.qa button.primary{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* Panels */
#panels{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.phead{padding:.35rem .7rem;background:var(--panel2);border-bottom:1px solid var(--border);font-weight:600;display:flex;justify-content:space-between}
.phead span{color:var(--muted);font-weight:400}
#toolInfo{padding:.7rem;border-bottom:1px solid var(--border);overflow-y:auto;max-height:48%;flex:none}
.tihead{display:flex;align-items:center;gap:.6rem}
.tiicon{width:2.6rem;height:2.6rem;border-radius:.4rem;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;flex:none}
.tiicon .ico{width:1.7rem;height:1.7rem}
.tiname{font:700 1.15rem Cambria,Georgia,serif}
.tikey{color:var(--muted);font-size:.92rem}
.badge{margin-left:auto;font-size:.8rem;padding:.1rem .5rem;border-radius:1rem;flex:none}
.badge.live{background:#1d8a3a22;color:var(--good);border:1px solid var(--good)}
.badge.demo{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
#toolInfo p{margin:.5rem 0}
.acp{border-left:3px solid var(--maroon);background:var(--panel2);padding:.45rem .6rem;border-radius:0 .3rem .3rem 0;margin:.5rem 0}
.acp b{display:block;font-size:.85rem;color:var(--muted)}
.loc{color:var(--muted);font-size:.92rem}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel2);flex:none}
.tabs button{flex:1;border:0;background:none;padding:.45rem .3rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--text);color:var(--text);font-weight:600}
.tabbody{flex:1;overflow-y:auto;padding:.4rem .7rem .8rem;min-height:0}
.tabbody h4{margin:.8rem 0 .35rem;font-size:.92rem}
.prow{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.prow>span:first-child{width:4.2rem;color:var(--muted)}
.prow code{font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .6rem}
.grid2 label{display:flex;align-items:center;gap:.3rem;color:var(--muted)}
.grid2 input{width:100%}
.chk{display:flex;align-items:center;gap:.4rem;margin:.3rem 0}
.chk kbd{margin-left:auto}
.qa{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.note{color:var(--muted);font-size:.92rem}
.lyr-top{display:flex;align-items:center;gap:.4rem;padding:.35rem .2rem;border-bottom:1px solid var(--border);margin-bottom:.2rem}
.lyr-top .chip{width:.35rem;align-self:stretch;background:#1473e6}
.lrow{display:flex;align-items:center;gap:.35rem;padding:.25rem .2rem .25rem 1.1rem;border-radius:.2rem;cursor:pointer}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--active)}
.lrow.sel .lname::after{content:"";display:inline-block;width:.5rem;height:.5rem;background:#1473e6;margin-left:.4rem}
.lb{border:0;background:none;padding:0;width:1.3rem;height:1.3rem;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.lb .ico{width:1rem;height:1rem}
.lsw{width:1.1rem;height:1.1rem;border:1px solid #888;flex:none;background:#fff}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.swtarget{display:flex;align-items:center;gap:.35rem;margin:.4rem 0}
.swtarget button{border:1px solid var(--border);background:var(--panel2);border-radius:.25rem;padding:.15rem .55rem;cursor:pointer}
.swtarget button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(1.7rem,1fr));gap:.25rem}
.swc{aspect-ratio:1;border:1px solid #888;padding:0;cursor:pointer;border-radius:.1rem}
.swc.cur{outline:2px solid var(--accent);outline-offset:1px}

#status{display:flex;align-items:center;gap:1rem;padding:.2rem .7rem;background:var(--panel2);border-top:1px solid var(--border);color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;position:relative}
#status button{border:1px solid var(--border);background:var(--panel);border-radius:.2rem;padding:0 .4rem;cursor:pointer}
#stHint{overflow:hidden;text-overflow:ellipsis;flex:1}

#toast{position:fixed;left:50%;bottom:3.2rem;transform:translate(-50%,.6rem);opacity:0;transition:opacity .2s,transform .2s;max-width:min(36rem,92vw);background:#202020;color:#fff;padding:.65rem 1rem;border-radius:.45rem;z-index:90;pointer-events:none;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.4);border-left:4px solid var(--maroon)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast kbd{background:#333;border-color:#555;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:1rem}
.card{width:min(46rem,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:.7rem;padding:1.3rem 1.5rem;border-top:.4rem solid var(--maroon);box-shadow:0 1rem 3rem rgba(0,0,0,.5)}
.card h2{font:700 1.7rem/1.15 Cambria,Georgia,serif;margin:0 0 .3rem}
.card .sub{color:var(--muted);margin:0 0 1rem}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.5rem .9rem;margin:.6rem 0 1rem}
.areas div{border-left:3px solid var(--maroon);padding:.1rem .6rem}
.areas b{display:block}
.bigscore{font:700 3rem Cambria,Georgia,serif;color:var(--maroon)}
.reftable{border-collapse:collapse;width:100%;font-size:.95rem}
.reftable td{border-bottom:1px solid var(--border);padding:.3rem .4rem;vertical-align:middle}
.reftable .ico{width:1.3rem;height:1.3rem}
.refcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}
.tblwrap{overflow-x:auto}
.foot{color:var(--muted);font-size:.85rem;margin-top:1rem}
.fld{display:block;font-weight:600;margin:.6rem 0}
.fnrow{display:flex;align-items:center;gap:.4rem;margin-top:.3rem;font-weight:400}
.fnrow input{flex:1;font-size:1.1rem;padding:.35rem .5rem}
.opts{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:.3rem 0 .6rem}
.opts label{display:flex;align-items:center;gap:.3rem}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.45rem;margin:.4rem 0 .8rem}
.presets button{text-align:left;padding:.45rem .6rem;border:1px solid var(--border);border-radius:.4rem;background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;line-height:1.25}
.presets button small{display:block;color:var(--muted);font-size:.85em}
.presets button.on{border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon) inset}
.presets h5{grid-column:1/-1;margin:.3rem 0 0;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dimrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.6rem 1rem;margin:.4rem 0 .8rem}
.dimrow label{display:flex;flex-direction:column;font-weight:600;gap:.2rem}
.dimrow input,.dimrow select{font-size:1.05rem;padding:.3rem .4rem;width:7.5rem}
.orient{display:flex;gap:.3rem}
.orient button{width:2.6rem;height:2.4rem;display:grid;place-items:center;border:1px solid var(--border);border-radius:.35rem;background:var(--panel2);cursor:pointer;color:var(--text)}
.orient button.on{border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon) inset}
.orient i{display:block;border:2px solid currentColor;border-radius:2px}
.refpt{display:grid;grid-template-columns:repeat(3,1.35rem);gap:.25rem;padding:.3rem;border:1px solid var(--border);border-radius:.35rem;width:max-content}
.refpt button{width:1.35rem;height:1.35rem;border:1px solid var(--border);background:var(--panel2);border-radius:2px;cursor:pointer;padding:0}
.refpt button.on{background:var(--maroon);border-color:var(--maroon)}
.abprev{font-size:.95rem;color:var(--muted);margin:.2rem 0 .6rem}

body.labels [data-label]::after{content:attr(data-label);position:absolute;z-index:45;left:.4rem;top:.3rem;background:var(--maroon);color:#fff;font:700 .85rem system-ui,sans-serif;padding:.15rem .5rem;border-radius:.25rem;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
body.labels #menubar::after,body.labels #control::after,body.labels #status::after{left:auto;right:.4rem}
body.labels #toolbar::after{top:auto;bottom:.3rem;left:.2rem}
body.nopanels #toolbar,body.nopanels #panels,body.nopanels #control{display:none}
body.nopanels #main{grid-template-columns:1fr}

@media (max-width:820px){
  #main{grid-template-columns:auto 1fr;grid-template-rows:1fr 42%}
  #panels{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}
  #toolInfo{max-height:none}
  .brand small{display:none}
  .modes{margin-left:0}
}
</style>
</head>
<body>
<div id="app">
  <header id="appbar">
    <div class="brand"><div class="mark">MC</div><b>Illustrator Workspace Trainer</b><small>Madison County Cowboys · Digital Design</small></div>
    <div class="modes" role="group" aria-label="Mode">
      <button data-act="mode-explore" class="on" id="mExplore">Explore</button>
      <button data-act="mode-find" id="mFind">Find the Tool</button>
      <button data-act="mode-keys" id="mKeys">Shortcut Challenge</button>
    </div>
    <button class="appbtn" data-act="labels" id="bLabels">Label workspace</button>
    <button class="appbtn" data-act="mac" id="bMac">Win shortcuts</button>
    <button class="appbtn" data-act="theme" id="bTheme">Theme</button>
    <button class="appbtn" data-act="proj" id="bProj">Projector size</button>
  </header>
  <nav id="menubar" data-label="Menu Bar"></nav>
  <div id="control" data-label="Control Bar"></div>
  <div id="main">
    <aside id="toolbar" data-label="Toolbar"></aside>
    <div id="canvasWrap" data-label="Canvas (pasteboard)">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs id="sdefs">
          <pattern id="gridpat" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#8fb3e0" stroke-width=".6"/></pattern>
          <pattern id="gridpat2" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gridpat)"/><path d="M100 0H0V100" fill="none" stroke="#5f8fcf" stroke-width="1"/></pattern>
          <filter id="ds" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="7" dy="7" stdDeviation="4" flood-opacity=".45"/></filter>

function setBox(el,L,Tp,W,H){const d=el.dataset,bb=el.getBBox(),cx=bb.x+bb.width/2,cy=bb.y+bb.height/2,cur=union([el]);

/* ---------- Keyboard ---------- */
function toolCombo(e){if(e.ctrlKey||e.metaKey||e.altKey)return null;const c=e.code;
  if(/^Key[A-Z]$/.test(c))return (e.shiftKey?'Shift+':'')+c.slice(3);
  if(c==='Backquote')return e.shiftKey?'Shift+~':null;if(c==='Equal'||c==='NumpadAdd')return '+';if(c==='Minus'||c==='NumpadSubtract')return '-';if(c==='Backslash')return '\\';return null;}
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  const mod=e.ctrlKey||e.metaKey;
  if(e.code==='Space'&&!mod){e.preventDefault();if(!S.spaceHand){S.spaceHand=true;setCursor();}return;}
  const combo=`${mod?'C':''}${e.altKey?'A':''}${e.shiftKey?'S':''}-${e.code}`;
  if(mod||/^F\d+$/.test(e.code)){const hit=KB[combo];if(hit){e.preventDefault();closeMenus();runAct(hit.l,hit.act);}return;}
  if(e.key==='Escape'){if(!$('#modal').hidden)return closeModal();if(S.pen)return finishPen(false);if(!dd.hidden||!fly.hidden){closeMenus();fly.hidden=true;return;}return setSel([]);}
  if(e.key==='Enter'){if(S.pen){e.preventDefault();finishPen(false);}return;}
  if(!$('#modal').hidden)return;
  if(e.key==='Delete'||e.key==='Backspace'){if(S.sel.length){e.preventDefault();doAct('del');}return;}
  if(e.key==='Tab'){e.preventDefault();document.body.classList.toggle('nopanels');toast(document.body.classList.contains('nopanels')?'Panels hidden. Press Tab again to show them.':'Panels shown.');return;}
  if(e.key.startsWith('Arrow')&&S.sel.length&&!e.altKey){e.preventDefault();const n=e.shiftKey?10:1,dx={ArrowLeft:-n,ArrowRight:n}[e.key]||0,dy={ArrowUp:-n,ArrowDown:n}[e.key]||0;
    pushUndo();S.sel.forEach(el=>{el.dataset.tx=+el.dataset.tx+dx;el.dataset.ty=+el.dataset.ty+dy;applyT(el);});return refresh();}
  const tc=toolCombo(e);
  if(Q.on&&Q.type==='keys'&&tc){e.preventDefault();if(KEYMAP[tc])selectTool(KEYMAP[tc],'key');answerKey(tc);return;}
  if(tc==='D')return doAct('defaults');if(tc==='X')return setActive(S.active==='fill'?'stroke':'fill');if(tc==='Shift+X')return doAct('swap');
  if(e.code==='Slash'&&!e.shiftKey)return doAct('modenone');if(e.code==='Period')return doAct('applygrad');if(e.code==='Comma')return doAct('modecolor');
  if(tc&&KEYMAP[tc]){e.preventDefault();selectTool(KEYMAP[tc],'key');}});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&S.spaceHand){S.spaceHand=false;setCursor();}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&!dd.contains(a))doAct(a.dataset.act);});

const Q={on:false,type:'find',list:[],i:0,score:0,locked:false,missed:[]};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function setMode(m){['explore','find','keys'].forEach(k=>$('#m'+k[0].toUpperCase()+k.slice(1)).classList.toggle('on',k===m));
  if(m==='explore'){Q.on=false;$('#quizBar').hidden=true;closeModal();return;}startQuiz(m);}
function startQuiz(type){closeModal();Q.type=type;Q.list=shuffle(TOOLS.filter(t=>type==='find'?t.q:t.key)).slice(0,10);Q.i=0;Q.score=0;Q.missed=[];Q.on=true;Q.locked=false;
  ['explore','find','keys'].forEach(k=>$('#m'+k[0].toUpperCase()+k.slice(1)).classList.toggle('on',k===type));
  if(type==='find')selectTool('selection');showQ();}
function showQ(){const t=Q.list[Q.i],bar=$('#quizBar');bar.hidden=false;
  bar.innerHTML=`<div class="qtop"><b>${Q.type==='find'?'Find the Tool':'Shortcut Challenge'}</b><span>Question ${Q.i+1} of ${Q.list.length}</span><span>Score ${Q.score}</span></div>
  <div class="qtext">${Q.type==='find'?`Which tool would you use to ${esc(t.q)}?`:`Press the shortcut for the ${esc(t.name)}.`}</div>
  <div class="qfb" id="qfb">${Q.type==='find'?'Click it in the toolbar. Some tools are hidden — press and hold a slot with a small triangle.':'Use the keyboard. Include Shift if the shortcut needs it.'}</div>
  <div class="qbtns"><button data-act="qskip">Skip</button><button data-act="qend">End round</button></div>`;}
function fb(msg,cls){const el=$('#qfb');if(el){el.innerHTML=msg;el.className='qfb '+cls;}}
function hintSlot(t){const b=tb.querySelector(`.tool[data-g="${t.g}"]`);if(b){b.classList.remove('hint');void b.offsetWidth;b.classList.add('hint');}}

  r.shapes.forEach(sh=>sh.subs.forEach(q=>q.n.forEach(n=>acc(n.x,n.y))));r.texts.forEach(t=>{acc(t.x,t.y);acc(t.x+t.size*t.str.length*.5,t.y-t.size);});
  let bx=0,by=0,bw=r.w,bh=r.h;
  if(!(bw>1&&bh>1)||x1<0||y1<0||x0>bw||y0>bh){const pad=Math.max(x1-x0,y1-y0)*.04||10;bx=x0-pad;by=y0-pad;bw=x1-x0+pad*2;bh=y1-y0+pad*2;}
  const usePage=bx===0&&by===0&&bw>=9&&bh>=9&&bw<=MAXPT&&bh<=MAXPT,DW=usePage?bw:S.docW,DH=usePage?bh:S.docH;
  const sc=usePage?1:Math.min(DW/bw,DH/bh),dx=(DW-bw*sc)/2-bx*sc,dy=(DH-bh*sc)/2-by*sc,X=v=>v*sc+dx,Y=v=>v*sc+dy,H=h=>h&&[X(h[0]),Y(h[1])];
  pushUndo();finishPen(false);art.innerHTML='';defs.innerHTML='';setSel([]);
  if(usePage){S.units=guessUnits(bw,bh);applyBoard(bw,bh);}
  let nP=0,nC=0,nT=0,cut=0;
  r.shapes.forEach(sh=>{if(nP+nC>=MAXOBJ){cut++;return;}
    const subs=sh.subs.map(q=>({c:q.c,n:q.n.map(n=>({x:X(n.x),y:Y(n.y),i:H(n.i),o:H(n.o),s:false}))}));
    subs.forEach(q=>q.n.forEach(n=>{if(n.i&&n.o){const a=Math.atan2(n.y-n.i[1],n.x-n.i[0]),b=Math.atan2(n.o[1]-n.y,n.o[0]-n.x);n.s=Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)))<.05;}}));
    const at={fill:sh.fill||'none',stroke:sh.stroke||'none','stroke-width':sh.stroke?Math.max(.25,f1(sh.sw*sc)):0};
    if(sh.eo||subs.length>1)at['fill-rule']='evenodd';if(sh.op<.995)at.opacity=f1(sh.op*100)/100;
    if(subs.length===1){const el=newObj('path',at,'Path');saveNodes(el,subs[0].n,subs[0].c);nP++;}
    else{at.d=subs.map(q=>nodesD(q.n,q.c)).join(' ');newObj('path',at,'Compound Path');nC++;}});
  r.texts.forEach(t=>{const at={x:f1(X(t.x)),y:f1(Y(t.y)),'font-family':t.font,'font-size':Math.max(1,f1(t.size*sc)),fill:t.fill||'#000000',stroke:'none'};
    if(t.weight)at['font-weight']=t.weight;if(t.style)at['font-style']=t.style;if(t.op<.995)at.opacity=f1(t.op*100)/100;
    const el=newObj('text',at,'Type');el.textContent=t.str;if(Math.abs(t.rot)>.5){el.dataset.rot=f1(t.rot);applyT(el);}nT++;});
  S.docName=cleanName(fname);S.dirty=false;updateDoc();refresh();fit();
  const parts=[];if(nP)parts.push(`${nP} path${nP>1?'s':''}`);if(nC)parts.push(`${nC} compound path${nC>1?'s':''}`);if(nT)parts.push(`${nT} text object${nT>1?'s':''}`);
  const notes=[];if(r.skip.grad)notes.push('gradients became solid colors');if(r.skip.img)notes.push('placed/pixel images were left out');if(r.skip.clip)notes.push('clipping masks were released');
  if(r.pages>1)notes.push(`only Artboard 1 of ${r.pages} was opened`);if(cut)notes.push(`the file was very large, so ${cut} more shapes were left out`);if(nT)notes.push('fonts you don\'t have are swapped for similar ones');
  toast(`Opened ${esc(fname)}: ${parts.join(', ')}. Every shape is its own object — press A to edit anchor points.${notes.length?'<br><small>Heads up: '+notes.join('; ')+'.</small>':''}<br><small>File › Save keeps your changes as an SVG.</small>`,9000);}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const vec=/\.(ai|eps|ps)$/i.test(f.name);if(f.size>(vec?60e6:8e6))return toast('That file is too large to open here.');
  const r=new FileReader();r.onerror=()=>toast('That file couldn\'t be read.');
  r.onload=()=>{const u8=new Uint8Array(r.result),k=VX.kind(u8);
    if(k==='pdf'||k==='eps')return importVector(u8,f.name,k);
    if(k==='svg'||/\.svg$/i.test(f.name))return importSVG(new TextDecoder().decode(u8),f.name);
    toast('That file type can\'t be opened here. Choose an .svg, .ai, or .eps file.',5500);};
  r.readAsArrayBuffer(f);});
$('#modal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[type=text],input[type=number]')){e.preventDefault();const b=$('#modal .primary');if(b)b.click();}else if(e.key==='Escape')closeModal();});
getDL();

/* ---------- Document size (New Document, Document Setup, Artboard Options) ---------- */
/* Like Illustrator, 1 px = 1 pt and there are 72 pt in an inch. */
const UNITS={px:{n:'Pixels',a:'px',f:1,d:1},pt:{n:'Points',a:'pt',f:1,d:1},in:{n:'Inches',a:'in',f:72,d:3},cm:{n:'Centimeters',a:'cm',f:72/2.54,d:2},mm:{n:'Millimeters',a:'mm',f:72/25.4,d:1}};
const MAXPT=16383;
const rnd=(v,d)=>{const m=10**d;return Math.round(v*m)/m;};
const toU=(v,u=S.units)=>rnd(v/UNITS[u].f,UNITS[u].d);
const fromU=(v,u=S.units)=>v*UNITS[u].f;
const isPrint=u=>['in','cm','mm'].includes(u);
const docSizeText=()=>`${toU(S.docW)} × ${toU(S.docH)} ${UNITS[S.units].a}`;
const DOC_PRESETS=[
  ['Print',[['Letter',8.5,11,'in'],['Postcard',6,4,'in'],['Business Card',3.5,2,'in'],['Flyer (Half Letter)',5.5,8.5,'in'],['Tabloid',11,17,'in'],['Poster',18,24,'in']]],
  ['Web & Social',[['Trainer Default',800,600,'px'],['Web (HD)',1920,1080,'px'],['Instagram Post',1080,1080,'px'],['Instagram Story',1080,1920,'px'],['Facebook Cover',820,312,'px'],['YouTube Thumbnail',1280,720,'px']]]];
function guessUnits(w,h){const e=v=>Math.abs(v/9-Math.round(v/9))<.02;return e(w)&&e(h)?'in':'px';}
function applyBoard(w,h){S.docW=Math.max(1,Math.min(MAXPT,w));S.docH=Math.max(1,Math.min(MAXPT,h));
  ['#abShadow','#abPage','#gridR'].forEach(id=>{const r=$(id);if(r){r.setAttribute('width',S.docW);r.setAttribute('height',S.docH);}});
  const st=$('#stAB');if(st)st.textContent='Artboard 1 · '+docSizeText();}
/* resize the artboard; ref = reference point [0|.5|1, 0|.5|1] that stays put */
function resizeBoard(w,h,ref){const dx=(w-S.docW)*ref[0],dy=(h-S.docH)*ref[1];
  if(dx||dy)objs().forEach(o=>{o.dataset.tx=+o.dataset.tx+dx;o.dataset.ty=+o.dataset.ty+dy;applyT(o);});
  applyBoard(w,h);}
function setUnits(u){if(!UNITS[u])return;S.units=u;applyBoard(S.docW,S.docH);refresh();toast(`Units are now <b>${UNITS[u].n}</b>. Rulers, the Properties panel, and the status bar all use ${UNITS[u].n.toLowerCase()}.`);}
function unitSel(id,u){return `<select id="${id}">${Object.keys(UNITS).map(k=>`<option value="${k}" ${k===u?'selected':''}>${UNITS[k].n}</option>`).join('')}</select>`;}
const ORI=`<div class="orient" role="group" aria-label="Orientation"><button type="button" data-ori="p" title="Portrait"><i style="width:.85rem;height:1.2rem"></i></button><button type="button" data-ori="l" title="Landscape"><i style="width:1.2rem;height:.85rem"></i></button></div>`;
function dimFields(w,h,u){return `<div class="dimrow"><label>Width<input type="number" id="dW" min="0" step="any" value="${toU(w,u)}"></label><label>Height<input type="number" id="dH" min="0" step="any" value="${toU(h,u)}"></label>
  <label>Units${unitSel('dU',u)}</label><div><div style="font-weight:600;margin-bottom:.2rem">Orientation</div>${ORI}</div></div><p class="abprev" id="dPrev"></p>`;}
let DLG=null;
function dlgRead(){const u=$('#dU').value,w=fromU(+$('#dW').value,u),h=fromU(+$('#dH').value,u);return {u,w,h,ok:w>=1&&h>=1&&w<=MAXPT&&h<=MAXPT};}
function dlgSync(){const r=dlgRead();document.querySelectorAll('[data-ori]').forEach(b=>b.classList.toggle('on',r.ok&&(b.dataset.ori==='p'?r.h>r.w:r.w>r.h)));
  document.querySelectorAll('.presets [data-pre]').forEach(b=>{const p=DOC_PRESETS.flatMap(g=>g[1])[+b.dataset.pre],pw=fromU(p[1],p[3]),ph=fromU(p[2],p[3]);
    b.classList.toggle('on',r.ok&&((Math.abs(pw-r.w)<.5&&Math.abs(ph-r.h)<.5)||(Math.abs(pw-r.h)<.5&&Math.abs(ph-r.w)<.5)));});
  const pv=$('#dPrev');if(!pv)return;
  if(!r.ok){pv.innerHTML=`<span style="color:var(--bad)">Enter a width and height between ${toU(1,r.u)} and ${toU(MAXPT,r.u)} ${UNITS[r.u].a}.</span>`;return;}
  const inch=`${rnd(r.w/72,2)} × ${rnd(r.h/72,2)} in`,px=`${Math.round(r.w)} × ${Math.round(r.h)} px`;
  pv.textContent=r.u==='in'?`= ${px} (Illustrator counts 72 points per inch)`:r.u==='px'||r.u==='pt'?`= ${inch} when printed`:`= ${inch}`;}
function dlgWire(){const m=$('#modal');
  m.oninput=e=>{if(['dW','dH'].includes(e.target.id))dlgSync();};
  m.onchange=e=>{if(e.target.id==='dU'){const old=DLG.u,w=fromU(+$('#dW').value,old),h=fromU(+$('#dH').value,old);DLG.u=e.target.value;$('#dW').value=toU(w,DLG.u);$('#dH').value=toU(h,DLG.u);dlgSync();}};
  m.onclick=e=>{const o=e.target.closest('[data-ori]');if(o){const W=$('#dW'),H=$('#dH'),a=+W.value,b=+H.value;if((o.dataset.ori==='p')!==(b>a)&&a!==b){W.value=b;H.value=a;}return dlgSync();}
    const p=e.target.closest('[data-pre]');if(p){const q=DOC_PRESETS.flatMap(g=>g[1])[+p.dataset.pre];DLG.u=q[3];$('#dU').value=q[3];$('#dW').value=q[1];$('#dH').value=q[2];
      const nm=$('#nName');if(nm&&(!nm.dataset.typed))nm.value=q[0]==='Trainer Default'?'Untitled-1':q[0];return dlgSync();}
    const rp=e.target.closest('[data-ref]');if(rp){DLG.ref=rp.dataset.ref.split(',').map(Number);document.querySelectorAll('[data-ref]').forEach(b=>b.classList.toggle('on',b===rp));}};
  const nm=$('#nName');if(nm)nm.addEventListener('input',()=>nm.dataset.typed='1');
  dlgSync();}
function newDocDialog(){DLG={u:S.units};let i=0;
  const pre=DOC_PRESETS.map(([g,list])=>`<h5>${g}</h5>`+list.map(p=>`<button type="button" data-pre="${i++}"><b>${esc(p[0])}</b><small>${p[1]} × ${p[2]} ${p[3]}</small></button>`).join('')).join('');
  showModal(`<h2>New Document</h2><p class="sub">Pick a preset or type your own size. In Illustrator, choose File › New (${fmt('Ctrl+N')}) and pick a category: Print, Web, Mobile, Film &amp; Video…</p>
  <label class="fld">Name<span class="fnrow"><input type="text" id="nName" value="Untitled-1" maxlength="80" autocomplete="off"></span></label>
  <div class="presets">${pre}</div>${dimFields(S.docW,S.docH,S.units)}
  <p class="note">Print work is usually measured in <b>inches</b> and should be CMYK at 300 ppi; screen work uses <b>pixels</b> and RGB. Creating a new document clears the artboard — save first if you want to keep your artwork (Ctrl/Cmd+Z also brings it back).</p>
  <div class="qa"><button class="primary" data-act="donew">Create</button><button data-act="closemodal">Cancel</button></div>`);dlgWire();}
function doNewDoc(){const r=dlgRead();if(!r.ok)return dlgSync();const name=cleanName($('#nName').value);closeModal();
  pushUndo();art.innerHTML='';defs.innerHTML='';setSel([]);S.units=r.u;applyBoard(r.w,r.h);S.docName=name==='Untitled-1'?null:name;S.dirty=false;updateDoc();refresh();fit();
  toast(`New document: <b>${docSizeText()}</b>. Ctrl/Cmd+Z brings the previous artwork back.`,5000);}
function artboardDialog(title){DLG={u:S.units,ref:[.5,.5]};const ds=title==='Document Setup';
  const refs=[0,.5,1].flatMap(y=>[0,.5,1].map(x=>`<button type="button" data-ref="${x},${y}" class="${x===.5&&y===.5?'on':''}" title="Reference point"></button>`)).join('');
  showModal(`<h2>${title}</h2><p class="sub">${ds?`Set the document's units and artboard size. In Illustrator: File › Document Setup (${fmt('Alt+Ctrl+P')}), then <b>Edit Artboards</b> to resize.`:'Type an exact size for Artboard 1. In Illustrator, double-click the Artboard Tool (Shift+O) to open this dialog.'}</p>
  ${dimFields(S.docW,S.docH,S.units)}
  <div class="dimrow"><div><div style="font-weight:600;margin-bottom:.2rem">Reference point</div><div class="refpt">${refs}</div></div>
  <p class="note" style="flex:1;min-width:14rem;margin:0">The reference point is the part of the artboard that stays still. The center keeps your artwork centered; the top-left keeps it where it is. Resizing the artboard does <b>not</b> scale your artwork — anything outside the artboard won't print or export.</p></div>
  ${ds?'<p class="note"><b>Bleed</b> — for printed pieces that run to the edge, Illustrator adds a bleed (usually 0.125 in) in Document Setup. This trainer shows the trim size only.</p>':''}
  <div class="qa"><button class="primary" data-act="doab">OK</button><button data-act="closemodal">Cancel</button></div>`);dlgWire();}
function doArtboard(){const r=dlgRead();if(!r.ok)return dlgSync();const ref=DLG.ref;closeModal();
  const same=Math.abs(r.w-S.docW)<.01&&Math.abs(r.h-S.docH)<.01;
  if(same&&r.u===S.units)return;pushUndo();S.units=r.u;resizeBoard(r.w,r.h,ref);refresh();fit();
  toast(same?`Units are now <b>${UNITS[r.u].n}</b>.`:`Artboard 1 is now <b>${docSizeText()}</b>. Ctrl/Cmd+Z undoes it.`,4500);}
const MAXPX=16e6;
function exportScaleOpts(){const opts=[[1,'1x'],[2,'2x'],[3,'3x']];if(isPrint(S.units))opts.push([150/72,'150 ppi'],[300/72,'300 ppi (print)']);
  const fits=s=>S.docW*s*S.docH*s<=MAXPX&&Math.max(S.docW,S.docH)*s<=16384;
  let def=isPrint(S.units)?300/72:2;if(!fits(def))def=[...opts].reverse().map(o=>o[0]).find(fits)||opts[0][0];
  return opts.map(([s,l])=>{const ok=fits(s)||s===1;return `<label title="${ok?'':'Too large for a browser to draw — choose a smaller size'}"><input type="radio" name="eScale" value="${s}" ${s===def?'checked':''} ${ok?'':'disabled'}> ${l} (${Math.round(S.docW*s)} × ${Math.round(S.docH*s)})</label>`;}).join('');}

function sample(){
  const r=newObj('rect',{x:70,y:80,width:280,height:170,fill:'#8A0635',stroke:'none','stroke-width':0},'Rectangle');
  const c=newObj('ellipse',{cx:560,cy:180,rx:100,ry:100,fill:'#9E9FA3',stroke:'#0A0A0A','stroke-width':4},'Ellipse');
  const s=newObj('polygon',{points:polyPts({x:210,y:430},95,-Math.PI/2,'star'),fill:'#FFFFFF',stroke:'#8A0635','stroke-width':6},'Star');
  const t=newObj('text',{x:380,y:450,'font-family':'Cambria','font-size':54,fill:'#0A0A0A',stroke:'none'},'Type');t.textContent='Cowboys Design';
  [r,c,s,t].forEach(x=>x.dataset.sample=1);}
if(S.mac)$('#bMac').textContent='Mac shortcuts';
applyBoard(S.docW,S.docH);sample();S.dirty=false;updateDoc();renderToolbar();renderInfo();showTab('props');refresh();setCursor();
$('#stTool').textContent=T[S.tool].name;$('#stHint').textContent=T[S.tool].h;
welcome();
})();
