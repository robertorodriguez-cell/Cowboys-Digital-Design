<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photoshop Workspace Trainer</title>
<style>
:root{
  --bg:#e4e4e4;--panel:#f0f0f0;--panel2:#e6e6e6;--border:#c9c9c9;--text:#1d1d1d;--muted:#666;
  --hover:#d8d8d8;--active:#c4c4c4;--canvas:#bdbdbd;--input:#fff;--accent:#1473e6;--maroon:#8A0635;--good:#1d8a3a;--bad:#c62828;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:13px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--panel:#2f2f2f;--panel2:#262626;--border:#444;--text:#e6e6e6;--muted:#9c9c9c;--hover:#3d3d3d;--active:#4d4d4d;--canvas:#1f1f1f;--input:#1c1c1c;--good:#4caf50;--bad:#ef5350}}
:root[data-theme="dark"]{--bg:#1a1a1a;--panel:#2f2f2f;--panel2:#262626;--border:#444;--text:#e6e6e6;--muted:#9c9c9c;--hover:#3d3d3d;--active:#4d4d4d;--canvas:#1f1f1f;--input:#1c1c1c;--good:#4caf50;--bad:#ef5350}
html.proj{font-size:17px}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
kbd{font:inherit;font-weight:600;border:1px solid var(--border);border-radius:.25rem;padding:0 .3rem;background:var(--panel2)}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;display:grid;grid-template-rows:auto auto auto 1fr auto}
#appbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;padding:.35rem .7rem;background:var(--panel2);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.55rem}
.mark{width:1.9rem;height:1.9rem;border-radius:.35rem;background:var(--maroon);color:#fff;display:grid;place-items:center;font:700 .95rem Cambria,Georgia,serif}
.brand b{font-family:Cambria,Georgia,serif;font-size:1.1rem}
.brand small{color:var(--muted);margin-left:.3rem}
.modes{display:flex;border:1px solid var(--border);border-radius:.4rem;overflow:hidden;margin-left:auto}
.modes button{border:0;background:var(--panel);padding:.35rem .8rem;cursor:pointer}
.modes button+button{border-left:1px solid var(--border)}
.modes button.on{background:var(--maroon);color:#fff}
.appbtn{border:1px solid var(--border);background:var(--panel);border-radius:.35rem;padding:.3rem .6rem;cursor:pointer}
.appbtn.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
#menubar{display:flex;background:var(--panel);border-bottom:1px solid var(--border);padding:0 .3rem;overflow-x:auto;scrollbar-width:none;position:relative}
#menubar button{border:0;background:none;padding:.32rem .7rem;white-space:nowrap;border-radius:.2rem;cursor:default}
#menubar button:hover,#menubar button.open{background:var(--hover)}
.dropdown{position:fixed;z-index:60;min-width:16rem;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.35);padding:.25rem 0;border-radius:.25rem}
.mi{display:flex;justify-content:space-between;align-items:center;gap:1.6rem;padding:.3rem .9rem;position:relative;white-space:nowrap;cursor:default}
.mi:hover{background:var(--accent);color:#fff}
.mi kbd{border:0;background:none;padding:0;font-weight:400;color:var(--muted)}
.mi:hover>kbd,.mi:hover>.arr{color:#e6f0ff}
.msep{height:1px;background:var(--border);margin:.25rem 0}
.mi .sub{display:none;position:absolute;left:100%;top:-.3rem;min-width:15rem;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.35);padding:.25rem 0;border-radius:.25rem}
.dropdown.flip .sub{left:auto;right:100%}
.mi.has-sub:hover>.sub,.mi.has-sub.open>.sub{display:block}
#options{display:flex;align-items:center;gap:.7rem;padding:.3rem .7rem;background:var(--panel);border-bottom:1px solid var(--border);min-height:2.6rem;overflow-x:auto;white-space:nowrap;position:relative}
#options .oico{display:grid;place-items:center;width:2rem;height:1.8rem;border-right:1px solid var(--border);padding-right:.4rem}
#options .oico .ico{width:1.3rem;height:1.3rem}
.ctl{display:flex;align-items:center;gap:.3rem;color:var(--muted)}
.ctl input[type=range]{width:6rem}
.seg{display:flex;border:1px solid var(--border);border-radius:.25rem;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:.15rem .45rem;cursor:pointer;min-width:1.8rem}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent);color:#fff}
.spacer{flex:1}
.obtn{border:1px solid var(--border);background:var(--panel2);border-radius:.25rem;padding:.15rem .6rem;cursor:pointer}
.obtn .ico{width:1rem;height:1rem;display:block}
.obtn.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
select,input[type=number],input[type=text]{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:.25rem;padding:.15rem .3rem;font:inherit}
input[type=number]{width:4.2rem}
.mini{width:1.35rem;height:1.35rem;border:1px solid #888;border-radius:.15rem;cursor:pointer;flex:none;padding:0}
#main{display:grid;grid-template-columns:auto 1fr minmax(17rem,21rem);min-height:0}
#toolbar{background:var(--panel);border-right:1px solid var(--border);padding:.3rem;display:grid;grid-template-columns:2.1rem;gap:.1rem;align-content:start;overflow-y:auto;position:relative}
#toolbar.double{grid-template-columns:repeat(2,2.1rem)}
.tbtop{grid-column:1/-1;height:1.2rem;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;border-radius:.2rem}
.tbtop:hover{background:var(--hover)}
.tool{position:relative;height:2.1rem;border:0;background:none;border-radius:.25rem;display:grid;place-items:center;cursor:pointer;padding:0;touch-action:none}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--active)}
.tool .ico{width:1.35rem;height:1.35rem;pointer-events:none}
.tri{position:absolute;right:1px;bottom:1px;width:.55rem;height:.55rem;display:block}
.tri::after{content:"";position:absolute;right:1px;bottom:1px;border-left:.32rem solid transparent;border-bottom:.32rem solid currentColor;opacity:.75}
.tool.hint{animation:pulse .5s 5 alternate}
@keyframes pulse{to{background:var(--maroon);color:#fff}}
@media (prefers-reduced-motion:reduce){.tool.hint{animation:none;background:var(--maroon);color:#fff}}
.tsep{grid-column:1/-1;height:1px;background:var(--border);margin:.2rem 0}
.fgbg{grid-column:1/-1;position:relative;width:2.9rem;height:2.9rem;margin:.5rem auto .2rem}
.fgbg .sw{position:absolute;width:1.75rem;height:1.75rem;border:1px solid #888;box-shadow:0 0 0 1px var(--panel);cursor:pointer;padding:0}
.fgbg .fg{left:0;top:0;z-index:2}
.fgbg .bg{right:0;bottom:0;z-index:1}
.fgbg .sm{position:absolute;border:0;background:none;padding:0;cursor:pointer;font-size:.8rem;color:var(--text);line-height:1}
.fgbg .swap{right:-.2rem;top:-.25rem}
.fgbg .def{left:-.25rem;bottom:-.25rem;width:.9rem;height:.9rem}
.fgbg .def::before,.fgbg .def::after{content:"";position:absolute;width:.5rem;height:.5rem;border:1px solid #888}
.fgbg .def::before{left:0;top:0;background:#000;z-index:1}
.fgbg .def::after{left:.28rem;top:.28rem;background:#fff}
#flyout{position:fixed;z-index:55;background:var(--panel);border:1px solid var(--border);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.35);padding:.25rem;border-radius:.3rem;min-width:15rem}
.fi{display:flex;align-items:center;gap:.6rem;width:100%;border:0;background:none;padding:.35rem .5rem;cursor:pointer;border-radius:.2rem;text-align:left}
.fi:hover{background:var(--accent);color:#fff}
.fi.on{font-weight:700}
.fi .ico{width:1.3rem;height:1.3rem;flex:none}
.fi span{flex:1}
.fi kbd{border:0;background:none;font-weight:400;opacity:.75}
#docArea{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0;position:relative}
#doctab{display:flex;background:var(--panel2);border-bottom:1px solid var(--border);position:relative;min-width:0}
#doctab span{padding:.32rem .9rem;background:var(--canvas);color:var(--text);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#canvasWrap{position:relative;background:var(--canvas);min-width:0;min-height:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.txtin{position:absolute;z-index:15;background:rgba(255,255,255,.12);border:1px dashed var(--accent);padding:0 .15rem;min-width:9rem;outline:none;line-height:1.1}
#quizBar{position:absolute;left:50%;top:.8rem;transform:translateX(-50%);width:min(42rem,94%);z-index:20;background:var(--panel);border:2px solid var(--maroon);border-radius:.6rem;padding:.75rem 1rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.35)}
.qtop{display:flex;gap:1rem;color:var(--muted);font-size:.9rem}
.qtop b{color:var(--maroon)}
:root[data-theme="dark"] .qtop b{color:#e57399}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qtop b{color:#e57399}}
.qtop span:last-child{margin-left:auto}
.qtext{font-size:1.3rem;margin:.35rem 0;font-family:Cambria,Georgia,serif}
.qfb{min-height:1.4em;color:var(--muted)}
.qfb.ok{color:var(--good);font-weight:600}
.qfb.bad{color:var(--bad);font-weight:600}
.qbtns{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.3rem}
.qbtns button,.qa button{border:1px solid var(--border);background:var(--panel2);border-radius:.3rem;padding:.3rem .7rem;cursor:pointer}
.qa button:hover,.qbtns button:hover{background:var(--hover)}
.qa button.primary{background:var(--maroon);color:#fff;border-color:var(--maroon)}
#panels{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.phead{padding:.35rem .7rem;background:var(--panel2);border-bottom:1px solid var(--border);font-weight:600;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.phead span{color:var(--muted);font-weight:400}
#toolInfo{padding:.7rem;border-bottom:1px solid var(--border);overflow-y:auto;max-height:36%;flex:none}
.tihead{display:flex;align-items:center;gap:.6rem}
.tiicon{width:2.6rem;height:2.6rem;border-radius:.4rem;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;flex:none}
.tiicon .ico{width:1.7rem;height:1.7rem}
.tiname{font:700 1.15rem Cambria,Georgia,serif}
.tikey{color:var(--muted);font-size:.92rem}
.badge{margin-left:auto;font-size:.8rem;padding:.1rem .5rem;border-radius:1rem;flex:none}
.badge.live{background:#1d8a3a22;color:var(--good);border:1px solid var(--good)}
.badge.demo{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
#toolInfo p{margin:.5rem 0}
.acp{border-left:3px solid var(--maroon);background:var(--panel2);padding:.45rem .6rem;border-radius:0 .3rem .3rem 0;margin:.5rem 0}
.acp b{display:block;font-size:.85rem;color:var(--muted)}
.loc{color:var(--muted);font-size:.92rem}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel2);flex:none;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:.45rem .3rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{border-bottom-color:var(--text);color:var(--text);font-weight:600}
.tabbody{flex:1;overflow-y:auto;padding:.4rem .6rem .8rem;min-height:0}
.tabbody h4{margin:.8rem 0 .35rem;font-size:.92rem}
.prow{display:flex;align-items:center;gap:.5rem;margin:.35rem 0}
.prow>span:first-child{width:5.2rem;color:var(--muted);flex:none}
.prow input[type=range]{flex:1;min-width:0}
.prow output{width:2.8rem;text-align:right;font-variant-numeric:tabular-nums}
.qa{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.note{color:var(--muted);font-size:.92rem}
.muted{color:var(--muted)}
.ltop{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.2rem 0 .45rem;border-bottom:1px solid var(--border)}
.ltop select{flex:1;min-width:6rem}
.lrows{margin-top:.2rem}
.lrow{display:flex;align-items:center;gap:.35rem;padding:.25rem .2rem;border-radius:.2rem;cursor:pointer;border:1px solid transparent}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--active)}
.lrow.drop{border-top-color:var(--accent)}
.lrow.clip{padding-left:1.3rem}
.lrow .eye{border:0;background:none;padding:0;width:1.3rem;height:1.3rem;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.lrow .eye .ico{width:1rem;height:1rem}
.lthumb{width:2.6rem;height:2rem;border:1px solid #777;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.lthumb.tgt{outline:2px solid var(--text);outline-offset:1px}
.lthumb canvas{max-width:100%;max-height:100%;display:block}
.lthumb.kind{background:var(--panel2);color:var(--text);font:700 1rem Georgia,serif}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname i{color:var(--muted);font-style:normal;margin-left:.3rem;font-size:.85rem}
.lbtns{display:flex;gap:.2rem;justify-content:flex-end;border-top:1px solid var(--border);padding-top:.35rem;margin-top:.4rem;flex-wrap:wrap}
.lbtns button{border:1px solid var(--border);background:var(--panel2);border-radius:.25rem;min-width:2rem;height:1.8rem;cursor:pointer;display:grid;place-items:center;padding:0 .35rem}
.lbtns .ico{width:1.05rem;height:1.05rem}
.adjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.35rem}
.adjgrid button{border:1px solid var(--border);background:var(--panel2);border-radius:.3rem;padding:.4rem;cursor:pointer;text-align:left}
.adjgrid button:hover{background:var(--hover)}
.hrow{display:flex;align-items:center;gap:.45rem;padding:.3rem .35rem;border-radius:.2rem;cursor:pointer}
.hrow:hover{background:var(--hover)}
.hrow.cur{background:var(--active);font-weight:600}
.hrow.fut{opacity:.45}
.hrow .ico{width:1rem;height:1rem;flex:none}
.cpanel{display:flex;gap:.8rem;align-items:center}
.bigsw{position:relative;width:4rem;height:4rem;flex:none}
.bigsw input{position:absolute;width:2.6rem;height:2.6rem;padding:0;border:1px solid #888;cursor:pointer;background:none}
.bigsw .f{left:0;top:0;z-index:2}.bigsw .b{right:0;bottom:0}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(1.6rem,1fr));gap:.25rem}
.swc{aspect-ratio:1;border:1px solid #888;padding:0;cursor:pointer;border-radius:.1rem}
#status{display:flex;align-items:center;gap:1rem;padding:.2rem .7rem;background:var(--panel2);border-top:1px solid var(--border);color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;position:relative}
#status button{border:1px solid var(--border);background:var(--panel);border-radius:.2rem;padding:0 .4rem;cursor:pointer}
#stHint{overflow:hidden;text-overflow:ellipsis;flex:1}
#toast{position:fixed;left:50%;bottom:3.2rem;transform:translate(-50%,.6rem);opacity:0;transition:opacity .2s,transform .2s;max-width:min(36rem,92vw);background:#202020;color:#fff;padding:.65rem 1rem;border-radius:.45rem;z-index:90;pointer-events:none;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.4);border-left:4px solid var(--maroon)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast kbd{background:#333;border-color:#555;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:1rem}
.card{width:min(46rem,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:.7rem;padding:1.3rem 1.5rem;border-top:.4rem solid var(--maroon);box-shadow:0 1rem 3rem rgba(0,0,0,.5)}
.card.small{width:min(30rem,100%)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.45rem;margin:.4rem 0 .8rem}
.presets button{text-align:left;padding:.45rem .6rem;border:1px solid var(--border);border-radius:.4rem;background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;line-height:1.25}
.presets button small{display:block;color:var(--muted);font-size:.85em}
.presets button.on{border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon) inset}
.presets h5{grid-column:1/-1;margin:.3rem 0 0;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dimrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.6rem 1rem;margin:.4rem 0 .7rem}
.dimrow label{display:flex;flex-direction:column;font-weight:600;gap:.2rem}
.dimrow input[type=number],.dimrow select{font-size:1.05rem;padding:.3rem .4rem;width:7.5rem}
.dimrow input:disabled{opacity:.55}
.orient{display:flex;gap:.3rem}
.orient button{width:2.6rem;height:2.4rem;display:grid;place-items:center;border:1px solid var(--border);border-radius:.35rem;background:var(--panel2);cursor:pointer;color:var(--text)}
.orient button.on{border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon) inset}
.orient i{display:block;border:2px solid currentColor;border-radius:2px}
.refpt{display:grid;grid-template-columns:repeat(3,1.6rem);gap:.25rem;padding:.3rem;border:1px solid var(--border);border-radius:.35rem;width:max-content}
.refpt button{width:1.6rem;height:1.6rem;border:1px solid var(--border);background:var(--panel2);border-radius:2px;cursor:pointer;padding:0}
.refpt button.on{background:var(--maroon);border-color:var(--maroon)}
.dsinfo{background:var(--panel2);border-radius:.4rem;padding:.5rem .7rem;margin:.3rem 0 .7rem;line-height:1.45}
.dsinfo .warn{color:var(--bad,#c0392b);font-weight:600}
.lbl6{font-weight:600;margin-bottom:.2rem}
.card label.chk{display:flex;align-items:center;gap:.45rem;margin:.35rem 0}
.card h2{font:700 1.6rem/1.15 Cambria,Georgia,serif;margin:0 0 .3rem}
.card .sub{color:var(--muted);margin:0 0 1rem}
.card h4{margin:.9rem 0 .3rem}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.5rem .9rem;margin:.6rem 0 1rem}
.areas div{border-left:3px solid var(--maroon);padding:.1rem .6rem}
.areas b{display:block}
.bigscore{font:700 3rem Cambria,Georgia,serif;color:var(--maroon)}
.reftable{border-collapse:collapse;width:100%;font-size:.95rem}
.reftable td{border-bottom:1px solid var(--border);padding:.3rem .4rem;vertical-align:middle}
.reftable .ico{width:1.3rem;height:1.3rem}
.refcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}
.tblwrap{overflow-x:auto}
.foot{color:var(--muted);font-size:.85rem;margin-top:1rem}
.fld{display:block;font-weight:600;margin:.6rem 0}
.fnrow{display:flex;align-items:center;gap:.4rem;margin-top:.3rem;font-weight:400}
.fnrow input{flex:1;font-size:1.05rem;padding:.35rem .5rem}
.opts{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:.3rem 0 .6rem}
.opts label{display:flex;align-items:center;gap:.3rem}
.stylebox{border:1px solid var(--border);border-radius:.4rem;padding:.4rem .7rem;margin:.5rem 0}
.stylebox>label{font-weight:600;display:flex;gap:.4rem;align-items:center}
body.labels [data-label]::after{content:attr(data-label);position:absolute;z-index:45;left:.4rem;top:.3rem;background:var(--maroon);color:#fff;font:700 .85rem system-ui,sans-serif;padding:.15rem .5rem;border-radius:.25rem;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
body.labels #menubar::after,body.labels #options::after,body.labels #status::after,body.labels #doctab::after{left:auto;right:.4rem}
body.labels #toolbar::after{top:auto;bottom:.3rem;left:.15rem;font-size:.7rem}
body.labels #canvasWrap::after{top:auto;bottom:.5rem}
body.nopanels #toolbar,body.nopanels #panels,body.nopanels #options{display:none}
body.nopanels #main{grid-template-columns:1fr}
@media (max-width:820px){
  #main{grid-template-columns:auto 1fr;grid-template-rows:1fr 44%}
  #panels{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}
  #toolInfo{max-height:40%}
  .brand small{display:none}
  .modes{margin-left:0}
}
</style>
</head>
<body>
<div id="app">
  <header id="appbar">
    <div class="brand"><div class="mark">MC</div><b>Photoshop Workspace Trainer</b><small>Madison County Cowboys · Digital Design</small></div>
    <div class="modes" role="group" aria-label="Mode">
      <button data-act="mode-explore" class="on" id="mExplore">Explore</button>
      <button data-act="mode-find" id="mFind">Find the Tool</button>
      <button data-act="mode-keys" id="mKeys">Shortcut Challenge</button>

  const b=vecBox(d.layer);s.x=b.x;s.y=b.y;s.w=b.w;s.h=b.h;if(s.kind==='line'){/* keep direction */}pushHist(d.layer.name.replace(/ \d+$/,'')+' Tool','state');}
function insertAbove(N){const L=actL(),i=L?layers.indexOf(L)+1:layers.length;layers.splice(i,0,N);activeId=N.id;target='layer';markComp();}

/* crop */
function cropDown(p){if(!crop){crop={x:p.x,y:p.y,w:0,h:0};D={type:'crop',mode:'new',p0:p};return;}const r=normR(crop),hs=8/zoom;
  const hi=cropHandles(r).findIndex(([x,y])=>Math.abs(p.x-x)<hs&&Math.abs(p.y-y)<hs);
  if(hi>=0){D={type:'crop',mode:'h',h:hi,r0:r};return;}
  if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h){D={type:'crop',mode:'move',p0:p,r0:r};return;}
  crop={x:p.x,y:p.y,w:0,h:0};D={type:'crop',mode:'new',p0:p};}
function cropMove(p,e){if(D.mode==='new'){crop={x:D.p0.x,y:D.p0.y,w:p.x-D.p0.x,h:p.y-D.p0.y};if(e.shiftKey){const m=Math.max(Math.abs(crop.w),Math.abs(crop.h));crop.w=Math.sign(crop.w||1)*m;crop.h=Math.sign(crop.h||1)*m;}}
  else if(D.mode==='move'){crop={...D.r0,x:D.r0.x+p.x-D.p0.x,y:D.r0.y+p.y-D.p0.y};}
  else{const r=D.r0,h=D.h;let L=r.x,Tp=r.y,R=r.x+r.w,B=r.y+r.h;if([0,6,7].includes(h))L=p.x;if([2,3,4].includes(h))R=p.x;if([0,1,2].includes(h))Tp=p.y;if([4,5,6].includes(h))B=p.y;crop={x:L,y:Tp,w:R-L,h:B-Tp};}
  renderOptions();}
function commitCrop(){if(!crop)return;const r=normR(crop);crop=null;if(r.w<2||r.h<2){renderOptions();needsDraw=true;return;}const X=Math.round(r.x),Y=Math.round(r.y),W=Math.round(r.w),H=Math.round(r.h);
  resizeDoc(W,H,(L,old)=>{const n=mkCanvas(W,H);if(L.isBg){const x=cx2(n);x.fillStyle=S.bg;x.fillRect(0,0,W,H);}cx2(n).drawImage(old,(L.ox||0)-X,(L.oy||0)-Y);return n;},(o)=>{o.x-=X;o.y-=Y;},-X,-Y);
  pushHist('Crop','state');fit();renderOptions();}
function cancelCrop(){crop=null;D=null;needsDraw=true;renderOptions();}
function resizeDoc(W,H,pixFn,vecFn,mdx=0,mdy=0){const ow=doc.w,oh=doc.h;doc={w:W,h:H};
  layers.forEach(L=>{if(L.type==='pixel'){L.canvas=pixFn(L,L.canvas);L.ox=0;L.oy=0;L._dirty=true;}else if(isVec(L)){vecFn(L.type==='text'?L.text:L.shape,L);renderVector(L);}
    if(L.mask){const n=mkCanvas(W,H),x=cx2(n);if(pixFn.mask)x.drawImage(pixFn.mask(L.mask),0,0);else{x.fillStyle='#fff';x.fillRect(0,0,W,H);x.clearRect(mdx,mdy,ow,oh);x.drawImage(L.mask,mdx,mdy);}L.mask=n;L._mdirty=true;}});
  setSel(null);fitTemps();markComp();}

/* free transform */
function startTransform(){if(T_)return;const L=actL();if(!need(L))return;if(L.type==='adjust')return toast('Adjustment layers can\'t be transformed.');if(L.isBg)return toast('The Background layer is locked. Double-click it in the Layers panel to make it a regular layer first.');
  if(isVec(L)){const o=L.type==='text'?L.text:L.shape,b=vecBox(L);T_={layer:L,kind:'vec',o0:{...o},box:{cx:b.x+b.w/2,cy:b.y+b.h/2,w:b.w*(o.sx||1),h:b.h*(o.sy||1),rot:(o.rot||0)*Math.PI/180}};T_.b0={...T_.box};}
  else{const full=mkCanvas(),fx=cx2(full);fx.drawImage(L.canvas,L.ox,L.oy);if(sel){fx.globalCompositeOperation='destination-in';fx.drawImage(sel,0,0);fx.globalCompositeOperation='source-over';}
    const bb=alphaBBox(full);if(!bb)return toast('This layer is empty — nothing to transform.');const src=mkCanvas(bb.w,bb.h);cx2(src).drawImage(full,-bb.x,-bb.y);
    const snap=cloneCanvas(L.canvas),lx=cx2(L.canvas);if(sel){lx.globalCompositeOperation='destination-out';lx.drawImage(sel,-L.ox,-L.oy);lx.globalCompositeOperation='source-over';}else lx.clearRect(0,0,L.canvas.width,L.canvas.height);
    T_={layer:L,kind:'pixel',src,snap,box:{cx:bb.x+bb.w/2,cy:bb.y+bb.h/2,w:bb.w,h:bb.h,rot:0}};T_.b0={...T_.box};}
  setSel(null);markComp();renderOptions();toast('Free Transform: drag a corner to resize (Shift = unlock proportions), drag outside to rotate, drag inside to move. Enter commits, Esc cancels.',5500);}
function tHit(p){const b=T_.box,pts=tCorners(b),hs=9/zoom;const h=pts.findIndex(([x,y])=>Math.hypot(p.x-x,p.y-y)<hs);if(h>=0)return {h};
  const c=Math.cos(-b.rot),s=Math.sin(-b.rot),lx=(p.x-b.cx)*c-(p.y-b.cy)*s,ly=(p.x-b.cx)*s+(p.y-b.cy)*c;if(Math.abs(lx)<=b.w/2&&Math.abs(ly)<=b.h/2)return {move:1};return {rot:1};}
function tCursor(p){const h=tHit(p);return h.move?'move':h.rot?'alias':'nwse-resize';}
function tDown(p,e){D={type:'tf',hit:tHit(p),p0:p,b0:{...T_.box}};}
function tMove(p,e){const b0=D.b0,b=T_.box,hit=D.hit;
  if(hit.move){b.cx=b0.cx+p.x-D.p0.x;b.cy=b0.cy+p.y-D.p0.y;}
  else if(hit.rot){let a=b0.rot+Math.atan2(p.y-b0.cy,p.x-b0.cx)-Math.atan2(D.p0.y-b0.cy,D.p0.x-b0.cx);if(e.shiftKey)a=Math.round(a/(Math.PI/12))*(Math.PI/12);b.rot=a;}
  else{const h=hit.h,c=Math.cos(-b0.rot),s=Math.sin(-b0.rot),lx=(p.x-b0.cx)*c-(p.y-b0.cy)*s,ly=(p.x-b0.cx)*s+(p.y-b0.cy)*c,U=[-1,0,1,1,1,0,-1,-1][h],V=[-1,-1,-1,0,1,1,1,0][h];
    let w=b0.w,hh=b0.h;if(U)w=Math.max(4,U*lx+b0.w/2);if(V)hh=Math.max(4,V*ly+b0.h/2);
    if(U&&V&&!e.shiftKey){const k=Math.max(w/b0.w,hh/b0.h);w=b0.w*k;hh=b0.h*k;}
    const dxl=U?U*(w-b0.w)/2:0,dyl=V?V*(hh-b0.h)/2:0,cr=Math.cos(b0.rot),sr=Math.sin(b0.rot);b.w=w;b.h=hh;b.cx=b0.cx+dxl*cr-dyl*sr;b.cy=b0.cy+dxl*sr+dyl*cr;}
  if(T_.kind==='vec')applyVecT();markComp();renderOptions();}
function applyVecT(){const L=T_.layer,o=L.type==='text'?L.text:L.shape,o0=T_.o0,b=T_.box,b0=T_.b0;Object.assign(o,o0);o.sx=(o0.sx||1)*b.w/b0.w;o.sy=(o0.sy||1)*b.h/b0.h;o.rot=b.rot*180/Math.PI;o.x=o0.x+(b.cx-b0.cx);o.y=o0.y+(b.cy-b0.cy);renderVector(L);}
function commitTransform(){if(!T_)return;const t=T_;T_=null;D=null;if(t.kind==='pixel'){const L=t.layer,x=cx2(L.canvas),b=t.box;x.save();x.translate(b.cx-L.ox,b.cy-L.oy);x.rotate(b.rot);x.imageSmoothingQuality='high';x.drawImage(t.src,-b.w/2,-b.h/2,b.w,b.h);x.restore();L._dirty=true;}
  pushHist('Free Transform');renderOptions();}
function cancelTransform(){if(!T_)return;const t=T_;T_=null;D=null;if(t.kind==='pixel'){const L=t.layer;cx2(L.canvas).clearRect(0,0,L.canvas.width,L.canvas.height);cx2(L.canvas).drawImage(t.snap,0,0);}else{const L=t.layer,o=L.type==='text'?L.text:L.shape;Object.assign(o,t.o0);renderVector(L);}markComp();renderOptions();}
function flipLayer(h){const L=actL();if(!need(L)||L.type==='adjust')return;if(isVec(L)){const o=L.type==='text'?L.text:L.shape;if(h)o.sx=-(o.sx||1);else o.sy=-(o.sy||1);renderVector(L);pushHist(h?'Flip Horizontal':'Flip Vertical');return;}
  const bb=alphaBBox(L.canvas);if(!bb)return;const n=mkCanvas(L.canvas.width,L.canvas.height),x=cx2(n),cxm=bb.x+bb.w/2,cym=bb.y+bb.h/2;x.translate(cxm,cym);x.scale(h?-1:1,h?1:-1);x.translate(-cxm,-cym);x.drawImage(L.canvas,0,0);L.canvas=n;L._dirty=true;pushHist(h?'Flip Horizontal':'Flip Vertical');}

      while(p+12<=exEnd){const sig=STR(4),k=STR(4),l=U32(),st=p;if(k==='luni'){const n=U32();let s='';for(let j=0;j<n;j++)s+=String.fromCharCode(d.getUint16(p+j*2));name=s.replace(/\0+$/,'');}if(k==='lsct'){divider=d.getUint32(st);}p=st+l+(l%2);}p=exEnd;

function paintScene(c){const x=cx2(c),W=c.width,H=c.height;let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  let g=x.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,'#3d7fc4');g.addColorStop(.7,'#9cc6e8');g.addColorStop(1,'#f3d9b6');x.fillStyle=g;x.fillRect(0,0,W,H*.58);

  for(let k=0;k<5;k++){const cx=rnd()*W,cy=40+rnd()*H*.2,s=30+rnd()*50;x.fillStyle='rgba(255,255,255,.55)';for(let j=0;j<7;j++){x.beginPath();x.ellipse(cx+(rnd()-.5)*s*2.4,cy+(rnd()-.5)*s*.5,s*(.5+rnd()*.5),s*(.3+rnd()*.25),0,0,Math.PI*2);x.fill();}}
  const ridge=(base,amp,col,rough)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,H*.58);let y=base;for(let px=0;px<=W;px+=8){y+=(rnd()-.5)*rough;y=clamp(y,base-amp,base+amp*.4);x.lineTo(px,y-Math.sin(px/W*Math.PI*1.3+base)*amp*.6);}x.lineTo(W,H*.58);x.fill();return;};
  ridge(H*.33,H*.12,'#6f86a8',18);ridge(H*.42,H*.08,'#4d6b5a',14);ridge(H*.5,H*.05,'#2f5140',10);
  g=x.createLinearGradient(0,H*.58,0,H);g.addColorStop(0,'#7fa9c9');g.addColorStop(1,'#2e5a78');x.fillStyle=g;x.fillRect(0,H*.58,W,H*.3);
  x.save();x.globalAlpha=.35;x.translate(0,H*1.16);x.scale(1,-1);x.drawImage(c,0,H*.3,W,H*.28,0,H*.3,W,H*.28);x.restore();
  x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=1;for(let k=0;k<70;k++){const y=H*.6+rnd()*H*.26,px=rnd()*W,l=10+rnd()*40;x.beginPath();x.moveTo(px,y);x.lineTo(px+l,y);x.stroke();}
  g=x.createLinearGradient(0,H*.85,0,H);g.addColorStop(0,'#5c7d33');g.addColorStop(1,'#3b5320');x.fillStyle=g;x.beginPath();x.moveTo(0,H*.86);for(let px=0;px<=W;px+=20)x.lineTo(px,H*.86+Math.sin(px/60)*6+rnd()*4);x.lineTo(W,H);x.lineTo(0,H);x.fill();
  for(let k=0;k<22;k++){const tx=(k<11?rnd()*W*.28:W*.78+rnd()*W*.22),th=60+rnd()*70,tb=H*.88+rnd()*12;x.fillStyle=`hsl(${130+rnd()*20},${35+rnd()*15}%,${16+rnd()*10}%)`;for(let j=0;j<3;j++){const w=th*(.34-j*.07),y=tb-th*(j*.28);x.beginPath();x.moveTo(tx,y-th*.45);x.lineTo(tx+w,y);x.lineTo(tx-w,y);x.fill();}x.fillStyle='#3a2a1a';x.fillRect(tx-3,tb,6,10);}
  // a small red boat to recolor or clone
  x.fillStyle='#c0262d';x.beginPath();x.moveTo(W*.44,H*.7);x.lineTo(W*.52,H*.7);x.lineTo(W*.505,H*.725);x.lineTo(W*.455,H*.725);x.fill();x.fillStyle='#f3f0e8';x.beginPath();x.moveTo(W*.482,H*.62);x.lineTo(W*.482,H*.695);x.lineTo(W*.515,H*.695);x.fill();
  // grain, then dust spots to heal
  const im=x.getImageData(0,0,W,H),d=im.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*10;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}x.putImageData(im,0,0);
  [[.14,.12,7],[.3,.22,5],[.55,.1,6],[.62,.2,4],[.86,.14,8],[.4,.33,5]].forEach(([u,v,r])=>{const gg=x.createRadialGradient(W*u,H*v,0,W*u,H*v,r);gg.addColorStop(0,'rgba(30,30,35,.85)');gg.addColorStop(.6,'rgba(30,30,35,.5)');gg.addColorStop(1,'rgba(30,30,35,0)');x.fillStyle=gg;x.beginPath();x.arc(W*u,H*v,r,0,Math.PI*2);x.fill();});}
