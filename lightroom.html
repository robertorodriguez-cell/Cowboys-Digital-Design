<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lightroom Classic Workspace Trainer — Madison County Cowboys</title>
<style>
:root{
  --maroon:#8A0635;--black:#0A0A0A;--silver:#9E9FA3;
  --bg:#141414;--pan:#282828;--panHead:#1e1e1e;--line:#101010;--tx:#a8a8a8;--hi:#e6e6e6;--dim:#6f6f6f;
  --ctr:#3b3b3b;--cell:#4a4a4a;--cellSel:#7a7a7a;--cellAct:#9a9a9a;--field:#1b1b1b;--btn:#3d3d3d;--btnHi:#555;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{min-width:1080px}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid #7fb2ff;outline-offset:1px}
#app{display:grid;grid-template-rows:auto auto auto auto 1fr auto;height:100%}
/* trainer bar */
#tbar{display:flex;align-items:center;gap:14px;background:var(--maroon);color:#fff;padding:6px 12px;border-bottom:2px solid var(--black)}
.brand{display:flex;align-items:center;gap:10px}
.bmark{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;background:#0A0A0A;color:#9ecbff;font:700 15px/1 "Segoe UI",system-ui,sans-serif;border:1px solid #3a6ea5}
.brand b{display:block;font:700 16px/1.1 Cambria,Georgia,serif;letter-spacing:.2px}
.brand small{display:block;font:12px/1.2 Calibri,"Segoe UI",sans-serif;color:#f2d3dd}
#modes{display:flex;gap:4px;margin-left:10px}
#modes button,.tright>button{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:5px 11px;cursor:pointer;font:600 13px Calibri,"Segoe UI",sans-serif}
#modes button:hover,.tright>button:hover{background:rgba(0,0,0,.45)}
#modes button.on{background:#fff;color:var(--maroon);border-color:#fff}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;cursor:pointer;font:600 13px Calibri,sans-serif}
.seg button.on{background:#fff;color:var(--maroon)}
.chk{display:flex;align-items:center;gap:5px;font:13px Calibri,sans-serif;cursor:pointer}
/* quiz bar */
#quizbar{display:flex;align-items:center;gap:16px;background:#0A0A0A;color:#fff;padding:8px 14px;border-bottom:3px solid var(--maroon);font:15px Calibri,"Segoe UI",sans-serif}
#quizbar[hidden]{display:none}
#quizbar .qp{font:700 19px Cambria,Georgia,serif;flex:1}
#quizbar .qs{color:var(--silver)}
#quizbar button{background:var(--maroon);border:0;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font:600 14px Calibri,sans-serif}
#quizbar button.ghost{background:#333}
#quizbar .fb{min-width:220px;font-weight:600}
#quizbar .fb.ok{color:#7ddc8a}#quizbar .fb.no{color:#ff8a8a}
/* menubar */
#menubar{display:flex;background:#0f0f0f;border-bottom:1px solid #000;height:24px;align-items:stretch;padding-left:6px;position:relative;z-index:40}
.mitem{padding:0 10px;display:flex;align-items:center;cursor:default;color:#c8c8c8}
.mitem:hover,.mitem.open{background:#2f5f9e;color:#fff}
.mdrop{position:absolute;top:24px;min-width:260px;background:#2d2d2d;border:1px solid #000;box-shadow:0 6px 20px rgba(0,0,0,.6);padding:4px 0;display:none}
.mitem.open .mdrop{display:block}
.mrow{display:flex;justify-content:space-between;gap:24px;padding:4px 16px;color:#ddd;white-space:nowrap}
.mrow:hover{background:#2f5f9e;color:#fff}
.mrow.dis{color:#666;pointer-events:none}
.mrow kbd{font:inherit;color:#9a9a9a}
.mrow:hover kbd{color:#dfe9f7}
.msep{height:1px;background:#444;margin:4px 0}
/* top panel */
#toppanel{display:flex;align-items:center;justify-content:space-between;background:#0c0c0c;height:52px;padding:0 18px;border-bottom:1px solid #000}
#idplate{display:flex;align-items:center;gap:10px;color:#cfcfcf}
#idplate .lr{font:700 12px system-ui;color:#9ecbff;background:#001e36;border:1px solid #31a8ff55;border-radius:4px;padding:3px 5px}
#idplate .nm{font:italic 600 18px Cambria,Georgia,serif;color:#e2e2e2}
#idplate .nm span{color:#c43a66}
#modules{display:flex;gap:2px;align-items:baseline}
#modules button{background:none;border:0;color:#6b6b6b;font:15px "Segoe UI",system-ui,sans-serif;padding:4px 7px;cursor:pointer}
#modules button:hover{color:#bdbdbd}
#modules button.on{color:#f4f4f4}
#modules i{color:#3b3b3b;font-style:normal}
/* main */
#main{display:grid;grid-template-columns:var(--lw,248px) 1fr var(--rw,300px);min-height:0}
#app.hideSides #main{--lw:0px;--rw:0px}
#app.hideAll #main{--lw:0px;--rw:0px}
#app.hideAll #film,#app.hideAll #toppanel,#app.hideAll #menubar{display:none}
aside{background:var(--pan);overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:#555 #222}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
#center{background:var(--ctr);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
[data-mod]{}
#app[data-module="library"] [data-mod]:not([data-mod~="library"]),
#app[data-module="develop"] [data-mod]:not([data-mod~="develop"]),
#app[data-module="slideshow"] [data-mod]:not([data-mod~="slideshow"]),
#app[data-module="print"] [data-mod]:not([data-mod~="print"]),
#app[data-module="map"] [data-mod]:not([data-mod~="other"]),
#app[data-module="book"] [data-mod]:not([data-mod~="other"]),
#app[data-module="web"] [data-mod]:not([data-mod~="other"]){display:none!important}
/* panels */
.panel{border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:6px;height:25px;padding:0 10px;background:var(--panHead);color:#cfcfcf;font-size:12.5px;cursor:pointer;border-top:1px solid #333}
#right .ph{justify-content:flex-end}
.ph::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #8a8a8a;order:-1}
#right .ph::before{order:2}
.panel.closed .ph::before{border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid #8a8a8a;border-right:0}
.panel.closed>.pb{display:none}
.ph .pext{margin-right:auto;color:#8c8c8c;font-size:11px}
#right .ph .pext{order:-1}
.pb{padding:8px 10px 10px}
.sub{color:#8d8d8d;font-size:11px;margin:8px 0 3px;display:flex;justify-content:space-between;align-items:center}
.sub:first-child{margin-top:0}
/* slider rows */
.srow{display:grid;grid-template-columns:82px 1fr 48px;align-items:center;gap:6px;height:22px}
.srow>label{text-align:right;color:#b5b5b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.srow>label:hover{color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--trk,#5c5c5c);border-radius:1px}
input[type=range]::-moz-range-track{height:3px;background:var(--trk,#5c5c5c);border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:10px;margin-top:-4px;background:#d2d2d2;clip-path:polygon(50% 100%,0 0,100% 0);border:0}
input[type=range]::-moz-range-thumb{width:11px;height:10px;background:#d2d2d2;clip-path:polygon(50% 100%,0 0,100% 0);border:0;border-radius:0}
input[type=range]:hover::-webkit-slider-thumb{background:#fff}
input.num{width:48px;background:transparent;border:1px solid transparent;color:#dcdcdc;text-align:right;padding:1px 3px;border-radius:2px}
input.num:hover{border-color:#555}input.num:focus{background:var(--field);border-color:#777;outline:none}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row.between{justify-content:space-between}
.btn{background:var(--btn);border:1px solid #1a1a1a;border-radius:3px;color:#d8d8d8;padding:3px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--btnHi)}
.btn.on{background:#9a9a9a;color:#111}
.btn.sm{padding:1px 6px;font-size:11px}
.btn.wide{flex:1}
.btn:disabled{opacity:.4;cursor:default}
select.sel{background:var(--field);border:1px solid #444;color:#ddd;border-radius:3px;padding:2px 4px}
input.txt,textarea.txt{background:var(--field);border:1px solid #444;color:#ddd;border-radius:3px;padding:3px 5px;width:100%;-webkit-user-select:text;user-select:text}
.bottombtns{display:flex;gap:6px;padding:8px 10px;position:sticky;bottom:0;background:#202020;border-top:1px solid #111}
.bottombtns .btn{flex:1;padding:5px}
/* histogram */
#histo{display:block;width:100%;height:110px;background:#1a1a1a;border:1px solid #111;cursor:ew-resize}
.hinfo{display:flex;justify-content:space-between;color:#9a9a9a;font-size:11px;margin-top:4px;min-height:15px}
/* tool strip */
.tools{display:flex;justify-content:space-around;padding:6px 8px;background:#232323;border-bottom:1px solid #111}
.tool{width:34px;height:26px;display:grid;place-items:center;border-radius:3px;cursor:pointer;color:#bbb;border:1px solid transparent}
.tool:hover{background:#3a3a3a}
.tool.on{background:#4c4c4c;border-color:#777;color:#fff}
.tool.dis{opacity:.35;cursor:not-allowed}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.drawer{background:#303030;border-bottom:1px solid #111;padding:8px 10px}
.drawer[hidden]{display:none}
.drawer h4{margin:0 0 6px;font-weight:600;color:#e2e2e2;font-size:12px;display:flex;justify-content:space-between}
/* tabs */
.tabs{display:flex;gap:2px;margin-bottom:6px}
.tabs button{flex:1;background:#222;border:1px solid #111;color:#aaa;padding:3px 0;cursor:pointer;font-size:11.5px}
.tabs button.on{background:#555;color:#fff}
/* wheels */
.wheels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.wheels canvas{width:100%;aspect-ratio:1;cursor:crosshair}
.wheels .wl{font-size:11px;color:#aaa}
/* curve */
#curve{width:100%;aspect-ratio:1;background:#1c1c1c;border:1px solid #111;display:block;cursor:crosshair}
/* left panel lists */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;border-radius:2px;cursor:pointer;color:#bcbcbc}
.list li:hover{background:#353535}
.list li.on{background:#5a5a5a;color:#fff}
.list li .ct{color:#888;font-size:11px}
.list li.drop{outline:1px dashed #9ecbff}
.list li.grp{color:#8c8c8c;cursor:default;font-size:11px;padding-top:7px}
.list li.grp:hover{background:none}
#navcv{display:block;width:100%;aspect-ratio:3/2;background:#1a1a1a;border:1px solid #111;cursor:pointer}
.navz{display:flex;gap:8px;justify-content:flex-end;font-size:11px;margin-bottom:4px}
.navz span{cursor:pointer;color:#888}.navz span.on{color:#fff}
/* center: library */
#filterBar{display:flex;align-items:center;gap:14px;background:#2d2d2d;padding:4px 12px;border-bottom:1px solid #111;min-height:30px}
#filterBar .fl{color:#888}
#filterBar .ftab{cursor:pointer;color:#9a9a9a}
#filterBar .ftab.on{color:#fff}
#filterBody{display:flex;align-items:center;gap:10px}
#libView{flex:1;min-height:0;position:relative}
#grid{position:absolute;inset:0;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cs,170px),1fr));gap:6px;align-content:start;scrollbar-width:thin}
.cell{position:relative;background:var(--cell);border-radius:2px;aspect-ratio:1/1.08;display:flex;flex-direction:column;border:1px solid #2f2f2f;cursor:default}
.cell.sel{background:var(--cellSel)}
.cell.act{background:var(--cellAct)}
.cell .idx{position:absolute;top:2px;left:6px;font:700 26px/1 "Segoe UI",sans-serif;color:rgba(0,0,0,.18)}
.cell .th{flex:1;display:grid;place-items:center;padding:14px 10px 4px}
.cell canvas{max-width:100%;max-height:100%;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.cell .ft{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#222;font-size:11px}
.cell .stars{letter-spacing:1px;color:#111}
.cell .flag{width:12px;height:12px}
.cell .badge{position:absolute;top:4px;right:6px;font-size:10px;background:#111;color:#ddd;padding:0 4px;border-radius:2px}
.cell .lbl{position:absolute;inset:0;border-radius:2px;pointer-events:none}
.cell.rejected canvas{opacity:.35}
#loupe,#compare,#survey{position:absolute;inset:0;display:none}
#libView[data-v="grid"] #grid{display:grid}
#libView:not([data-v="grid"]) #grid{display:none}
#libView[data-v="loupe"] #loupe,#libView[data-v="compare"] #compare,#libView[data-v="survey"] #survey{display:block}
#loupe canvas,#compare canvas,#survey canvas{width:100%;height:100%;display:block}
.loupeinfo{position:absolute;top:10px;left:12px;color:#eee;text-shadow:0 1px 2px #000;font-size:13px;pointer-events:none;white-space:pre-line}
.toolbar{display:flex;align-items:center;gap:12px;background:#262626;border-top:1px solid #111;padding:4px 10px;min-height:34px;flex-wrap:wrap}
.toolbar .tb{display:flex;align-items:center;gap:4px}
.vbtn{width:28px;height:22px;display:grid;place-items:center;border:1px solid #111;background:#333;border-radius:2px;cursor:pointer;color:#bbb}
.vbtn.on{background:#777;color:#fff}
.vbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4}
.starbar span{cursor:pointer;font-size:15px;color:#666;padding:0 1px}
.starbar span.on{color:#ddd}
.flagbtn{cursor:pointer;padding:1px 3px;border-radius:2px;color:#888}
.flagbtn:hover{background:#444}
.labelbar span{display:inline-block;width:13px;height:13px;border-radius:2px;cursor:pointer;border:1px solid #111;margin:0 1px}
/* develop center */
#devWrap{flex:1;position:relative;min-height:0}
#devCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#baLabel{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:3px 10px;border-radius:3px;font-size:12px;pointer-events:none}
#baLabel[hidden]{display:none}
#challenge{position:absolute;top:10px;right:10px;width:330px;background:rgba(10,10,10,.92);border:2px solid var(--maroon);border-radius:6px;padding:10px;color:#eee;z-index:5;font:14px Calibri,"Segoe UI",sans-serif}
#challenge[hidden]{display:none}
#challenge h3{margin:0 0 4px;font:700 18px Cambria,Georgia,serif}
#challenge canvas{width:100%;display:block;border:1px solid #333;margin:6px 0}
#challenge .cbtns{display:flex;gap:6px;flex-wrap:wrap}
#challenge .cbtns button{flex:1;background:var(--maroon);color:#fff;border:0;border-radius:4px;padding:6px;cursor:pointer;font:600 13px Calibri,sans-serif}
#challenge .cbtns button.ghost{background:#333}
#challenge table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
#challenge td{padding:2px 4px;border-bottom:1px solid #333}
#challenge .score{font:700 30px Cambria,serif;color:#fff}
/* filmstrip */
#film{background:#1c1c1c;border-top:1px solid #000;height:118px;display:flex;flex-direction:column}
#filmhead{display:flex;align-items:center;gap:12px;height:24px;padding:0 10px;color:#9a9a9a;font-size:11.5px;border-bottom:1px solid #111}
#filmhead .path{color:#cfcfcf}
#filmhead .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
#strip{flex:1;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:6px 8px;scrollbar-width:thin}
.fcell{flex:0 0 auto;height:100%;aspect-ratio:1.25;background:#3a3a3a;border-radius:2px;display:grid;place-items:center;border:1px solid #111;position:relative}
.fcell.sel{background:#6a6a6a}.fcell.act{background:#8f8f8f}
.fcell canvas{max-width:90%;max-height:78%}
.fcell .fs{position:absolute;bottom:1px;left:4px;font-size:9px;color:#111;letter-spacing:1px}
/* slideshow / print / other */
.stage{flex:1;display:grid;place-items:center;min-height:0;padding:20px}
.stage canvas{max-width:100%;max-height:100%;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.infocard{max-width:560px;background:#2a2a2a;border:1px solid #111;border-radius:6px;padding:22px 26px;color:#cfcfcf;font-size:14px;line-height:1.55}
.infocard h2{margin:0 0 8px;font:700 22px Cambria,Georgia,serif;color:#fff}
#showOverlay{position:fixed;inset:0;background:#000;z-index:90;display:grid;place-items:center}
#showOverlay[hidden]{display:none}
#showOverlay canvas{max-width:96vw;max-height:88vh;transition:opacity .6s}
#showOverlay .cap{position:absolute;bottom:4vh;color:#ddd;font:18px Calibri,sans-serif}
#fullPrev{position:fixed;inset:0;background:#000;z-index:85;display:grid;place-items:center}
#fullPrev[hidden]{display:none}
#fullPrev canvas{max-width:100vw;max-height:100vh}
/* lights out */
#lights{position:fixed;inset:0;pointer-events:none;z-index:30;background:#000;opacity:0;transition:opacity .35s}
/* dialogs */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100}
.dlg .box{background:#353535;color:#ddd;border:1px solid #000;border-radius:5px;min-width:520px;max-width:min(920px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.dlg .dt{padding:9px 14px;border-bottom:1px solid #222;font-weight:600;color:#fff;font-size:13px;display:flex;justify-content:space-between}
.dlg .db{padding:14px;overflow:auto;font-size:12.5px}
.dlg .df{padding:10px 14px;border-top:1px solid #222;display:flex;justify-content:flex-end;gap:8px}
.dlg .df .btn{padding:5px 16px}
.dlg .btn.pri{background:#dcdcdc;color:#111}
.dlg fieldset{border:1px solid #4a4a4a;border-radius:4px;margin:0 0 10px;padding:8px 10px}
.dlg legend{color:#bbb;padding:0 4px}
.dlg label.opt{display:flex;align-items:center;gap:6px;margin:4px 0}
.imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.imgrid .ic{background:#2a2a2a;border:1px solid #111;border-radius:3px;padding:6px;text-align:center;font-size:11px}
.imgrid .ic.done{opacity:.35}
.imgrid canvas{width:100%;display:block;margin-bottom:4px}
.kbtable{columns:2;column-gap:28px}
.kbtable h5{margin:10px 0 4px;color:#fff;font-size:13px;break-after:avoid}
.kbtable div{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid #2c2c2c;break-inside:avoid}
.kbtable kbd{color:#9ecbff;font:600 12px Consolas,monospace}
.hint{color:#999;font-size:11.5px;margin-top:6px}
/* HUD */
#hud{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:rgba(10,10,10,.88);color:#fff;border:1px solid #555;border-radius:8px;padding:10px 20px;font:600 22px Calibri,"Segoe UI",sans-serif;z-index:120;pointer-events:none;opacity:0;transition:opacity .25s}
#hud kbd{font:700 22px Consolas,monospace;color:#9ecbff;margin-right:10px}
#hud.show{opacity:1}
#tip{position:fixed;z-index:130;background:#f3f3f3;color:#111;border:1px solid #888;padding:4px 8px;border-radius:3px;font-size:12px;max-width:320px;pointer-events:none;display:none;box-shadow:0 3px 10px rgba(0,0,0,.5)}
#tip b{display:block}
.qflash{animation:qf .9s ease-out}
@keyframes qf{0%{box-shadow:0 0 0 3px #7ddc8a inset,0 0 0 3px #7ddc8a}100%{box-shadow:none}}
.qwrong{animation:qw .6s ease-out}
@keyframes qw{0%{box-shadow:0 0 0 3px #ff6b6b inset}100%{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" data-module="library">
  <header id="tbar">
    <div class="brand"><span class="bmark">LrC</span><div><b>Lightroom Classic Workspace Trainer</b><small>Madison County High School Digital Design</small></div></div>
    <nav id="modes" aria-label="Trainer mode">
      <button data-mode="explore" class="on">Explore</button>
      <button data-mode="find">Find It quiz</button>
      <button data-mode="keys">Shortcut drill</button>
      <button data-mode="look">Match the look</button>
    </nav>
    <div class="tright">
      <div class="seg" id="osSeg" title="Show shortcuts for Mac or Windows"><button data-os="mac" class="on">Mac</button><button data-os="win">Windows</button></div>

/* Render a spec to pixels at W x H. Returns RGBA source plus sky/subject masks. */
function generate(spec,W,H){
 const sc=W/900;
 const cv=mkCanvas(W,H),c=cv.getContext('2d');
 const mv=mkCanvas(W,H),m=mv.getContext('2d');
 const sv=mkCanvas(W,H),s=sv.getContext('2d');
 m.fillStyle='#fff';m.fillRect(0,0,W,H);s.fillStyle='#000';s.fillRect(0,0,W,H);
 [c,m,s].forEach(k=>{k.setTransform(sc,0,0,H/600,0,0);if(spec.tilt&&spec.v!==1){k.translate(450,300);k.rotate(spec.tilt*Math.PI/180);k.scale(1.1,1.1);k.translate(-450,-300);}});
 const R=mulberry(spec.seed*7919+13);
 GEN[spec.kind](c,m,s,R,spec.v||0);
 const img=c.getImageData(0,0,W,H),d=img.data;
 const cast=spec.cast||[1,1,1],ex=spec.exp||1,hz=spec.haze||0;
 const LUT=[0,1,2].map(ch=>{const a=new Float32Array(256);for(let v=0;v<256;v++){let l=s2l(v/255)*cast[ch]*ex;let y=l2s(l);if(y>.8)y=.8+.2*(1-Math.exp(-(y-.8)/.2));a[v]=y;}return a;});
 const NR=mulberry(spec.seed*104729+7),nz=spec.noise||0;
 const hc=[.80,.83,.87];
 for(let i=0;i<d.length;i+=4){
  let r=LUT[0][d[i]],g=LUT[1][d[i+1]],b=LUT[2][d[i+2]];
  if(hz){r=r*(1-hz)+hc[0]*hz;g=g*(1-hz)+hc[1]*hz;b=b*(1-hz)+hc[2]*hz;}
  if(nz){const n=(NR()+NR()+NR()-1.5)*nz*1.6,k=nz*.7;r+=n+(NR()-.5)*k;g+=n+(NR()-.5)*k;b+=n+(NR()-.5)*k;}
  d[i]=r*255+.5;d[i+1]=g*255+.5;d[i+2]=b*255+.5;d[i+3]=255;
 }
 const out={rgba:d,W,H,sky:null,subj:null};
 const toMask=(ctx)=>{const md=ctx.getImageData(0,0,W,H).data,f=new Float32Array(W*H);for(let i=0;i<f.length;i++)f[i]=md[i*4]/255;return blurF(f,W,H,Math.max(1,Math.round(1.5*sc)),2);};
 if(spec.sky)out.sky=toMask(m);
 if(spec.subj)out.subj=toMask(s);
 return out;
}

/* ================= blur helpers ================= */
function boxPass(src,dst,W,H,r,horiz){
 const n=horiz?W:H,lines=horiz?H:W,inv=1/(2*r+1);
 for(let l=0;l<lines;l++){
  const base=horiz?l*W:l,step=horiz?1:W;
  let acc=0;
  for(let k=-r;k<=r;k++)acc+=src[base+clamp(k,0,n-1)*step];
  for(let i=0;i<n;i++){dst[base+i*step]=acc*inv;const a=clamp(i+r+1,0,n-1),b=clamp(i-r,0,n-1);acc+=src[base+a*step]-src[base+b*step];}
 }
}
function blurF(f,W,H,r,passes){if(r<1)return f;let a=f.slice(),t=new Float32Array(f.length);for(let p=0;p<(passes||3);p++){boxPass(a,t,W,H,r,true);boxPass(t,a,W,H,r,false);}return a;}
function lumOf(rgba,n){const L=new Float32Array(n);for(let i=0,p=0;i<n;i++,p+=4)L[i]=(rgba[p]*.2126+rgba[p+1]*.7152+rgba[p+2]*.0722)/255;return L;}
function blurRGB(rgba,W,H,r){const n=W*H,ch=[0,1,2].map(c=>{const f=new Float32Array(n);for(let i=0;i<n;i++)f[i]=rgba[i*4+c];return blurF(f,W,H,r,2);});const o=new Uint8ClampedArray(n*4);for(let i=0;i<n;i++){o[i*4]=ch[0][i];o[i*4+1]=ch[1][i];o[i*4+2]=ch[2][i];o[i*4+3]=255;}return o;}

/* A "level" holds everything needed to render one photo at one resolution. */
function buildLevel(spec,W,H){
 const g=generate(spec,W,H);
 const lv={W,H,orig:g.rgba,sky:g.sky,subj:g.subj,src:null,spotsKey:null,maskCache:new Map(),out:mkCanvas(W,H),rev:-1};
 lv.img=lv.out.getContext('2d').createImageData(W,H);
 const n=W*H,NR=mulberry(spec.seed+999);lv.noise=new Float32Array(n);for(let i=0;i<n;i++)lv.noise[i]=NR()+NR()-1;
 lv.noise2=blurF(lv.noise,W,H,Math.max(1,Math.round(W/600)),1);let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,Math.abs(lv.noise2[i]));for(let i=0;i<n;i++)lv.noise2[i]/=mx||1;
 return lv;
}

   if(a.dz){const t=a.dz/100*w;r=(r-.3*t*.8)/(1-.3*t*.8);gg=(gg-.3*t*.8)/(1-.3*t*.8);b=(b-.3*t*.8)/(1-.3*t*.8);}
   if(a.sat||a.dz>0){const s2=1+(a.sat/100+(a.dz>0?a.dz/250:0))*w,L2=.2126*r+.7152*gg+.0722*b;r=L2+(r-L2)*s2;gg=L2+(gg-L2)*s2;b=L2+(b-L2)*s2;}
  }
  if(vOn){const dx=(x-vcx)*vsx,dy=(y-vcy)*vsy,d=Math.sqrt(dx*dx+dy*dy),w=sstep(vr0,vr0+vfw,d);
   if(w>0){if(va<0){let f=1+va*w*.95;if(vHi){const L=.2126*r+.7152*gg+.0722*b;f=lerp(f,1,vHi*sstep(.6,1,L));}r*=f;gg*=f;b*=f;}else{const t=va*w*.9;r+=(1-r)*t;gg+=(1-gg)*t;b+=(1-b)*t;}}}
  if(grA){const nz=lerp(noise[i],noise2[i],grS)*(0.6+grR*.8),L=.2126*r+.7152*gg+.0722*b,dd=nz*grA*(.35+L*(1-L)*2.6);r+=dd;gg+=dd;b+=dd;}
  if(alt){if(alt==='hi'){r=r>=.996?1:0;gg=gg>=.996?1:0;b=b>=.996?1:0;}else{r=r<=.004?0:1;gg=gg<=.004?0:1;b=b<=.004?0:1;}}
  else if(clip){if(r>=.998||gg>=.998||b>=.998){r=1;gg=0;b=0;}else if(r<=.002&&gg<=.002&&b<=.002){r=0;gg=.35;b=1;}}
  if(ov){const w=ov[i]*.55;r=r+(1-r)*w;gg*=1-w;b*=1-w;}
  o[p]=r*255+.5;o[p+1]=gg*255+.5;o[p+2]=b*255+.5;o[p+3]=255;
 }}
 lv.out.getContext('2d').putImageData(lv.img,0,0);
 return lv.out;
}
/* crop a rendered level into a new canvas (applies angle + crop) */
function cropCanvas(lv,dev,maxLong){
 const cr=dev.crop,W=lv.W,H=lv.H,cw=Math.max(1,Math.round(cr.w*W)),ch=Math.max(1,Math.round(cr.h*H));
 let s=1;if(maxLong&&Math.max(cw,ch)>maxLong)s=maxLong/Math.max(cw,ch);
 const c=mkCanvas(Math.max(1,Math.round(cw*s)),Math.max(1,Math.round(ch*s))),x=c.getContext('2d');
 x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';
 x.setTransform(s,0,0,s,-cr.x*W*s,-cr.y*H*s);x.translate(W/2,H/2);x.rotate(cr.angle*Math.PI/180);x.translate(-W/2,-H/2);x.drawImage(lv.out,0,0);
 return c;
}

 MENUS.forEach(([name,items])=>{const it=document.createElement('div');it.className='mitem';it.textContent=name;const dd=document.createElement('div');dd.className='mdrop';
  items.forEach(id=>{if(id==='-'){dd.insertAdjacentHTML('beforeend','<div class="msep"></div>');return;}
   let label,keys='',run;
   if(id.startsWith('m:')){const m=id.slice(2);label=m[0].toUpperCase()+m.slice(1);run=()=>setModule(m);}
   else if(id==='h:about'){label='About this trainer';run=()=>openAbout();}
   else{const a=A[id];label=a.label;keys=fmtKey(a.keys[0]);run=a.run;}
   const r=document.createElement('div');r.className='mrow';r.innerHTML=`<span>${esc(label)}</span><kbd>${esc(keys)}</kbd>`;r.addEventListener('click',ev=>{ev.stopPropagation();closeMenus();run();});dd.appendChild(r);});
  it.appendChild(dd);
  it.addEventListener('mousedown',ev=>{if(ev.target.closest('.mdrop'))return;const was=it.classList.contains('open');closeMenus();if(!was)it.classList.add('open');});
  it.addEventListener('mouseenter',()=>{if($('.mitem.open')&&!it.classList.contains('open')){closeMenus();it.classList.add('open');}});
  mb.appendChild(it);});
 dd_left();
}
function dd_left(){$$('.mitem').forEach(it=>{const d=$('.mdrop',it);d.style.left=it.offsetLeft+'px';});}

document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');const tip=$('#tip');if(!el){tip.style.display='none';clearTimeout(tipT);return;}
 clearTimeout(tipT);tipT=setTimeout(()=>{let t=el.getAttribute('data-tip');const k=el.getAttribute('data-key');if(k)t+=` (${fmtKey(k)})`;const parts=t.split('|');tip.innerHTML=`<b>${esc(parts[0])}</b>${parts[1]?esc(parts[1]):''}`;tip.style.display='block';const r=el.getBoundingClientRect();let x=r.left,y=r.bottom+6;if(x+320>innerWidth)x=innerWidth-330;if(y+60>innerHeight)y=r.top-50;tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px';},450);});

const QZ={on:false};
function setMode(m){if(QZ.on)endQuiz(true);if(LOOK.on)exitLook();S.mode=m;$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
 if(m==='find')startFind();else if(m==='keys')startKeys();else if(m==='look')startLook(0);else{$('#quizbar').hidden=true;renderDevTools();}}
function qbar(html){const q=$('#quizbar');q.hidden=false;q.innerHTML=html;afterLayout();}
function shuffle(a){const R=Math.random;for(let i=a.length-1;i>0;i--){const j=R()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startFind(){Object.assign(QZ,{on:'find',list:shuffle(FIND.slice()).slice(0,10),i:0,score:0,miss:[],tries:0,t0:Date.now()});nextFind();}
function nextFind(){if(QZ.i>=QZ.list.length){finishQuiz();return;}const t=QZ.list[QZ.i];QZ.tries=0;if(t[2])setModule(t[2]);setTimeout(()=>{const el=$(`[data-q="${t[0]}"]`);if(el){const pn=el.closest('.panel');if(pn&&!el.classList.contains('ph')&&pn.classList.contains('closed'))pn.classList.remove('closed');}},10);
 qbar(`<span class="qs">Find It ${QZ.i+1} / ${QZ.list.length}</span><span class="qp">Click ${esc(t[1])}</span><span class="fb" id="qfb"></span><span class="qs">Score ${QZ.score}</span><button class="ghost" id="qSkip">Skip</button><button class="ghost" id="qQuit">Quit</button>`);}
let swallowClick=false;
function findPointer(e){if(QZ.on!=='find')return;if(e.target.closest('#quizbar,#tbar,.dlg'))return;const t=QZ.list[QZ.i];if(!t)return;const el=e.target.closest('[data-q]');if(!el)return;const q=el.dataset.q;
 const isNav=el.classList.contains('ph')||q.startsWith('mod-')||q==='filmstrip'||q==='modules'||q==='filterbar';
 if(q===t[0]){e.preventDefault();e.stopPropagation();swallowClick=true;el.classList.remove('qflash');void el.offsetWidth;el.classList.add('qflash');QZ.score+=QZ.tries?0:1;if(QZ.tries)QZ.miss.push(t);$('#qfb').className='fb ok';$('#qfb').textContent='✓ '+t[3];QZ.i++;setTimeout(nextFind,1500);return;}
 if(isNav)return;if(!FIND.some(f=>f[0]===q)&&!el.closest('.srow,.tool,.vbtn,.btn'))return;
 e.preventDefault();e.stopPropagation();swallowClick=true;QZ.tries++;el.classList.remove('qwrong');void el.offsetWidth;el.classList.add('qwrong');const nm=(FIND.find(f=>f[0]===q)||[0,'a different control'])[1];$('#qfb').className='fb no';$('#qfb').textContent='✗ That is '+nm+'. Try again.';
 if(QZ.tries>=2){const tg=$(`[data-q="${t[0]}"]`);if(tg){tg.scrollIntoView({block:'nearest'});tg.classList.remove('qflash');void tg.offsetWidth;tg.classList.add('qflash');}$('#qfb').textContent='Here it is → '+t[3];QZ.miss.push(t);QZ.i++;setTimeout(nextFind,2200);}}
const KEYQ=()=>Object.values(A).filter(a=>a.quiz);
function startKeys(){Object.assign(QZ,{on:'keys',list:shuffle(KEYQ()).slice(0,12),i:0,score:0,miss:[],tries:0,t0:Date.now()});KEYHANDLER=keyAnswer;nextKey();}
function nextKey(){if(QZ.i>=QZ.list.length){finishQuiz();return;}QZ.tries=0;const a=QZ.list[QZ.i];qbar(`<span class="qs">Shortcut ${QZ.i+1} / ${QZ.list.length}</span><span class="qp">${esc(a.quiz)}</span><span class="fb" id="qfb">Press the keys…</span><span class="qs">Score ${QZ.score}</span><button class="ghost" id="qShow">Show answer</button><button class="ghost" id="qSkip">Skip</button><button class="ghost" id="qQuit">Quit</button>`);}
function keyAnswer(combo){if(combo==='escape'){endQuiz();return;}const a=QZ.list[QZ.i];if(!a)return;const fb=$('#qfb');
 if(a.keys.includes(combo)){fb.className='fb ok';fb.textContent=`✓ ${fmtKey(combo)} — ${a.label}`;if(!QZ.tries)QZ.score++;else QZ.miss.push(a);QZ.i++;KEYHANDLER=null;setTimeout(()=>{KEYHANDLER=keyAnswer;nextKey();},1300);}
 else{QZ.tries++;const other=findActionAny(combo);fb.className='fb no';fb.textContent=`✗ ${fmtKey(combo)}${other?' is '+other.label:''}. Try again.`;if(QZ.tries>=3)showKeyAnswer();}}
function findActionAny(c){return Object.values(A).find(a=>a.keys.includes(c));}
function showKeyAnswer(){const a=QZ.list[QZ.i];if(!a)return;$('#qfb').className='fb no';$('#qfb').textContent='Answer: '+a.keys.map(fmtKey).join(' or ')+' — press it now to continue';if(!QZ.miss.includes(a))QZ.miss.push(a);QZ.tries=9;}
function finishQuiz(){const kind=QZ.on,n=QZ.list.length,sec=Math.round((Date.now()-QZ.t0)/1000),miss=QZ.miss;KEYHANDLER=null;QZ.on=false;
 const pct=Math.round(QZ.score/n*100);qbar(`<span class="qp">${kind==='find'?'Find It':'Shortcut drill'} finished: ${QZ.score} / ${n} (${pct}%) in ${sec} seconds</span><button id="qAgain">Try again</button><button class="ghost" id="qQuit">Back to Explore</button>`);
 dlg('Your results',`<p style="font:700 34px Cambria,serif;margin:0;color:#fff">${QZ.score} / ${n}</p><p>${pct>=90?'Excellent — you know your way around Lightroom.':pct>=70?'Nice work. Review the items below and try again.':'Keep practicing. Explore mode lets you hover any control to see what it does.'}</p>${miss.length?`<div class="sub">Review these</div><ul>${miss.map(m=>kind==='find'?`<li><b>${esc(m[1])}</b>: ${esc(m[3])}</li>`:`<li><b>${esc(m.keys.map(fmtKey).join(' / '))}</b>: ${esc(m.label)}</li>`).join('')}</ul>`:''}`);}
function endQuiz(silent){KEYHANDLER=null;QZ.on=false;$('#quizbar').hidden=true;if(!silent){S.mode='explore';$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode==='explore'));}afterLayout();}

const LOOKS=[

const LOOK={on:false};
function startLook(i){if(LOOK.on)exitLook(true);const L=LOOKS[i%LOOKS.length];let p=S.photos.find(q=>q.specId===L.spec&&!q.vc);if(!p){p=makePhoto(L.spec,'f-studio');S.photos.push(p);}
 Object.assign(LOOK,{on:true,i:i%LOOKS.length,id:p.id,stash:{dev:clone(p.dev),hist:clone(p.hist),hi:p.hi}});
 p.dev=defaultDev(specOf(p));p.hist=[{label:'Challenge start',dev:clone(p.dev)}];p.hi=0;touch(p);queueThumb(p);
 S.active=p.id;S.sel=new Set([p.id]);S.source={type:'all'};setModule('develop');syncDevUI();markDirty();renderFilm();openPanel('pBasic');
 LOOK.target=applySet(defaultDev(specOf(p)),specOf(p),L.set);
 qbar(`<span class="qs">Match the look ${LOOK.i+1} / ${LOOKS.length}</span><span class="qp">${esc(L.title)}</span><span class="qs">Use the Basic panel, then click Check my edit</span><button class="ghost" id="qQuit">Quit</button>`);
 const box=$('#challenge');box.hidden=false;box.innerHTML=`<h3>${esc(L.title)}</h3><div>${esc(L.brief)}</div><canvas id="lookCv"></canvas><div class="hint" style="color:#bbb">Target look. Your edit is the big photo.</div><div id="lookRes"></div><div class="cbtns"><button id="lkCheck">Check my edit</button><button class="ghost" id="lkAns">Show answer</button><button class="ghost" id="lkNext">Next challenge</button></div>`;
 const t=thumbWith(p,LOOK.target),c=$('#lookCv');c.width=t.width;c.height=t.height;c.getContext('2d').drawImage(t,0,0);}
function lookScore(){const p=byId(LOOK.id);const a=thumbWith(p,LOOK.target).getContext('2d').getImageData(0,0,TW,TH).data;const b=thumbWith(p,p.dev).getContext('2d').getImageData(0,0,TW,TH).data;let s=0;for(let i=0;i<a.length;i+=4)s+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);const mad=s/(a.length/4*3);return Math.round(clamp(100-mad*1.7,0,100));}
function lookCheck(reveal){const p=byId(LOOK.id),L=LOOKS[LOOK.i],sc=lookScore();const keys=Object.keys(L.set);
 const name=k=>k==='bw'?'Black & White':k==='vig'?'Vignette':SLM[k]?SLM[k].label:k;const val=(k,d)=>k==='bw'?(d.bw?'On':'Off'):fmtVal(k,getK(k,d));
 let hints='';if(!reveal){const tips=keys.map(k=>{if(k==='bw')return LOOK.target.bw!==p.dev.bw?'Check the treatment (Color or B&W).':null;const tv=getK(k,LOOK.target),yv=getK(k,p.dev),m=SLM[k],rng=m?m.max-m.min:100;const d=(tv-yv)/rng;if(Math.abs(d)<(k==='temp'?.012:.04))return null;return `${name(k)}: try ${d>0?'higher':'lower'}.`;}).filter(Boolean);hints=tips.length?`<div class="hint" style="color:#ddd">${tips.slice(0,3).map(esc).join('<br>')}</div>`:'<div class="hint" style="color:#7ddc8a">All the key sliders are close!</div>';}
 $('#lookRes').innerHTML=`<div class="score">${sc}% match</div><div>${sc>=92?'Pro-level match!':sc>=80?'Very close — fine-tune it.':sc>=60?'Getting there.':'Keep adjusting.'}</div>${hints}${reveal?`<table><tr><td></td><td>Target</td><td>Yours</td></tr>${keys.map(k=>`<tr><td>${esc(name(k))}</td><td>${val(k,LOOK.target)}</td><td>${val(k,p.dev)}</td></tr>`).join('')}</table>`:''}`;}
function exitLook(keepMode){const p=byId(LOOK.id);if(p&&LOOK.stash){p.dev=LOOK.stash.dev;p.hist=LOOK.stash.hist;p.hi=LOOK.stash.hi;touch(p);queueThumb(p);}LOOK.on=false;$('#challenge').hidden=true;if(S.module==='develop'){syncDevUI();markDirty();}if(!keepMode){$('#quizbar').hidden=true;S.mode='explore';$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode==='explore'));}}

<script>
/* ================= import your own photos ================= */
const loadImg=url=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=url;});
const RAWX=/\.(cr2|cr3|crw|nef|nrw|arw|srf|sr2|raf|dng|orf|rw2|pef|srw|x3f|3fr|iiq)$/i;
async function loadUserFile(f){
 const buf=await f.arrayBuffer();const ex=parseExif(buf);

 const k=Math.min(1,2400/Math.max(ow,oh)),mw=Math.round(ow*k),mh=Math.round(oh*k),mc=mkCanvas(mw,mh),mx=mc.getContext('2d');mx.imageSmoothingQuality='high';mx.drawImage(img,0,0,mw,mh);
 const blob=await toBlob(mc,'image/jpeg',.92);const mimg=await loadImg(URL.createObjectURL(blob));
 const W=ow>=oh?900:Math.max(100,Math.round(900*ow/oh)),H=ow>=oh?Math.max(100,Math.round(900*oh/ow)):900;
 const id=uid('u');let date=new Date(f.lastModified||Date.now());if(ex.dt&&/^\d{4}:\d\d:\d\d \d\d:\d\d/.test(ex.dt)){const t=ex.dt.replace(/^(\d{4}):(\d\d):(\d\d) /,'$1-$2-$3T');const dd=new Date(t);if(!isNaN(dd))date=dd;}
 const pad=n=>String(n).padStart(2,'0');const ds=`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
 const make=(ex.make||'').trim(),model=(ex.model||'').trim();
 SPECS[id]={kind:'user',user:1,id,seed:(Math.random()*1e6)|0,name:f.name,W,H,ow,oh,mw,mh,temp:5500,tint:0,date:ds,
  camName:model?(make&&!model.toLowerCase().startsWith(make.split(' ')[0].toLowerCase())?make+' '+model:model):(make||''),lensName:ex.lens||'',
  iso:ex.iso||'',sh:ex.et?(ex.et>=1?Math.round(ex.et*10)/10+' sec':'1/'+Math.round(1/ex.et)):'',ap:ex.fn?'f/'+Math.round(ex.fn*10)/10:'',fl:ex.fl?Math.round(ex.fl):'',
  note:'Your photo — try Auto first, then fine-tune Exposure, White Balance and Color.'};
 USERIMG.set(id,mimg);return id;}
async function loadUserFiles(files){const ids=[],bad=[];for(const f of files){

 dlg('Import Photos and Video',`<div style="display:grid;grid-template-columns:180px 1fr 230px;gap:14px">
 <div><div class="sub">Source</div><ul class="list" id="impSrc"><li data-is="card" class="on">💾 EOS_DIGITAL<br><span class="ct">practice card</span></li><li data-is="files">🖥 This computer…<br><span class="ct">your own photos</span></li></ul><div class="hint">Photos stay on this computer. Nothing is uploaded.</div></div>
 <div><div class="tabs" id="impMode">${[['dng','Copy as DNG','Copies the photos and converts raw files to Adobe DNG.'],['copy','Copy','Copies the photos to a new folder and adds them to the catalog. The originals stay untouched.'],['move','Move','Moves the files to the new folder and removes them from the old place.'],['add','Add','Leaves files where they are and just adds them to the catalog.']].map((m,i)=>`<button data-im="${m[0]}" data-tip="${m[1]}|${m[2]}" class="${i===1?'on':''}">${m[1]}</button>`).join('')}</div><div class="hint" id="impExplain">Copies the photos to a new folder and adds them to the catalog. The originals stay untouched.</div>
  <div class="row between"><span id="impCount"></span><span><button class="btn sm" id="impAll">Check All</button> <button class="btn sm" id="impNone">Uncheck All</button></span></div>
  <div class="imgrid" id="impGrid"></div><div class="hint" id="impBad" style="color:#f3b3b3"></div></div>
 <div><fieldset><legend>File Renaming</legend><label class="opt"><input type="checkbox" id="impRen"> Rename files</label><input class="txt" id="impRenTxt" value="Cowboys"><div class="hint">Example: Cowboys-001.jpg</div></fieldset>
  <fieldset><legend>Apply During Import</legend>Develop Settings<br><select class="sel" id="impPreset" style="width:100%"><option value="">None</option>${allPresets().map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select><br><br>Keywords<input class="txt" id="impKw" placeholder="e.g. Cowboys, field trip"></fieldset>
  <fieldset><legend>Destination</legend>New folder name<input class="txt" id="impDest"></fieldset></div></div>`,
 [['Cancel'],['Import',d=>{const ks=$$('input[data-ck]',d).filter(c=>c.checked&&!c.disabled).map(c=>c.dataset.ck);if(!ks.length){hud(null,src==='files'?'Choose some photos first':'Check at least one photo to import');return false;}
  const mode=$$('#impMode button',d).find(b=>b.classList.contains('on')).dataset.im;
  const ids=addPhotosFromSpecs(ks,$('#impDest',d).value.trim()||'Imported',{kw:$('#impKw',d).value.split(',').map(s=>s.trim()).filter(Boolean),pre:$('#impPreset',d).value,ren:$('#impRen',d).checked,base:$('#impRenTxt',d).value.trim()||'Photo',dng:mode==='dng'});
  hud(null,`Imported ${ids.length} photo${ids.length>1?'s':''}`);},1]],
 d=>{grid(d);$('#impSrc',d).onclick=e=>{const l=e.target.closest('[data-is]');if(!l)return;src=l.dataset.is;grid(d);if(src==='files'&&!pending.length)pickPhotos(async fs=>{const r=await loadUserFiles(fs);pending=pending.concat(r.ids);bad=bad.concat(r.bad);grid(d);});};
  $$('#impMode button',d).forEach(b=>b.onclick=()=>{$$('#impMode button',d).forEach(x=>x.classList.toggle('on',x===b));$('#impExplain',d).textContent=b.dataset.tip.split('|')[1];});
  $('#impAll',d).onclick=()=>$$('input[data-ck]:not(:disabled)',d).forEach(c=>c.checked=true);$('#impNone',d).onclick=()=>$$('input[data-ck]',d).forEach(c=>c.checked=false);
  d._addFiles=async fs=>{const r=await loadUserFiles(fs);src='files';pending=pending.concat(r.ids);bad=bad.concat(r.bad);grid(d);};},true);};

/* drag photos onto the window */
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy';}});
document.addEventListener('drop',e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();const fs=[...e.dataTransfer.files];const d=$('.dlg');if(d&&d._addFiles){d._addFiles(fs);return;}if($('.dlg'))return;importFilesDirect(fs);});

/* menu + shortcut: open photos */
act('openPhotos','Open Photos from Computer…','mod+shift+o',()=>pickPhotos(),{grp:'Global'});
MENUS[0][1].splice(1,0,'openPhotos');buildMenus();

/* export: keep each photo's own shape; your photos export up to 2400 px */
exportCanvas=function(p,o){const sp=specOf(p),[bw,bh]=dimsOf(sp),c=p.dev.crop,cw=c.w*bw,ch=c.h*bh,k=o.long/Math.max(cw,ch);let W=Math.round(bw*k),H=Math.round(bh*k);
 const cap=sp.user?Math.max(sp.mw,sp.mh):2400,s=Math.min(1,cap/Math.max(W,H));W=Math.max(100,Math.round(W*s));H=Math.max(100,Math.round(H*s));
 const lv=buildLevel(sp,W,H);const dev=clone(p.dev);if(o.sharp)dev.sharp=clamp(dev.sharp+o.sharp,0,150);renderLevel(lv,dev,sp);const out=cropCanvas(lv,dev);
 if(o.wm){const x=out.getContext('2d'),fs=Math.max(14,out.width/40);x.font=`600 ${fs}px Calibri,Segoe UI,sans-serif`;x.textAlign='right';x.fillStyle='rgba(255,255,255,.75)';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=4;x.fillText(p.copyright,out.width-fs,out.height-fs);}
 return out;};

/* catalogs carry a 1600 px copy of each of your photos so they reopen anywhere */
const _catalogJSON=catalogJSON;
catalogJSON=function(){const o=JSON.parse(_catalogJSON());const used=[...new Set(S.photos.map(p=>p.specId))].filter(k=>SPECS[k]&&SPECS[k].user);
 o.userPhotos=used.map(k=>{const sp=SPECS[k],img=USERIMG.get(k);let data='';if(img){const s=Math.min(1,1600/Math.max(sp.mw,sp.mh)),c=mkCanvas(Math.round(sp.mw*s),Math.round(sp.mh*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',.88);}return{spec:Object.assign({},sp,{mw:Math.round(sp.mw*Math.min(1,1600/Math.max(sp.mw,sp.mh))),mh:Math.round(sp.mh*Math.min(1,1600/Math.max(sp.mw,sp.mh)))}),data};});
 return JSON.stringify(o);};
const _loadCatalog=loadCatalog;
loadCatalog=async function(txt){let o=null;try{o=JSON.parse(txt);}catch(e){}
 if(o&&Array.isArray(o.userPhotos)){hud(null,'Opening catalog…');for(const u of o.userPhotos){if(!u||!u.spec||!u.spec.id)continue;SPECS[u.spec.id]=u.spec;if(u.data){try{USERIMG.set(u.spec.id,await loadImg(u.data));}catch(e){}}}}
 _loadCatalog(txt);};
</script>
