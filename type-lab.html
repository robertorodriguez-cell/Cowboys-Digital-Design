<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Type Lab — Week 13 | Digital Design 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --maroon:#8A0635; --maroon-dk:#5C0423; --ink:#0A0A0A; --silver:#9E9FA3;
  --paper:#FFFFFF; --wash:#F4F1F2; --line:#D9D6D8;
  --ok:#2E7D32; --ok-bg:#E8F3E9; --bad:#B3261E; --bad-bg:#FBE9E7;
  --blue:#1F7AE0; --cyan:#00A0DC; --yellow:#FFE500;
  --serif:Cambria, Caladea, Georgia, serif;
  --sans:Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sheet-head{background:var(--maroon);color:#fff;padding:22px 24px 0}
.head-inner{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;justify-content:space-between}
.head-inner h1{font-family:var(--serif);font-size:2.6rem;line-height:1;margin:0 0 6px}
.head-inner p{margin:0 0 4px;color:#F1D3DD;max-width:54ch}
.who{display:flex;gap:12px;flex-wrap:wrap}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:#F1D3DD}
.who input{margin-top:3px;padding:7px 10px;border:2px solid transparent;border-radius:6px;width:210px;background:#fff;color:var(--ink)}
.who input.short{width:110px}
.who input.need{border-color:var(--yellow)}
.days{max-width:1240px;margin:16px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.days button{border:0;border-radius:8px 8px 0 0;padding:9px 16px;background:var(--maroon-dk);color:#F1D3DD;font-weight:700}
.days button small{display:block;font-weight:400;font-size:.78rem}
.days button[aria-pressed="true"]{background:var(--wash);color:var(--maroon)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:220px 1fr;gap:26px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
nav button{width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:flex;gap:10px;align-items:center}
nav button .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--wash);font-weight:700;color:var(--maroon)}
nav button .t{flex:1;line-height:1.2}
nav button .t small{display:block;color:#666;font-size:.8rem}
nav button[aria-current="step"]{border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}
nav button.done .n{background:var(--ok);color:#fff}
.timer{margin-top:10px;padding:6px 12px;font-size:.9rem;color:#555}
.station{position:relative;background:var(--paper);padding:26px 28px 30px;border-radius:2px;min-width:0}
.station::before,.station::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none}
.station::before{top:-10px;left:-10px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink)}
.station::after{bottom:-10px;right:-10px;border-bottom:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.station h2{font-family:var(--serif);color:var(--maroon);font-size:1.85rem;margin:0 0 4px;line-height:1.15}
.station h3{font-family:var(--serif);font-size:1.2rem;margin:22px 0 8px}
.time{color:#666;font-size:.9rem;margin:0 0 10px}
.lede{margin:0 0 12px;max-width:80ch}
kbd{font-family:var(--mono);background:var(--wash);border:1px solid #ccc;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.88em}
.btn{padding:9px 16px;border-radius:8px;border:2px solid var(--maroon);background:var(--maroon);color:#fff;font-weight:700}
.btn.ghost{background:transparent;color:var(--maroon)}
.btn.sm{padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fb{margin-top:10px;padding:10px 14px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#1B5E20}
.fb.bad{background:var(--bad-bg);color:#8C1D18}
.fb.info{background:var(--wash);color:#333}
.board{background:#E6E6E6;border-radius:6px;padding:10px;min-width:0}
.board svg{display:block;width:100%;height:auto;background:#fff;user-select:none;-webkit-user-select:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.field{display:flex;flex-direction:column;margin-bottom:10px}
.field span{font-weight:700;margin-bottom:3px}
.field select{padding:7px 9px;border:1px solid #bbb;border-radius:6px;max-width:280px}
.field.ok select{border-color:var(--ok);background:var(--ok-bg)}
.field.bad select{border-color:var(--bad);background:var(--bad-bg)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sample{border:1px solid var(--line);border-radius:8px;padding:12px}
.sample .spec{font-size:2rem;line-height:1.2;margin-bottom:8px;min-height:2.6rem}
.sample.ok{border-color:var(--ok);background:var(--ok-bg)}
.sample.bad{border-color:var(--bad);background:var(--bad-bg)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.ctrl input[type=range]{width:260px}
.ctrl b{min-width:70px;font-variant-numeric:tabular-nums}
.pnl{background:#ECECEC;border:1px solid #c9c9c9;border-radius:4px;font-size:.92rem}
.pnl h4{margin:0;padding:6px 10px;background:#D6D6D6;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
.pnl .bd{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.pnl label{display:flex;flex-direction:column;gap:2px}
.pnl select,.pnl input[type=number]{padding:5px 7px;border:1px solid #aaa;border-radius:4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #999}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue)}
.seg{display:flex;border:1px solid #aaa;border-radius:6px;overflow:hidden;width:max-content}
.seg button{border:0;background:#fff;padding:5px 10px;border-right:1px solid #ddd}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--maroon);color:#fff}
.checklist{list-style:none;padding:0;margin:8px 0 0}
.checklist li{padding:3px 0}
.checklist li::before{content:"\25CB  ";color:#999}
.checklist li.ok::before{content:"\2713  ";color:var(--ok);font-weight:700}
.checklist li.ok{color:#1B5E20}
.mc label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.mc label:hover{background:var(--wash)}
.mc label.ok{border-color:var(--ok);background:var(--ok-bg)}
.mc label.bad{border-color:var(--bad);background:var(--bad-bg)}
.q{border-top:1px solid var(--line);padding:14px 0}
.q > p{margin:0 0 8px;font-weight:700}
.mini{width:240px;height:320px;border:1px solid #bbb;position:relative;overflow:hidden;margin-bottom:10px;flex:none}
.spotrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.demo{position:relative;height:300px;border:1px dashed #bbb;background:#fff;margin-bottom:8px;overflow:hidden}
.tbox{position:absolute;outline:1px solid var(--blue)}
.tbox .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--blue);right:-7px;bottom:-7px;cursor:nwse-resize;touch-action:none}
.tbox .over{position:absolute;right:-7px;bottom:-26px;width:14px;height:14px;border:1.5px solid var(--bad);color:var(--bad);font-size:12px;line-height:11px;text-align:center;background:#fff;display:none}
.report table{border-collapse:collapse;width:100%;margin:10px 0 18px}
.report th,.report td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.report td.num{text-align:right}
.report tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.report textarea{width:100%;min-height:100px;padding:10px;border:1px solid #bbb;border-radius:8px}
.stamp{display:inline-block;border:3px solid var(--maroon);color:var(--maroon);font-family:var(--serif);font-weight:700;padding:6px 14px;transform:rotate(-3deg);font-size:1.2rem}
.note{color:#555;font-size:.92rem}
.fname{font-family:var(--mono);padding:8px 10px;border:1px solid #bbb;border-radius:6px;min-width:320px}
.poster{display:grid;grid-template-columns:minmax(0,420px) 260px;gap:14px;align-items:start}
@media (max-width:980px){ .grid2,.poster{grid-template-columns:1fr} }
@media (max-width:860px){ .wrap{grid-template-columns:1fr} nav ol{position:static;flex-direction:row;overflow-x:auto} nav button{min-width:160px} .station{padding:20px 14px} }
@media print{ nav,.row-actions,.no-print,.days{display:none!important} .wrap{display:block} body{background:#fff} }
</style>
</head>
<body>
<header class="sheet-head">
  <div class="head-inner">
    <div>
      <h1>Type Lab</h1>
      <p>Week 13: type anatomy, spacing, point and area type, type on a path, and building hierarchy.</p>
    </div>
    <div class="who">
      <label>Your name<input id="sname" autocomplete="name" placeholder="First and last name"></label>
      <label>Class period<input id="speriod" class="short" placeholder="e.g. 4"></label>
    </div>
  </div>
  <div class="days" id="days" role="group" aria-label="Choose the day"></div>
</header>
<div class="wrap">
  <nav aria-label="Stations"><ol id="nav"></ol><div class="timer" id="timer"></div></nav>
  <main id="stage" class="station" tabindex="-1"></main>
</div>
<script>

var HAS_URL=/^https:\/\/script\.google\.com\//.test(RESULTS_URL);

function clone(o){return JSON.parse(JSON.stringify(o));}
var MC=document.createElement("canvas").getContext("2d");

 mon:{open:"2026-11-02",label:"Mon",date:"Nov 2",title:"Type anatomy",exit:"What is the difference between x-height and cap height?",
  stations:[
   {kind:"anatomy",title:"Label the letterforms",mins:8,text:"Every letter sits on invisible guidelines. Choose the correct name for each numbered part, then check."},
   {kind:"classify",title:"Name that category",mins:8,text:"Typefaces are grouped into categories. Decide which category each sample belongs to."},
   {kind:"match",title:"Type terms",mins:6,text:"Match each typography term to what it means. You&rsquo;ll use all of these terms this week.",
    items:[["Leading","The space between lines of text"],["Kerning","The space between two specific letters"],["Tracking","The spacing across a whole word or line"],["Point size","How big the type is (72 points is about 1 inch)"],["Serif","Small strokes at the ends of letters"],["Typeface","The overall design of a set of letters, like Helvetica or Garamond"]]}
  ],

   {q:"The baseline is\u2026",o:["the line most letters sit on","the top of capital letters","the bottom of letters like p and y","the space between lines"],a:0},
   {q:"x-height measures\u2026",o:["the height of capital letters","the height of lowercase letters like x, without ascenders","the width of the letter x","the space between letters"],a:1},
   {q:"A sans serif typeface\u2026",o:["has small strokes at the ends of letters","looks like handwriting","does not have small strokes at the ends of letters","uses the same width for every letter"],a:2},
   {q:"Script typefaces work best for\u2026",o:["long paragraphs of body copy","a few decorative words, like a name or title","tiny legal text","spreadsheets"],a:1}

 tue:{open:"2026-11-03",label:"Tue",date:"Nov 3",title:"Kerning, tracking & leading",exit:"Explain the difference between kerning and tracking in your own words.",
  stations:[
   {kind:"kern",title:"Kern it",mins:12,text:"The spacing in these words is uneven. Click a gap marker under the word, then use the arrow buttons (or <kbd>Alt</kbd> + <kbd>&larr;</kbd>/<kbd>&rarr;</kbd>, like in Illustrator) to fix it. Make the space between every pair of letters <b>look</b> even."},
   {kind:"tracking",title:"Tracking",mins:6,text:"Tracking changes the spacing across a whole line. Illustrator measures it in thousandths of an em. Fix both lines so they&rsquo;re easy to read."},
   {kind:"leading",title:"Leading",mins:6,text:"Leading is the space from one baseline to the next. Fix the leading for both blocks of text."}
  ],
  quiz:[
   {q:"Kerning adjusts\u2026",o:["the space between two specific letters","the space between lines","the size of the type","the color of the type"],a:0},
   {q:"Tracking adjusts\u2026",o:["one pair of letters","the spacing across a whole word, line, or paragraph","the height of capital letters","the baseline"],a:1},

 wed:{open:"2026-11-04",label:"Wed",date:"Nov 4",title:"Point, area & path type",exit:"When would you use area type instead of point type?",

   {kind:"textpath",title:"Type on a path badge",mins:14,text:"Build a Cowboys badge with type on a path. Drag the round curve handle to bend each path, and use <b>Position</b> to slide the text along the path, like the center bracket in Illustrator."}
  ],
  quiz:[
   {q:"Clicking once with the Type tool (T) creates\u2026",o:["point type","area type","a type on a path","outlines"],a:0},
   {q:"Click-dragging a box with the Type tool creates\u2026",o:["point type","area type, where text wraps inside the box","a text path","a new artboard"],a:1},
   {q:"A small red plus sign at the corner of an area type box means\u2026",o:["the text is spelled wrong","there is more text than fits in the box (overset text)","the font is missing","the box is locked"],a:1},

   {q:"How do you move type on a path to the other side of the line?",o:["Delete the path","Drag the center bracket across the path, or use Flip in Type on a Path Options","Press Enter","Change the font"],a:1}
  ]},
 thu:{open:"2026-11-05",label:"Thu",date:"Nov 5",title:"Hierarchy",exit:"What did you change on your poster to make the most important information read first?",
  stations:[
   {kind:"hier",title:"Build the hierarchy",mins:8,text:"A flyer needs the most important information to read first. Use size and weight to rank the text in the order the client asked for."},
   {kind:"spot",title:"Spot the problem",mins:7,text:"Each mini flyer has one big typography problem. Pick the main problem for each."},
   {kind:"poster",title:"Start your type poster",mins:25,req:"start",text:"Your <b>Typographic Hierarchy</b> project: a homecoming poster made only with type. Click a line of text to select it, drag it to move it, and use the Character panel to style it. Your work saves automatically and carries over to Friday."}
  ],
  quiz:[]},
 fri:{open:"2026-11-06",label:"Fri",date:"Nov 6",title:"Finish & export",exit:"Design rationale: in 3\u20134 sentences, explain the choices you made to create hierarchy on your poster.",
  stations:[
   {kind:"poster",title:"Finish your poster",mins:15,req:"final",text:"Polish your poster until every item on the checklist is complete."},
   {kind:"export",title:"Name & export",mins:5,text:"Name your file with the class formula and export a PNG to turn in on Google Classroom."}
  ],
  quiz:[
   {q:"A client wants the event name to be noticed first. What creates that hierarchy?",o:["Making every line the same size","Making the event name larger and bolder than everything else","Using five different typefaces","Putting the event name at the bottom in small text"],a:1},
   {q:"Before sending a file with type to a printer, designers often\u2026",o:["Create Outlines on a copy so the printer doesn\u2019t need the fonts","Change the type to RGB","Delete the text","Rasterize the artboard"],a:0},
   {q:"Body copy is set at 11 pt. Which leading is a sensible starting point?",o:["6 pt","13 pt","30 pt","72 pt"],a:1},
   {q:"How many typefaces should most simple designs use?",o:["One or two","Five or six","As many as possible","Every line should be different"],a:0},
   {q:"In Illustrator, which panel holds leading, kerning, and tracking?",o:["Swatches","Character","Layers","Pathfinder"],a:1}
  ]}
};
var DAY_ORDER=["mon","tue","wed","thu","fri"];

/* ================= state ================= */
var S={sid:"",name:"",period:"",day:"",days:{},poster:null};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv)S=Object.assign(S,sv);}catch(e){}
if(!S.sid)S.sid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
var now=new Date(),iso=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
var PREVIEW=/[?&]preview=cowboys\b/i.test(location.search);
function isOpen(k){return PREVIEW||iso>=DAYS[k].open;}
var todayKey=DAY_ORDER.filter(function(k){return DAYS[k].open===iso;})[0];
if(todayKey)S.day=todayKey;else if(!DAYS[S.day]||!isOpen(S.day)){var od=DAY_ORDER.filter(isOpen);S.day=od.length?od[od.length-1]:"mon";}
function D(){var k=S.day;if(!S.days[k])S.days[k]={cur:0,start:Date.now(),st:{},quiz:{},exit:""};return S.days[k];}

function pages(){var d=DAYS[S.day],p=d.stations.map(function(s,i){return {kind:"st",i:i,title:s.title,mins:s.mins};});if(d.quiz.length)p.push({kind:"quiz",title:"Quick check",mins:5});p.push({kind:"report",title:"Lab report"});return p;}

  try{fetch(RESULTS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload(status))}).then(function(){cb&&cb(true);}).catch(function(){cb&&cb(false);});}catch(e){cb&&cb(false);}}

/* ================= chrome ================= */
var activeKey=null;document.addEventListener("keydown",function(e){if(activeKey)activeKey(e);});

  b.innerHTML=(isOpen(k)?"":"\uD83D\uDD12 ")+d.label+" "+d.date+"<small>"+(isOpen(k)?d.title:"Opens "+d.label+" "+d.date)+"</small>";b.onclick=function(){S.day=k;save();render();};box.appendChild(b);});}
function isDone(p){if(p.kind==="st")return stState(p.i).passed;if(p.kind==="quiz")return quizScore().done;return false;}

    svg+='<line x1="'+hx+'" y1="'+(base-asc)+'" x2="'+(hx-40)+'" y2="'+(base-asc-50)+'" stroke="#8A0635" stroke-width="2"/><circle cx="'+(hx-40)+'" cy="'+(base-asc-62)+'" r="15" fill="#8A0635"/><text x="'+(hx-40)+'" y="'+(base-asc-56)+'" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700" font-size="17">5</text>';
    svg+='<line x1="'+ox+'" y1="'+(base-xh/2)+'" x2="'+(ox+10)+'" y2="'+(base+desc+40)+'" stroke="#8A0635" stroke-width="2"/><circle cx="'+ox+'" cy="'+(base-xh/2)+'" r="4" fill="#8A0635"/><circle cx="'+(ox+10)+'" cy="'+(base+desc+52)+'" r="15" fill="#8A0635"/><text x="'+(ox+10)+'" y="'+(base+desc+58)+'" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700" font-size="17">6</text></svg>';
    var Q=[["1","Cap height"],["2","x-height"],["3","Baseline"],["4","Descender"],["5","Ascender"],["6","Counter"]],OPTS=["Ascender","Baseline","Cap height","Counter","Descender","Kerning","Serif","x-height"];
    $("#an",stage).innerHTML=fontWarn()+'<div class="board">'+svg+'</div><div class="grid2" style="margin-top:14px"><div>'+Q.map(function(q){return '<label class="field" data-k="'+q[0]+'"><span>'+q[0]+'.</span><select><option value="">Choose\u2026</option>'+OPTS.map(function(o){return '<option'+(st.vals[q[0]]===o?" selected":"")+'>'+o+'</option>';}).join("")+'</select></label>';}).join("")+
      '</div><div class="note"><p><b>Hints</b></p><p>Lines 1&ndash;4 run across the whole word. Number 5 points to the part of a lowercase letter that rises above the x-height. Number 6 points to the enclosed space inside a letter.</p></div></div>'+

/* ================= Tue: kerning ================= */
var KWORDS=[{w:"WAVE",off:[22,-14,18]},{w:"COWBOYS",off:[0,20,0,-12,18,-8]},{w:"Typography",off:[14,0,-10,12,0,0,16,-10,0]}];
KINDS.kern=function(stage,i,sd){
  var st=stState(i);st.words=st.words||KWORDS.map(function(k){return {off:k.off.slice(),done:false,score:null};});var wi=st.wi||0,sel=0;
  stage.innerHTML=head(sd,i)+'<div id="kn"><p class="note">Loading fonts\u2026</p></div>';
  whenFonts(function(){
    $("#kn",stage).innerHTML=fontWarn()+'<div class="row-actions" style="margin-top:0" id="wtabs"></div><div class="board"><svg id="ksv" viewBox="0 0 700 220"></svg></div>'+
      '<div class="ctrl"><span>Gap <b id="gname"></b></span><button class="btn ghost sm" id="lt" aria-label="Tighter">\u25C0 Tighter</button><button class="btn ghost sm" id="rt" aria-label="Looser">Looser \u25B6</button><span class="note">Kerning: <b id="kv"></b></span></div>'+
      '<div class="row-actions"><button class="btn" id="chk">Check this word</button><button class="btn ghost" id="cmp">Compare with the designer\u2019s spacing</button>'+nextBtn()+'</div><div class="fb" id="sfb"></div>';
    var showIdeal=false;
    function geom(){var k=KWORDS[wi],font="700 110px 'Playfair Display'",xs=[],w=measure(font,k.w).width,start=(700-w)/2;
      for(var j=0;j<k.w.length;j++)xs.push(start+measure(font,k.w.slice(0,j)).width);return {xs:xs,font:font,chars:k.w.split("")};}
    function tabs(){$("#wtabs",stage).innerHTML=KWORDS.map(function(k,j){var s=st.words[j];return '<button class="btn sm '+(j===wi?"":"ghost")+'" data-w="'+j+'">'+k.w+(s.done?" \u2713":"")+'</button>';}).join("");
      $$("#wtabs button",stage).forEach(function(b){b.onclick=function(){wi=+b.dataset.w;st.wi=wi;sel=0;showIdeal=false;save();tabs();draw();};});}
    function draw(){var g=geom(),off=st.words[wi].off,h='',cum=0,gx=[];
      g.chars.forEach(function(c,j){if(j>0)cum+=showIdeal?0:off[j-1];h+='<text x="'+(g.xs[j]+cum)+'" y="140" font-family="Playfair Display" font-weight="700" font-size="110" fill="'+(showIdeal?"#2E7D32":"#0A0A0A")+'" style="font-kerning:none">'+esc(c)+'</text>';});
      cum=0;for(var j=1;j<g.chars.length;j++){cum+=off[j-1];var x=g.xs[j]+cum-(showIdeal?cum:0);gx.push(x);}
      gx.forEach(function(x,j){h+='<g data-g="'+j+'" style="cursor:pointer"><rect x="'+(x-14)+'" y="160" width="28" height="40" fill="transparent"/><path d="M'+(x-9)+' 190 L'+x+' 172 L'+(x+9)+' 190 Z" fill="'+(j===sel?"#1F7AE0":"#BBB")+'"/></g>';});
      $("#ksv",stage).innerHTML=h;$$("#ksv [data-g]",stage).forEach(function(el){el.onclick=function(){sel=+el.dataset.g;draw();};});
      $("#gname",stage).textContent=g.chars[sel]+g.chars[sel+1];$("#kv",stage).textContent=Math.round(off[sel]/110*1000);}
    function nudge(d){showIdeal=false;st.words[wi].off[sel]+=d;save();draw();}
    $("#lt",stage).onclick=function(){nudge(-2);};$("#rt",stage).onclick=function(){nudge(2);};
    activeKey=function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||""))return;if(e.key==="ArrowLeft"&&e.altKey){e.preventDefault();nudge(-2);}else if(e.key==="ArrowRight"&&e.altKey){e.preventDefault();nudge(2);}
      else if(e.key==="ArrowLeft"&&!e.altKey){e.preventDefault();sel=Math.max(0,sel-1);draw();}else if(e.key==="ArrowRight"&&!e.altKey){e.preventDefault();sel=Math.min(KWORDS[wi].w.length-2,sel+1);draw();}};
    $("#cmp",stage).onclick=function(){showIdeal=!showIdeal;draw();$("#cmp",stage).textContent=showIdeal?"Back to my spacing":"Compare with the designer\u2019s spacing";};
    $("#chk",stage).onclick=function(){var off=st.words[wi].off,err=off.reduce(function(a,b){return a+Math.abs(b);},0)/off.length,sc=Math.round(Math.max(0,Math.min(100,100-(err-1)*5))),w=st.words[wi];
      if(w.score==null)w.score=sc;if(sc>=85)w.done=true;st.checks++;
      var all=st.words.every(function(x){return x.done;});if(all){st.passed=true;st.best=Math.round(st.words.reduce(function(a,b){return a+b.score;},0)/st.words.length);}
      save();renderNav();tabs();
      var worst=0,wv=0;off.forEach(function(v,j){if(Math.abs(v)>wv){wv=Math.abs(v);worst=j;}});
      fb($("#sfb",stage),sc>=85?"ok":"bad",'<b>'+sc+'%</b> even spacing. '+(sc>=85?(all?"All three words are kerned. Nice eye!":"Move on to the next word."):"The gap "+KWORDS[wi].w[worst]+KWORDS[wi].w[worst+1]+" still looks "+(off[worst]>0?"too wide":"too tight")+". 85% passes."));};
    tabs();draw();wireNext(stage);});
};

   '<div><h3 style="margin-top:0">Area type</h3><p class="note">Made by click-dragging a box with the Type tool.</p><div class="demo" id="da"><div class="tbox" id="ba" style="left:20px;top:20px;width:300px;height:170px"><div style="font-family:'+F.serif.replace(/"/g,"&quot;")+';font-size:17px;line-height:1.35;padding:4px;overflow:hidden;height:100%">'+txt+'</div><div class="h"></div><div class="over" title="Overset text">+</div></div></div></div></div>'+

      $("#cen",stage).onclick=function(){b.align="center";b.x=PW/2;panel();draw();};}
    $("#bgs",stage).innerHTML=PBGS.map(function(c){return '<button data-bg="'+c[0]+'" title="'+c[1]+'" aria-label="'+c[1]+'" aria-pressed="'+(p.bg===c[0])+'" style="background:'+c[0]+'"></button>';}).join("");
    $$("#bgs button",stage).forEach(function(x){x.onclick=function(){p.bg=x.dataset.bg;$$("#bgs button",stage).forEach(function(y){y.setAttribute("aria-pressed",y===x);});draw();};});
    function pt(e){var q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse());}
    svg.addEventListener("pointerdown",function(e){var t=e.target.closest&&e.target.closest("text[data-b]");if(!t)return;e.preventDefault();svg.setPointerCapture(e.pointerId);sel=+t.getAttribute("data-b");var q=pt(e),b=p.blocks[sel];drag={sx:q.x,sy:q.y,ox:b.x,oy:b.y};panel();draw();});
    svg.addEventListener("pointermove",function(e){if(!drag)return;var q=pt(e),b=p.blocks[sel];b.x=Math.round(drag.ox+q.x-drag.sx);b.y=Math.round(drag.oy+q.y-drag.sy);draw();});
    svg.addEventListener("pointerup",function(){drag=null;});
    activeKey=function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||""))return;var b=p.blocks[sel],s=e.shiftKey?10:1;
      if(e.key==="ArrowLeft"){b.x-=s;}else if(e.key==="ArrowRight"){b.x+=s;}else if(e.key==="ArrowUp"){b.y-=s;}else if(e.key==="ArrowDown"){b.y+=s;}else return;e.preventDefault();draw();};
    panel();draw();wireNext(stage);});
};
function lastFirst(){var parts=(S.name||"").trim().split(/\s+/);if(parts.length<2)return null;var last=parts[parts.length-1].replace(/[^A-Za-z\-]/g,""),first=parts[0].replace(/[^A-Za-z]/g,"");if(!last||!first)return null;return {last:last.charAt(0).toUpperCase()+last.slice(1),fi:first.charAt(0).toUpperCase()};}
KINDS.export=function(stage,i,sd){
  var st=stState(i),p=poster(),lf=lastFirst();
  stage.innerHTML=head(sd,i)+'<p>Class formula: <b>LastName_FirstInitial_ProjectCode_v#.ext</b>. This project&rsquo;s code is <b>TypeHierarchy</b>.</p>'+
   '<div class="row-actions" style="margin-top:4px"><input class="fname" id="fn" spellcheck="false" autocomplete="off" placeholder="e.g. Garcia_M_TypeHierarchy_v1.png" value="'+esc(st.fname||"")+'"><button class="btn" id="ex">Export PNG</button></div><div class="fb" id="sfb"></div>'+
   '<h3>Preview</h3><canvas id="cv" width="'+PW*2+'" height="'+PH*2+'" style="width:300px;border:1px solid #ccc;background:#fff"></canvas><div class="row-actions">'+nextBtn()+'</div>';
  var cv=$("#cv",stage),ctx=cv.getContext("2d");
  function paint(){ctx.setTransform(2,0,0,2,0,0);ctx.fillStyle=p.bg;ctx.fillRect(0,0,PW,PH);
    p.blocks.forEach(function(b){ctx.font=blockFont(b);ctx.fillStyle=b.color;ctx.textAlign=b.align;ctx.textBaseline="alphabetic";try{ctx.letterSpacing=(b.track/1000*b.size)+"px";}catch(e){}ctx.fillText(b.caps?b.text.toUpperCase():b.text,b.x,b.y);});try{ctx.letterSpacing="0px";}catch(e){}}
  whenFonts(paint);
  function validate(v){if(!lf)return "Type your first and last name at the top of the page first.";if(/\s/.test(v))return "No spaces. Use underscores.";
    var exp=lf.last+"_"+lf.fi+"_TypeHierarchy_v";if(v.indexOf(exp)!==0)return "Start with "+exp+" (your last name, first initial, project code, version).";if(!/^.+_v\d+\.png$/.test(v))return "End with a version number and the extension, like _v1.png";return null;}
  $("#ex",stage).onclick=function(){var v=$("#fn",stage).value.trim(),box=$("#sfb",stage),err=validate(v);st.fname=v;save();if(err){fb(box,"bad",err);return;}
    paint();cv.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=v;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
      st.passed=true;st.checks=1;st.best=100;st.note=v;save();renderNav();fb(box,"ok","<b>Exported "+esc(v)+".</b> Find it in Downloads and attach it to the assignment in Google Classroom.");},"image/png");};
  wireNext(stage);
};

/* ================= quiz & report ================= */
function quizPage(stage){var day=DAYS[S.day],d=D();
  stage.innerHTML='<h2>Quick check</h2><p class="time">About 5 minutes</p><p class="lede">A correct first answer earns the point; if you miss, try again to see the right one.</p>'+
   day.quiz.map(function(q,i){return '<div class="q" data-i="'+i+'"><p>'+(i+1)+'. '+esc(q.q)+'</p><div class="mc">'+q.o.map(function(o,j){return '<label><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>';}).join("")+'</div><button class="btn">Check</button><div class="fb"></div></div>';}).join("")+'<div class="row-actions">'+nextBtn()+'</div>';
  $$(".q",stage).forEach(function(el){var i=+el.dataset.i,q=day.quiz[i],r=d.quiz[i]||{tries:0,ok:false},btn=$(".btn",el),box=$(".fb",el);
    function lock(){btn.disabled=true;$$("input",el).forEach(function(x){x.disabled=true;if(+x.value===q.a){x.checked=true;x.closest("label").classList.add("ok");}});fb(box,"ok",r.tries===1?"Correct on the first try.":"Correct.");}
    if(r.ok)lock();btn.onclick=function(){var c=$("input:checked",el);if(!c){fb(box,"info","Choose an answer first.");return;}r.tries++;
      if(+c.value===q.a){r.ok=true;lock();}else{c.closest("label").classList.add("bad");c.checked=false;fb(box,"bad","Not quite. Try another answer.");}d.quiz[i]=r;save();renderNav();};});
  wireNext(stage);}
function reportPage(stage){var day=DAYS[S.day],d=D(),q=quizScore(),pl=payload("");
  var rows=day.stations.map(function(s,i){var r=d.st[i];return '<tr><td>'+esc(s.title)+(r&&r.note?'<br><span class="note">'+esc(r.note)+'</span>':'')+'</td><td>'+(r&&r.passed?"\u2713 Done":(r&&r.checks?"Not yet":"Not tried"))+'</td><td class="num">'+(r&&r.best!==""&&r.best!=null?r.best+"%":"\u2014")+'</td></tr>';}).join("");
  var all=pl.passed===day.stations.length&&(!q.of||q.done);
  stage.innerHTML='<h2>Lab report: '+esc(day.label+" "+day.date)+'</h2><p class="lede">'+esc(day.title)+'. Scores show your first try on each station.</p><p><b>Name:</b> '+(S.name?esc(S.name):'<span style="color:var(--bad)">Type your name at the top of the page</span>')+' &nbsp; <b>Period:</b> '+esc(S.period||"\u2014")+'</p>'+
   '<div class="report"><table><thead><tr><th>Station</th><th>Status</th><th class="num">First try</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Stations done: '+pl.passed+' / '+day.stations.length+'</td><td>'+(q.of?"Quick check: "+q.got+" / "+q.of:"")+'</td><td></td></tr></tfoot></table>'+
   '<h3>'+(S.day==="fri"?"Design rationale":"Exit ticket")+'</h3><p>'+esc(day.exit)+'</p><textarea id="ex">'+esc(d.exit||"")+'</textarea>'+(all&&S.name?'<p><span class="stamp">Set in type</span></p>':'')+'</div>'+
   '<p class="no-print">'+(HAS_URL?'Click <b>Submit to teacher</b> when you finish.':'Screenshot this report (<b>Ctrl + Show windows</b>) and attach it in Google Classroom.')+'</p>'+
   '<div class="row-actions">'+(HAS_URL?'<button class="btn" id="sub">Submit to teacher</button>':'')+'<button class="btn ghost" id="pdf">Save as PDF</button></div><div class="fb" id="subfb"></div>';
  $("#ex",stage).addEventListener("input",function(e){d.exit=e.target.value;save();});$("#pdf",stage).onclick=function(){window.print();};
  if(HAS_URL){var sb=$("#sub",stage),sf=$("#subfb",stage);if(d.submittedAt)fb(sf,"ok","Submitted at "+d.submittedAt+". You can submit again if you keep working.");
    sb.onclick=function(){if(!S.name){fb(sf,"bad","Type your name at the top of the page, then submit.");$("#sname").focus();return;}if(!(d.exit||"").trim()){fb(sf,"bad","Answer the question above before you submit.");$("#ex",stage).focus();return;}
      sb.disabled=true;fb(sf,"info","Sending\u2026");send("Submitted",function(ok){sb.disabled=false;if(ok){d.submittedAt=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});save();fb(sf,"ok","Submitted at "+d.submittedAt+". Your teacher can see your results.");}else fb(sf,"bad","Couldn\u2019t reach the results sheet. Try again, or turn in a screenshot instead.");});};}
}

var nm=$("#sname"),pd=$("#speriod");nm.value=S.name;pd.value=S.period;
function needName(){nm.classList.toggle("need",!nm.value.trim());}
nm.addEventListener("input",function(){S.name=nm.value.trim();save();needName();});pd.addEventListener("input",function(){S.period=pd.value.trim();save();});needName();
setInterval(function(){if(isOpen(S.day))$("#timer").textContent="Time in lab today: "+Math.floor((Date.now()-D().start)/60000)+" min";},30000);
render();
})();
</script>
