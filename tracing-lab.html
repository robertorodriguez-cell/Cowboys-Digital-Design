<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracing Lab — Week 12 | Digital Design 1</title>
<style>
:root{
  --maroon:#8A0635; --maroon-dk:#5C0423; --ink:#0A0A0A; --silver:#9E9FA3;
  --paper:#FFFFFF; --wash:#F4F1F2; --line:#D9D6D8;
  --ok:#2E7D32; --ok-bg:#E8F3E9; --bad:#B3261E; --bad-bg:#FBE9E7;
  --blue:#1F7AE0; --cyan:#00A0DC; --yellow:#FFE500;
  --serif:Cambria, Caladea, Georgia, serif;
  --sans:Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sheet-head{background:var(--maroon);color:#fff;padding:22px 24px 0}
.head-inner{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;justify-content:space-between}
.head-inner h1{font-family:var(--serif);font-size:2.6rem;line-height:1;margin:0 0 6px}
.head-inner p{margin:0 0 4px;color:#F1D3DD;max-width:54ch}
.who{display:flex;gap:12px;flex-wrap:wrap}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:#F1D3DD}
.who input{margin-top:3px;padding:7px 10px;border:2px solid transparent;border-radius:6px;width:210px;background:#fff;color:var(--ink)}
.who input.short{width:110px}
.who input.need{border-color:var(--yellow)}
.days{max-width:1240px;margin:16px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.days button{border:0;border-radius:8px 8px 0 0;padding:9px 16px;background:var(--maroon-dk);color:#F1D3DD;font-weight:700}
.days button small{display:block;font-weight:400;font-size:.78rem}
.days button[aria-pressed="true"]{background:var(--wash);color:var(--maroon)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:220px 1fr;gap:26px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
nav button{width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:flex;gap:10px;align-items:center}
nav button .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--wash);font-weight:700;color:var(--maroon)}
nav button .t{flex:1;line-height:1.2}
nav button .t small{display:block;color:#666;font-size:.8rem}
nav button[aria-current="step"]{border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}
nav button.done .n{background:var(--ok);color:#fff}
.timer{margin-top:10px;padding:6px 12px;font-size:.9rem;color:#555}
.station{position:relative;background:var(--paper);padding:26px 28px 30px;border-radius:2px;min-width:0}
.station::before,.station::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none}
.station::before{top:-10px;left:-10px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink)}
.station::after{bottom:-10px;right:-10px;border-bottom:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.station h2{font-family:var(--serif);color:var(--maroon);font-size:1.85rem;margin:0 0 4px;line-height:1.15}
.station h3{font-family:var(--serif);font-size:1.2rem;margin:22px 0 8px}
.time{color:#666;font-size:.9rem;margin:0 0 10px}
.lede{margin:0 0 12px;max-width:80ch}
kbd{font-family:var(--mono);background:var(--wash);border:1px solid #ccc;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.88em}
.btn{padding:9px 16px;border-radius:8px;border:2px solid var(--maroon);background:var(--maroon);color:#fff;font-weight:700}
.btn.ghost{background:transparent;color:var(--maroon)}
.btn.sm{padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fb{margin-top:10px;padding:10px 14px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#1B5E20}
.fb.bad{background:var(--bad-bg);color:#8C1D18}
.fb.info{background:var(--wash);color:#333}
.checklist{list-style:none;padding:0;margin:8px 0 0}
.checklist li{padding:3px 0}
.checklist li::before{content:"\25CB  ";color:#999}
.checklist li.ok::before{content:"\2713  ";color:var(--ok);font-weight:700}
.checklist li.ok{color:#1B5E20}

/* Editor */
.editor{display:grid;grid-template-columns:56px minmax(0,1fr) 220px;gap:10px;align-items:start}
.editor.noside{grid-template-columns:56px minmax(0,1fr)}
.tools{display:flex;flex-direction:column;gap:6px;background:#2b2b2b;padding:6px;border-radius:6px}
.tools button{width:44px;height:44px;border-radius:6px;border:0;background:#3c3c3c;color:#eee;display:grid;place-items:center}
.tools button svg{width:24px;height:24px}
.tools button[aria-pressed="true"]{background:var(--blue);color:#fff}
.tools button[hidden]{display:none}
.board{background:#E6E6E6;border-radius:6px;padding:10px;min-width:0}
.board svg{display:block;width:100%;height:auto;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.statusbar{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:#444;padding:6px 2px 0}
.statusbar b{color:var(--ink)}
.side{display:flex;flex-direction:column;gap:10px}
.pnl{background:#ECECEC;border:1px solid #c9c9c9;border-radius:4px;font-size:.9rem}
.pnl h4{margin:0;padding:6px 10px;background:#D6D6D6;font-size:.82rem;font-family:var(--sans);text-transform:uppercase;letter-spacing:.04em}
.pnl .bd{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.lyr{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:4px;background:#fff;border:1px solid #ddd;cursor:pointer}
.lyr.active{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.lyr .nm{flex:1}
.lyr .ic{width:28px;height:26px;border:1px solid #ccc;background:#f7f7f7;border-radius:4px;display:grid;place-items:center;font-size:.9rem;padding:0}
.lyr .ic[aria-pressed="false"]{opacity:.35}
.pnl label{display:flex;flex-direction:column;gap:2px}
.pnl input[type=range]{width:100%}
.swrow{display:flex;align-items:center;gap:6px}
.swrow input[type=color]{width:38px;height:28px;padding:0;border:1px solid #aaa;background:#fff}
.swrow .lbl{width:48px}
.result{display:flex;gap:14px;align-items:center}
.meter{font-family:var(--serif);font-size:1.6rem;color:var(--maroon);font-weight:700}
.race{border-collapse:collapse;margin-top:10px}
.race th,.race td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left}
/* Image Trace */
.it{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;align-items:start}
.it .board svg{cursor:default}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.92rem}
.stats b{text-align:right;font-variant-numeric:tabular-nums}
/* quiz/report */
.mc label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.mc label:hover{background:var(--wash)}
.mc label.ok{border-color:var(--ok);background:var(--ok-bg)}
.mc label.bad{border-color:var(--bad);background:var(--bad-bg)}
.q{border-top:1px solid var(--line);padding:14px 0}
.q p{margin:0 0 8px;font-weight:700}
.report table{border-collapse:collapse;width:100%;margin:10px 0 18px}
.report th,.report td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.report td.num{text-align:right}
.report tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.report textarea{width:100%;min-height:100px;padding:10px;border:1px solid #bbb;border-radius:8px}
.stamp{display:inline-block;border:3px solid var(--maroon);color:var(--maroon);font-family:var(--serif);font-weight:700;padding:6px 14px;transform:rotate(-3deg);font-size:1.2rem}
.note{color:#555;font-size:.92rem}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.choices button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:6px 12px}
.choices button[aria-pressed="true"]{border-color:var(--maroon);background:var(--maroon);color:#fff}
.fname{font-family:var(--mono);padding:8px 10px;border:1px solid #bbb;border-radius:6px;min-width:320px}
@media (max-width:1060px){ .editor{grid-template-columns:56px minmax(0,1fr)} .editor .side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap} .editor .side .pnl{flex:1;min-width:200px} .it{grid-template-columns:1fr} }
@media (max-width:860px){ .wrap{grid-template-columns:1fr} nav ol{position:static;flex-direction:row;overflow-x:auto} nav button{min-width:160px} .station{padding:20px 14px} .editor{grid-template-columns:1fr} .tools{flex-direction:row;flex-wrap:wrap} }
@media print{ nav,.row-actions,.no-print,.days{display:none!important} .wrap{display:block} body{background:#fff} }
</style>
</head>
<body>
<header class="sheet-head">
  <div class="head-inner">
    <div>
      <h1>Tracing Lab</h1>
      <p>Week 12: trace photos with the Pen tool, the Curvature tool, and Image Trace, then build your Vector Trace project.</p>
    </div>
    <div class="who">
      <label>Your name<input id="sname" autocomplete="name" placeholder="First and last name"></label>
      <label>Class period<input id="speriod" class="short" placeholder="e.g. 3"></label>
    </div>
  </div>
  <div class="days" id="days" role="group" aria-label="Choose the day"></div>
</header>
<div class="wrap">
  <nav aria-label="Stations"><ol id="nav"></ol><div class="timer" id="timer"></div></nav>
  <main id="stage" class="station" tabindex="-1"></main>
</div>

<script>
(function(){
"use strict";
/* ===== TEACHER SETUP: same web app URL as the other labs ===== */
var RESULTS_URL="https://script.google.com/macros/s/AKfycbwYTkQW5toOW2JMFNbcd6PK9_RF6B60FeaHafwCDVS78go92jg_DyBQzb4aK9QTZOVj/exec";
/* ============================================================== */
var HAS_URL=/^https:\/\/script\.google\.com\//.test(RESULTS_URL);
var KEY="dd1-tracing-lab-w12";
var W=600,H=400;

/* ================= geometry ================= */
function P(x,y){return {x:x,y:y};}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function bez(p0,p1,p2,p3,t){var u=1-t;return P(u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y);}
function ctrl(a,b){return [P(a.x,a.y),P(a.x+(a.ho?a.ho.x:0),a.y+(a.ho?a.ho.y:0)),P(b.x+(b.hi?b.hi.x:0),b.y+(b.hi?b.hi.y:0)),P(b.x,b.y)];}
function segs(path){var s=[],a=path.anchors;for(var i=0;i<a.length-1;i++)s.push(ctrl(a[i],a[i+1]));if(path.closed&&a.length>1)s.push(ctrl(a[a.length-1],a[0]));return s;}
function pathD(path){var a=path.anchors;if(!a.length)return "";var d="M"+a[0].x.toFixed(1)+" "+a[0].y.toFixed(1);segs(path).forEach(function(c){d+=" C"+[c[1],c[2],c[3]].map(function(p){return p.x.toFixed(1)+" "+p.y.toFixed(1);}).join(" ");});if(path.closed)d+=" Z";return d;}
function sample(path,n){var out=[];segs(path).forEach(function(c,i){for(var k=(i?1:0);k<=n;k++)out.push(bez(c[0],c[1],c[2],c[3],k/n));});if(!out.length&&path.anchors.length)out.push(P(path.anchors[0].x,path.anchors[0].y));return out;}
function pseg(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;if(!l)return dist(p,a);var t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);}
function directed(A_,B_){var sum=0,mx=0;A_.forEach(function(p){var m=Infinity;for(var i=0;i<B_.length-1;i++){var d=pseg(p,B_[i],B_[i+1]);if(d<m)m=d;}if(B_.length===1)m=dist(p,B_[0]);sum+=m;if(m>mx)mx=m;});return {mean:sum/A_.length,max:mx};}
function compare(student,target){
  if(!student||student.anchors.length<2)return {acc:0};
  var sT=sample(target,40),sS=sample(student,40),a=directed(sT,sS),b=directed(sS,sT);
  var mean=(a.mean+b.mean)/2,mx=Math.max(a.max,b.max);
  var acc=Math.round(Math.max(0,Math.min(100,100-Math.max(0,mean-1.5)*7)));if(mx>30)acc=Math.min(acc,69);
  return {acc:acc};
}
function splitAt(a,b,t){var c=ctrl(a,b);function L(p,q){return P(p.x+(q.x-p.x)*t,p.y+(q.y-p.y)*t);}
  var p01=L(c[0],c[1]),p12=L(c[1],c[2]),p23=L(c[2],c[3]),p012=L(p01,p12),p123=L(p12,p23),m=L(p012,p123);
  return {m:m,aho:P(p01.x-a.x,p01.y-a.y),mhi:P(p012.x-m.x,p012.y-m.y),mho:P(p123.x-m.x,p123.y-m.y),bhi:P(p23.x-b.x,p23.y-b.y)};}
function snap45(o,p){var dx=p.x-o.x,dy=p.y-o.y,r=Math.hypot(dx,dy),ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);return P(o.x+r*Math.cos(ang),o.y+r*Math.sin(ang));}
/* Curvature tool: smooth handles computed from neighbors, like Illustrator's rubber-band curves */
function autoHandles(path){var a=path.anchors,n=a.length;for(var i=0;i<n;i++){var c=a[i];if(!c.auto)continue;if(c.corner){c.hi=null;c.ho=null;continue;}
  var pr=i>0?a[i-1]:(path.closed&&n>2?a[n-1]:null),nx=i<n-1?a[i+1]:(path.closed&&n>2?a[0]:null);
  if(!pr&&!nx){c.hi=c.ho=null;continue;}
  var tx,ty;if(pr&&nx){tx=nx.x-pr.x;ty=nx.y-pr.y;}else if(nx){tx=nx.x-c.x;ty=nx.y-c.y;}else{tx=c.x-pr.x;ty=c.y-pr.y;}
  var L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
  c.hi=pr?P(-tx*dist(pr,c)/3,-ty*dist(pr,c)/3):null;c.ho=nx?P(tx*dist(nx,c)/3,ty*dist(nx,c)/3):null;}}
function curvShape(pts,closed){var p={anchors:pts.map(function(q){return {x:q[0],y:q[1],auto:true,corner:!!q[2],hi:null,ho:null};}),closed:!!closed};autoHandles(p);return p;}
function A(x,y,hi,ho){return {x:x,y:y,hi:hi?P(hi[0],hi[1]):null,ho:ho?P(ho[0],ho[1]):null};}

/* ================= practice "photos" (drawn in code so the outline is known) ================= */
var SHAPES={
  boot:{label:"Cowboy boot",path:{anchors:[A(240,60),A(340,60),A(345,220,null,[60,10]),A(505,305,[-50,-55],[5,30]),A(470,340,[30,0],null),A(230,340),A(230,300)],closed:true}},
  shield:{label:"Shield",path:curvShape([[190,90,1],[410,90,1],[405,230],[300,350,1],[195,230]],true)},
  pebble:{label:"Pebble",path:curvShape([[160,230],[230,125],[370,105],[455,190],[420,300],[270,320]],true)},
  apple:{label:"Apple",path:curvShape([[300,118,1],[375,88],[448,160],[428,282],[352,340],[300,326,1],[248,340],[172,282],[152,160],[225,88]],true)},
  pear:{label:"Pear",path:curvShape([[300,72],[343,118],[352,190],[420,268],[382,346],[218,346],[180,268],[248,190],[257,118]],true)}
};
function rng(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function noise(ctx,amt,seed){var r=rng(seed),im=ctx.getImageData(0,0,W,H),d=im.data;for(var i=0;i<d.length;i+=4){var n=(r()-.5)*2*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}ctx.putImageData(im,0,0);}
function bg(ctx,inner,outer){var g=ctx.createRadialGradient(300,200,20,300,200,420);g.addColorStop(0,inner);g.addColorStop(1,outer);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function shadow(ctx,p2){ctx.save();ctx.translate(9,12);ctx.filter="blur(9px)";ctx.fillStyle="rgba(0,0,0,.18)";ctx.fill(p2);ctx.restore();}
var PHOTO_CACHE={};
function photoCanvas(kind){
  if(PHOTO_CACHE[kind])return PHOTO_CACHE[kind];
  var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d",{willReadFrequently:true}),sh=SHAPES[kind],p2=new Path2D(pathD(sh.path));
  if(kind==="boot"){bg(x,"#F3EEE7","#BDB4A8");shadow(x,p2);x.fillStyle="#4A2E1F";x.fill(p2);x.save();x.clip(p2);
    x.fillStyle="#A8876A";x.beginPath();x.ellipse(292,160,20,95,0,0,7);x.fill();x.beginPath();x.ellipse(440,296,46,13,.35,0,7);x.fill();
    x.fillStyle="#2A190F";x.fillRect(228,318,80,30);x.strokeStyle="#2A190F";x.lineWidth=2;x.setLineDash([6,5]);x.beginPath();x.moveTo(250,90);x.lineTo(330,90);x.moveTo(330,230);x.quadraticCurveTo(420,240,480,300);x.stroke();x.restore();}
  else if(kind==="apple"){bg(x,"#F6F0E2","#D8CDB6");shadow(x,p2);var g=x.createRadialGradient(255,170,10,300,220,190);g.addColorStop(0,"#E8364B");g.addColorStop(1,"#8E0B20");x.fillStyle=g;x.fill(p2);
    x.save();x.clip(p2);x.fillStyle="rgba(255,255,255,.4)";x.beginPath();x.ellipse(240,172,22,40,-.4,0,7);x.fill();x.restore();
    x.strokeStyle="#5B3A1E";x.lineWidth=10;x.lineCap="round";x.beginPath();x.moveTo(300,120);x.quadraticCurveTo(298,85,314,58);x.stroke();
    x.fillStyle="#3C8D2F";x.save();x.translate(350,74);x.rotate(-.45);x.beginPath();x.ellipse(0,0,40,15,0,0,7);x.fill();x.restore();}
  else if(kind==="shield"){bg(x,"#F1F1F2","#C9CACD");shadow(x,p2);x.fillStyle="#8A0635";x.fill(p2);x.save();x.clip(p2);x.strokeStyle="#9E9FA3";x.lineWidth=18;x.stroke(p2);
    x.fillStyle="#D9D9DC";x.font="bold 120px Georgia, serif";x.textAlign="center";x.fillText("M",300,265);x.restore();}
  else if(kind==="pebble"){bg(x,"#EEF1EC","#C3C8BF");shadow(x,p2);var g2=x.createLinearGradient(160,110,450,320);g2.addColorStop(0,"#9A9DA1");g2.addColorStop(1,"#55585D");x.fillStyle=g2;x.fill(p2);
    x.save();x.clip(p2);var r=rng(7);x.fillStyle="rgba(255,255,255,.25)";for(var i=0;i<60;i++){x.beginPath();x.arc(160+r()*300,110+r()*210,1+r()*3,0,7);x.fill();}x.restore();}
  else if(kind==="pear"){bg(x,"#F3F1E6","#CFCBB5");shadow(x,p2);var g3=x.createLinearGradient(220,80,380,340);g3.addColorStop(0,"#D6DC6A");g3.addColorStop(1,"#7FA33A");x.fillStyle=g3;x.fill(p2);
    x.strokeStyle="#5B3A1E";x.lineWidth=8;x.lineCap="round";x.beginPath();x.moveTo(300,76);x.quadraticCurveTo(296,50,310,34);x.stroke();}
  noise(x,9,kind.length*31+5);
  var out={canvas:c,ctx:x,src:c.toDataURL("image/jpeg",.88)};PHOTO_CACHE[kind]=out;return out;
}
/* uploaded photo for the project */
var UPLOAD={canvas:null,ctx:null,src:null};
function loadUpload(src,cb){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,W,H);
  var s=Math.min(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);UPLOAD={canvas:c,ctx:x,src:src};cb&&cb(true);};im.onerror=function(){cb&&cb(false);};im.src=src;}
function photoFor(doc){if(!doc.photo||!doc.photo.kind)return null;if(doc.photo.kind==="upload")return UPLOAD.src?UPLOAD:null;return photoCanvas(doc.photo.kind);}

/* ================= Image Trace engine ================= */
var DSW=200,DSH=133;
function downsample(canvas){var c=document.createElement("canvas");c.width=DSW;c.height=DSH;var x=c.getContext("2d",{willReadFrequently:true});x.drawImage(canvas,0,0,DSW,DSH);return x.getImageData(0,0,DSW,DSH).data;}
function lum(d,i){return .299*d[i]+.587*d[i+1]+.114*d[i+2];}

  });
  svg.addEventListener("dblclick",function(e){if(tool!=="curv")return;var p=pt(e),ha=hitAnchor(p);if(!ha)return;var a=doc.paths[ha.pi].anchors[ha.i];a.auto=true;a.corner=!a.corner;autoHandles(doc.paths[ha.pi]);changed();draw();});

  $("#pv",stage).innerHTML=doc.paths.map(function(p){return '<path d="'+pathD(p)+'" fill="'+(p.fill||"none")+'" stroke="'+(p.stroke||"none")+'" stroke-width="'+p.sw+'"/>';}).join("")||'<text x="300" y="200" text-anchor="middle" fill="#999" font-family="Calibri,Carlito,Arial">Your traced shapes will appear here.</text>';
  function validate(v){if(!lf)return "Type your first and last name at the top of the page first.";if(/\s/.test(v))return "No spaces. Use underscores.";
    var exp=lf.last+"_"+lf.fi+"_VectorTrace_v";if(v.indexOf(exp)!==0)return "Start with "+lf.last+"_"+lf.fi+"_VectorTrace_v (your last name, first initial, project code, version).";
    if(!/^.+_v\d+\.png$/.test(v))return "End with a version number and the extension, like _v1.png";return null;}
  $("#ex",stage).onclick=function(){var v=$("#fn",stage).value.trim(),box=$("#sfb",stage),err=validate(v);st.fname=v;save();
    if(!doc.paths.length){fb(box,"info","Trace something first.");return;}if(err){fb(box,"bad",err);return;}
    var img=new Image(),blob=new Blob([art(true)],{type:"image/svg+xml"}),url=URL.createObjectURL(blob);
    img.onload=function(){var c=document.createElement("canvas");c.width=1200;c.height=800;c.getContext("2d").drawImage(img,0,0);URL.revokeObjectURL(url);
      c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=v;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
        st.passed=true;st.checks=1;st.note=v;save();renderNav();fb(box,"ok","<b>Exported "+esc(v)+".</b> Find it in your Downloads folder and attach it to the assignment in Google Classroom.");},"image/png");};
    img.onerror=function(){fb(box,"bad","Export failed. Try again.");};img.src=url;};
  wireNext(stage);
}

/* ================= quiz & report ================= */
function quizPage(stage){var day=DAYS[S.day],d=D();
  stage.innerHTML='<h2>Quick check</h2><p class="time">About 5 minutes</p><p class="lede">A correct first answer earns the point; if you miss, try again to see the right one.</p>'+
   day.quiz.map(function(q,i){return '<div class="q" data-i="'+i+'"><p>'+(i+1)+'. '+esc(q.q)+'</p><div class="mc">'+q.o.map(function(o,j){return '<label><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>';}).join("")+'</div><button class="btn">Check</button><div class="fb"></div></div>';}).join("")+'<div class="row-actions">'+nextBtn()+'</div>';
  $$(".q",stage).forEach(function(el){var i=+el.dataset.i,q=day.quiz[i],r=d.quiz[i]||{tries:0,ok:false},btn=$(".btn",el),box=$(".fb",el);
    function lock(){btn.disabled=true;$$("input",el).forEach(function(x){x.disabled=true;if(+x.value===q.a){x.checked=true;x.closest("label").classList.add("ok");}});fb(box,"ok",r.tries===1?"Correct on the first try.":"Correct.");}
    if(r.ok)lock();btn.onclick=function(){var c=$("input:checked",el);if(!c){fb(box,"info","Choose an answer first.");return;}r.tries++;
      if(+c.value===q.a){r.ok=true;lock();}else{c.closest("label").classList.add("bad");c.checked=false;fb(box,"bad","Not quite. Try another answer.");}d.quiz[i]=r;save();renderNav();};});
  wireNext(stage);}
function reportPage(stage){var day=DAYS[S.day],d=D(),q=quizScore(),pl=payload("");
  var rows=day.stations.map(function(s,i){var r=d.st[i],acc=(s.kind==="trace"||s.kind==="race")&&r&&r.checks?r.best+"%":"\u2014";return '<tr><td>'+esc(s.title)+(r&&r.note?'<br><span class="note">'+esc(r.note)+'</span>':'')+'</td><td>'+(r&&r.passed?"\u2713 Done":(r&&r.checks?"Not yet":"Not tried"))+'</td><td class="num">'+acc+'</td></tr>';}).join("");
  var all=pl.passed===day.stations.length&&(!q.of||q.done);
  stage.innerHTML='<h2>Lab report: '+esc(day.label+" "+day.date)+'</h2><p class="lede">'+esc(day.title)+'.</p><p><b>Name:</b> '+(S.name?esc(S.name):'<span style="color:var(--bad)">Type your name at the top of the page</span>')+' &nbsp; <b>Period:</b> '+esc(S.period||"\u2014")+'</p>'+
   '<div class="report"><table><thead><tr><th>Station</th><th>Status</th><th class="num">Accuracy</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Stations done: '+pl.passed+' / '+day.stations.length+'</td><td>'+(q.of?"Quick check: "+q.got+" / "+q.of:"")+'</td><td></td></tr></tfoot></table>'+
   '<h3>'+(S.day==="fri"?"Design rationale":"Exit ticket")+'</h3><p>'+esc(day.exit)+'</p><textarea id="ex">'+esc(d.exit||"")+'</textarea>'+(all&&S.name?'<p><span class="stamp">Traced &amp; ready</span></p>':'')+'</div>'+
   '<p class="no-print">'+(HAS_URL?'Click <b>Submit to teacher</b> when you finish.':'Screenshot this report (<b>Ctrl + Show windows</b>) and attach it in Google Classroom.')+'</p>'+
   '<div class="row-actions">'+(HAS_URL?'<button class="btn" id="sub">Submit to teacher</button>':'')+'<button class="btn ghost" id="pdf">Save as PDF</button></div><div class="fb" id="subfb"></div>';
  $("#ex",stage).addEventListener("input",function(e){d.exit=e.target.value;save();});$("#pdf",stage).onclick=function(){window.print();};
  if(HAS_URL){var sb=$("#sub",stage),sf=$("#subfb",stage);if(d.submittedAt)fb(sf,"ok","Submitted at "+d.submittedAt+". You can submit again if you keep working.");
    sb.onclick=function(){if(!S.name){fb(sf,"bad","Type your name at the top of the page, then submit.");$("#sname").focus();return;}if(!(d.exit||"").trim()){fb(sf,"bad","Answer the question above before you submit.");$("#ex",stage).focus();return;}
      sb.disabled=true;fb(sf,"info","Sending\u2026");send("Submitted",function(ok){sb.disabled=false;if(ok){d.submittedAt=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});save();fb(sf,"ok","Submitted at "+d.submittedAt+". Your teacher can see your results.");}else fb(sf,"bad","Couldn\u2019t reach the results sheet. Try again, or turn in a screenshot instead.");});};}
}

var nm=$("#sname"),pd=$("#speriod");nm.value=S.name;pd.value=S.period;
function needName(){nm.classList.toggle("need",!nm.value.trim());}
nm.addEventListener("input",function(){S.name=nm.value.trim();save();needName();});pd.addEventListener("input",function(){S.period=pd.value.trim();save();});needName();
setInterval(function(){if(isOpen(S.day))$("#timer").textContent="Time in lab today: "+Math.floor((Date.now()-D().start)/60000)+" min";},30000);
window.__traceLab={SHAPES:SHAPES,compare:compare,imageTrace:imageTrace,photoCanvas:photoCanvas,trueMask:trueMask,iou:iou};
render();
})();
