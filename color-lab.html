<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Lab — Week 14 | Digital Design 1</title>
<style>
:root{
  --maroon:#8A0635; --maroon-dk:#5C0423; --ink:#0A0A0A; --silver:#9E9FA3;
  --paper:#FFFFFF; --wash:#F4F1F2; --line:#D9D6D8;
  --ok:#2E7D32; --ok-bg:#E8F3E9; --bad:#B3261E; --bad-bg:#FBE9E7;
  --blue:#1F7AE0; --cyan:#00A0DC; --yellow:#FFE500;
  --serif:Cambria, Caladea, Georgia, serif;
  --sans:Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sheet-head{background:var(--maroon);color:#fff;padding:22px 24px 0}
.head-inner{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;justify-content:space-between}
.head-inner h1{font-family:var(--serif);font-size:2.6rem;line-height:1;margin:0 0 6px}
.head-inner p{margin:0 0 4px;color:#F1D3DD;max-width:54ch}
.who{display:flex;gap:12px;flex-wrap:wrap}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:#F1D3DD}
.who input{margin-top:3px;padding:7px 10px;border:2px solid transparent;border-radius:6px;width:210px;background:#fff;color:var(--ink)}
.who input.short{width:110px}
.who input.need{border-color:var(--yellow)}
.days{max-width:1240px;margin:16px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.days button{border:0;border-radius:8px 8px 0 0;padding:9px 16px;background:var(--maroon-dk);color:#F1D3DD;font-weight:700}
.days button small{display:block;font-weight:400;font-size:.78rem}
.days button[aria-pressed="true"]{background:var(--wash);color:var(--maroon)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:220px 1fr;gap:26px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
nav button{width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:flex;gap:10px;align-items:center}
nav button .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--wash);font-weight:700;color:var(--maroon)}
nav button .t{flex:1;line-height:1.2}
nav button .t small{display:block;color:#666;font-size:.8rem}
nav button[aria-current="step"]{border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}
nav button.done .n{background:var(--ok);color:#fff}
.timer{margin-top:10px;padding:6px 12px;font-size:.9rem;color:#555}
.station{position:relative;background:var(--paper);padding:26px 28px 30px;border-radius:2px;min-width:0}
.station::before,.station::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none}
.station::before{top:-10px;left:-10px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink)}
.station::after{bottom:-10px;right:-10px;border-bottom:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.station h2{font-family:var(--serif);color:var(--maroon);font-size:1.85rem;margin:0 0 4px;line-height:1.15}
.station h3{font-family:var(--serif);font-size:1.2rem;margin:22px 0 8px}
.time{color:#666;font-size:.9rem;margin:0 0 10px}
.lede{margin:0 0 12px;max-width:80ch}
kbd{font-family:var(--mono);background:var(--wash);border:1px solid #ccc;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.88em}
.btn{padding:9px 16px;border-radius:8px;border:2px solid var(--maroon);background:var(--maroon);color:#fff;font-weight:700}
.btn.ghost{background:transparent;color:var(--maroon)}
.btn.sm{padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fb{margin-top:10px;padding:10px 14px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#1B5E20}
.fb.bad{background:var(--bad-bg);color:#8C1D18}
.fb.info{background:var(--wash);color:#333}
.board{background:#E6E6E6;border-radius:6px;padding:10px;min-width:0}
.board svg{display:block;width:100%;height:auto;background:#fff;user-select:none;-webkit-user-select:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.field{display:flex;flex-direction:column;margin-bottom:10px}
.field span{font-weight:700;margin-bottom:3px}
.field select{padding:7px 9px;border:1px solid #bbb;border-radius:6px;max-width:280px}
.field.ok select{border-color:var(--ok);background:var(--ok-bg)}
.field.bad select{border-color:var(--bad);background:var(--bad-bg)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sample{border:1px solid var(--line);border-radius:8px;padding:12px}
.sample .spec{font-size:2rem;line-height:1.2;margin-bottom:8px;min-height:2.6rem}
.sample.ok{border-color:var(--ok);background:var(--ok-bg)}
.sample.bad{border-color:var(--bad);background:var(--bad-bg)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.ctrl input[type=range]{width:260px}
.ctrl b{min-width:70px;font-variant-numeric:tabular-nums}
.pnl{background:#ECECEC;border:1px solid #c9c9c9;border-radius:4px;font-size:.92rem}
.pnl h4{margin:0;padding:6px 10px;background:#D6D6D6;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
.pnl .bd{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.pnl label{display:flex;flex-direction:column;gap:2px}
.pnl select,.pnl input[type=number]{padding:5px 7px;border:1px solid #aaa;border-radius:4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #999}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue)}
.seg{display:flex;border:1px solid #aaa;border-radius:6px;overflow:hidden;width:max-content}
.seg button{border:0;background:#fff;padding:5px 10px;border-right:1px solid #ddd}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--maroon);color:#fff}
.checklist{list-style:none;padding:0;margin:8px 0 0}
.checklist li{padding:3px 0}
.checklist li::before{content:"\25CB  ";color:#999}
.checklist li.ok::before{content:"\2713  ";color:var(--ok);font-weight:700}
.checklist li.ok{color:#1B5E20}
.mc label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.mc label:hover{background:var(--wash)}
.mc label.ok{border-color:var(--ok);background:var(--ok-bg)}
.mc label.bad{border-color:var(--bad);background:var(--bad-bg)}
.q{border-top:1px solid var(--line);padding:14px 0}
.q > p{margin:0 0 8px;font-weight:700}
.mini{width:240px;height:320px;border:1px solid #bbb;position:relative;overflow:hidden;margin-bottom:10px;flex:none}
.spotrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.demo{position:relative;height:300px;border:1px dashed #bbb;background:#fff;margin-bottom:8px;overflow:hidden}
.tbox{position:absolute;outline:1px solid var(--blue)}
.tbox .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--blue);right:-7px;bottom:-7px;cursor:nwse-resize;touch-action:none}
.tbox .over{position:absolute;right:-7px;bottom:-26px;width:14px;height:14px;border:1.5px solid var(--bad);color:var(--bad);font-size:12px;line-height:11px;text-align:center;background:#fff;display:none}
.report table{border-collapse:collapse;width:100%;margin:10px 0 18px}
.report th,.report td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.report td.num{text-align:right}
.report tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.report textarea{width:100%;min-height:100px;padding:10px;border:1px solid #bbb;border-radius:8px}
.stamp{display:inline-block;border:3px solid var(--maroon);color:var(--maroon);font-family:var(--serif);font-weight:700;padding:6px 14px;transform:rotate(-3deg);font-size:1.2rem}
.note{color:#555;font-size:.92rem}
.fname{font-family:var(--mono);padding:8px 10px;border:1px solid #bbb;border-radius:6px;min-width:320px}
.poster{display:grid;grid-template-columns:minmax(0,420px) 260px;gap:14px;align-items:start}
@media (max-width:980px){ .grid2,.poster{grid-template-columns:1fr} }
@media (max-width:860px){ .wrap{grid-template-columns:1fr} nav ol{position:static;flex-direction:row;overflow-x:auto} nav button{min-width:160px} .station{padding:20px 14px} }
@media print{ nav,.row-actions,.no-print,.days{display:none!important} .wrap{display:block} body{background:#fff} }

.seg{flex-wrap:wrap}
</style>
</head>

/* readings */
var READ={
 MON:{p:["In 1666, Isaac Newton passed sunlight through a glass prism and watched white light split into a rainbow. He later bent that band of colors into a circle, one of the first <b>color wheels</b>. Artists and designers still use color wheels to plan colors that work together.",
   "The traditional artist&rsquo;s wheel starts with three <b>primary</b> colors: red, yellow, and blue. Mixing two primaries makes a <b>secondary</b> color: orange, green, or violet. Mixing a primary with a neighboring secondary makes a <b>tertiary</b> color, like red-orange or blue-green. That gives twelve colors around the wheel.",
   "Every color can be described three ways. <b>Hue</b> is the color family, like red or blue. <b>Value</b> is how light or dark it is. Adding white makes a <b>tint</b>, and adding black makes a <b>shade</b>. <b>Saturation</b> is how intense or dull the color is. Neon green is highly saturated; a dusty sage green is not. Illustrator&rsquo;s HSB sliders (hue, saturation, brightness) work exactly this way.",
   "Designers rarely pick colors at random. They use <b>color schemes</b>, which are patterns on the wheel. <b>Complementary</b> colors sit directly across from each other, like blue and orange, and create strong contrast. <b>Analogous</b> colors sit next to each other and feel calm and related. <b>Triadic</b> schemes use three colors evenly spaced around the wheel for a lively, balanced look. <b>Split-complementary</b> uses one color plus the two neighbors of its complement. <b>Monochromatic</b> schemes use one hue in different values.",
   "Colors also have temperature. Reds, oranges, and yellows feel <b>warm</b> and tend to jump forward. Blues, greens, and violets feel <b>cool</b> and tend to recede. Knowing these patterns helps you choose colors on purpose instead of by luck."],
  qs:[{q:"What did Isaac Newton use to split white light into a rainbow?",o:["A prism","A paintbrush","A computer","A camera"],a:0},
      {q:"Mixing two primary colors makes a\u2026",o:["tertiary color","secondary color","shade","neutral"],a:1},
      {q:"Adding white to a color makes a\u2026",o:["shade","tint","complement","hue"],a:1},
      {q:"Which scheme uses colors directly across from each other on the wheel?",o:["Analogous","Monochromatic","Complementary","Triadic"],a:2},
      {q:"Warm colors like red and orange tend to\u2026",o:["recede into the background","jump forward","disappear in print","have no saturation"],a:1},
      {q:"A monochromatic scheme uses\u2026",o:["one hue in different values","every color on the wheel","only black and white","three evenly spaced hues"],a:0}]},
 TUE:{p:["Your phone screen and a printed poster make color in opposite ways. A screen starts black and adds <b>light</b>. Tiny red, green, and blue lights glow at different strengths, and our eyes blend them. This is <b>additive</b> color, or <b>RGB</b>. Red and green light together make yellow, and all three at full strength make white.",
   "A printer starts with white paper and adds <b>ink</b>. Each ink absorbs, or subtracts, some of the light that would bounce off the paper. This is <b>subtractive</b> color, or <b>CMYK</b>: cyan, magenta, yellow, and <b>key</b> (black). In theory cyan, magenta, and yellow make black, but in real life they make a muddy dark brown, so printers add black ink for crisp text and deep shadows.",
   "Because light and ink work differently, some bright screen colors can&rsquo;t be printed. The range of colors a system can reproduce is its <b>gamut</b>. Electric blues and neon greens fall outside the CMYK gamut, so they print duller. Illustrator shows a small warning icon when a color is out of gamut. That&rsquo;s why print projects should be designed in CMYK from the start.",
   "Web designers name colors with <b>hex codes</b> like #8A0635. The six characters are three pairs for red, green, and blue, each from 00 (none) to FF (full). #FF0000 is pure red, #FFFFFF is white, and #000000 is black.",
   "When a brand needs an exact color every time, like a school&rsquo;s maroon on jerseys, signs, and letterhead, printers can use a <b>spot color</b> from the <b>Pantone Matching System</b>. A Pantone ink is mixed to one exact recipe, so it looks the same everywhere it&rsquo;s printed."],
  qs:[{q:"RGB is called additive because\u2026",o:["it adds light to a black screen","it adds ink to paper","it adds numbers","it adds layers"],a:0},
      {q:"Why do printers add black (K) ink?",o:["Cyan, magenta, and yellow make a muddy brown instead of a true black","Black ink is required by law","Paper is black","To make colors brighter"],a:0},
      {q:"A color that can\u2019t be printed accurately with CMYK is\u2026",o:["out of gamut","a tint","a spot color","grayscale"],a:0},
      {q:"In the hex code #00FF00, which color is at full strength?",o:["Red","Green","Blue","None"],a:1},
      {q:"Pantone spot colors are used when\u2026",o:["a brand needs the exact same color every time it\u2019s printed","colors don\u2019t matter","a design is only for screens","you want random colors"],a:0},
      {q:"Where should a design for a printed poster be built?",o:["In RGB, then hope it prints right","In CMYK from the start","In grayscale only","In hex codes"],a:1}]},
 THU:{p:["Think of your favorite team or brand. You can probably picture its colors before you picture its logo. Color is one of the fastest ways people recognize a brand, which is why companies protect their colors carefully.",
   "Most organizations have <b>brand guidelines</b>, documents that list the exact color values to use: a Pantone number for print, CMYK for regular printing, and RGB and hex for screens. A designer making a flyer, a T-shirt, and a website follows the same guidelines so the maroon on all three matches.",
   "Sometimes the same design needs different colors, like a game-day graphic for each team in a tournament. Illustrator&rsquo;s <b>Recolor Artwork</b> tool swaps every color in a design at once. Pick a new color for each current color, and the whole design updates. Designers often save related colors as a <b>color group</b> so they can reuse them quickly.",
   "Color must also be readable. Designers measure the <b>contrast ratio</b> between text and its background. Accessibility guidelines ask for at least <b>4.5:1</b> for normal text and <b>3:1</b> for large headlines. Strong contrast helps everyone, especially people with low vision. About 1 in 12 men has some form of color blindness, so designers never rely on color alone to carry a message.",
   "Finally, color meaning changes across cultures. In the United States, white is often linked to weddings, while in parts of East Asia it&rsquo;s traditionally linked to mourning. Red can mean danger, love, luck, or celebration depending on where you are. Good designers think about who will see their work."],
  qs:[{q:"What do brand guidelines usually include?",o:["Exact color values like Pantone, CMYK, RGB, and hex","The CEO\u2019s birthday","Only the logo file","A list of employees"],a:0},

      {q:"White is traditionally linked to mourning in\u2026",o:["parts of East Asia","every country","no country","only Florida"],a:0}]},
 FRI:{p:["Professional designers rarely draw the same thing twice. When a design needs fifty stars, a row of identical icons, or a logo repeated on a pattern, they make the art once and reuse it.",
   "In Illustrator, that reusable art is a <b>symbol</b>. You create the master symbol in the Symbols panel, then place copies called <b>instances</b>. Every instance stays linked to the master. Change the master&rsquo;s color or shape, and every instance updates instantly. Symbols also keep file sizes smaller, because Illustrator stores the art once instead of fifty times.",
   "Sometimes one copy needs to be different. <b>Break Link to Symbol</b> turns a single instance into regular artwork you can edit on its own, while the rest stay linked.",
   "Color works the same way. A <b>global swatch</b> is a color that updates everywhere it&rsquo;s used when you edit it. If a client changes their mind about a shade of blue, a designer with global swatches changes one swatch instead of hunting down a hundred shapes.",
   "Brushes and patterns are reusable too. An art brush can repeat a stitched line along any path, and a pattern swatch can fill a shape with repeating stars.",
   "These tools are the beginning of a <b>design system</b>, a set of reusable colors, symbols, and styles that keeps a team&rsquo;s work consistent. Big companies use design systems so that every app screen, ad, and sign looks like it belongs to the same brand."],

function mcBlock(host,qs,store,onDone){

  $$(".q",host).forEach(function(el){var k=+el.dataset.k,q=qs[k],r=store[k]||{tries:0,ok:false},btn=$(".btn",el),box=$(".fb",el);
    function lock(){btn.disabled=true;$$("input",el).forEach(function(x){x.disabled=true;if(+x.value===q.a){x.checked=true;x.closest("label").classList.add("ok");}});fb(box,"ok","Correct.");}
    if(r.ok)lock();
    btn.onclick=function(){var c=$("input:checked",el);if(!c){fb(box,"info","Choose an answer first.");return;}r.tries++;
      if(+c.value===q.a){r.ok=true;lock();}else{c.closest("label").classList.add("bad");c.checked=false;fb(box,"bad","Not quite. Try another answer.");}
      store[k]=r;onDone();};});
}

   '<div class="row-actions"><button class="btn" id="chk">Check this version</button>'+nextBtn()+'</div><div class="fb" id="sfb"></div><div id="sc">'+scoreLine(st)+'</div>';
  var ROWS=[["main","Main (currently maroon)","#8A0635"],["acc","Accent (currently silver)","#9E9FA3"],["out","Outline (currently black)","#0A0A0A"]];
  function tabs(){$("#rt",stage).innerHTML=RC_ROUNDS.map(function(r,k){return '<button class="btn sm '+(k===ri?"":"ghost")+'" data-r="'+k+'">'+r.name+(st.ok[k]?" \u2713":"")+'</button>';}).join("");
    $$("#rt button",stage).forEach(function(b){b.onclick=function(){ri=+b.dataset.r;tabs();draw();$("#sfb",stage).className="fb";};});$("#rb",stage).innerHTML="<b>"+RC_ROUNDS[ri].name+" version:</b> "+RC_ROUNDS[ri].brief;}
  function draw(){var c=st.r[ri];
    $("#rv",stage).innerHTML='<rect width="360" height="300" fill="#fff"/><path d="M60 40 L300 40 L300 170 Q300 250 180 285 Q60 250 60 170 Z" fill="'+c.main+'" stroke="'+c.out+'" stroke-width="10" stroke-linejoin="round"/>'+
      '<path d="M90 70 L270 70 L270 165 Q270 225 180 252 Q90 225 90 165 Z" fill="none" stroke="'+c.acc+'" stroke-width="8"/><text x="180" y="150" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="74" fill="'+c.acc+'" stroke="'+c.out+'" stroke-width="2">M</text>'+
      '<text x="180" y="205" text-anchor="middle" font-family="Arial" font-weight="700" font-size="22" letter-spacing="3" fill="'+c.acc+'">COWBOYS</text>';
    $("#rp",stage).innerHTML=ROWS.map(function(r){return '<div style="display:flex;align-items:center;gap:8px">'+chip(r[2],26)+' \u2192 '+chip(c[r[0]],26)+'<label style="flex:1">'+r[1]+'<select data-r="'+r[0]+'">'+RC_PAL.map(function(p){return '<option value="'+p[1]+'"'+(c[r[0]]===p[1]?" selected":"")+'>'+p[0]+'</option>';}).join("")+'</select></label></div>';}).join("");
    $$("[data-r]",$("#rp",stage)).forEach(function(s){s.onchange=function(){st.r[ri][s.dataset.r]=s.value;save();draw();};});}
  $("#chk",stage).onclick=function(){var c=st.r[ri],m=RC_ROUNDS[ri].map,bad=ROWS.filter(function(r){return c[r[0]]!==m[r[0]];});if(!bad.length)st.ok[ri]=1;var n=Object.keys(st.ok).length;
    record(st,Math.round(n/RC_ROUNDS.length*100));tabs();$("#sc",stage).innerHTML=scoreLine(st);
    fb($("#sfb",stage),bad.length?"info":"ok",bad.length?"Check the "+bad.map(function(r){return r[1].split(" (")[0].toLowerCase();}).join(" and ")+" color"+(bad.length>1?"s":"")+" against the client\u2019s request.":(n===3?"All three versions are ready for the client!":"Version approved. Try the next one."));};
  tabs();draw();wireNext(stage);};
var CT_CARDS=[["#8A0635","Small",4.5],["#9E9FA3","Small",4.5],["#F2B705","Large",3],["#14213D","Small",4.5],["#F2B8C8","Small",4.5],["#0A0A0A","Large",3]];
var CT_TEXT=["#FFFFFF","#0A0A0A","#9E9FA3","#F2B705","#8A0635","#D9D9D9","#595959","#FFE600"];
KINDS.contrast=function(stage,i,sd){var st=stState(i);st.v=st.v||["#8A0635","#D9D9D9","#FFFFFF","#0A0A0A","#FFFFFF","#8A0635"];
  stage.innerHTML=head(sd,i)+'<div class="samples" id="cc"></div><div class="row-actions">'+nextBtn()+'</div><div class="fb" id="sfb"></div><div id="sc">'+scoreLine(st)+'</div>';
  function draw(){$("#cc",stage).innerHTML=CT_CARDS.map(function(c,k){var t=st.v[k],r=contrast(c[0],t),ok=r>=c[2];
      return '<div class="sample '+(ok?"ok":"")+'" data-k="'+k+'"><div style="background:'+c[0]+';color:'+t+';padding:14px;border-radius:6px;min-height:86px;font-family:Arial">'+(c[1]==="Large"?'<div style="font-weight:700;font-size:30px">GAME DAY</div>':'<div style="font-size:14px;line-height:1.4">Gates open at 6:30. Students get in free with their ID.</div>')+'</div>'+
        '<p style="margin:8px 0 4px"><b>'+c[1]+' text</b> \u00b7 needs '+c[2]+':1 \u00b7 yours: <b style="color:'+(ok?"var(--ok)":"var(--bad)")+'">'+r.toFixed(1)+':1</b></p><div class="swatches">'+CT_TEXT.map(function(x){return '<button data-t="'+x+'" aria-pressed="'+(x===t)+'" title="'+x+'" style="background:'+x+'"></button>';}).join("")+'</div></div>';}).join("");
    $$("#cc .sample",stage).forEach(function(el){var k=+el.dataset.k;$$("[data-t]",el).forEach(function(b){b.onclick=function(){st.v[k]=b.dataset.t;save();draw();score();};});});}
  function score(){var n=CT_CARDS.filter(function(c,k){return contrast(c[0],st.v[k])>=c[2];}).length;record(st,Math.round(n/CT_CARDS.length*100));$("#sc",stage).innerHTML=scoreLine(st);
    fb($("#sfb",stage),n===CT_CARDS.length?"ok":"info",n===CT_CARDS.length?"Every card passes. Readable for everyone!":n+" of "+CT_CARDS.length+" cards pass. Keep trying colors on the others.");}
  draw();if(st.checks)score();wireNext(stage);};

/* ================= Fri ================= */
function starPath(cx,cy,R,pts){var r=R*0.45,s="";for(var j=0;j<pts*2;j++){var a=-Math.PI/2+j*Math.PI/pts,rr=j%2?r:R;s+=(j?"L":"M")+(cx+rr*Math.cos(a)).toFixed(1)+" "+(cy+rr*Math.sin(a)).toFixed(1);}return s+"Z";}
KINDS.symbols=function(stage,i,sd){var st=stState(i);st.m=st.m||{c:"#F2F2F2",pts:5,size:14};st.inst=st.inst||[];var sel=-1;
  stage.innerHTML=head(sd,i)+'<div class="grid2"><div class="board"><svg id="sk" viewBox="0 0 480 320" style="cursor:crosshair"></svg></div><div><div class="pnl"><h4>Master symbol: Star</h4><div class="bd">'+
   '<label>Color<input type="color" id="mc"></label><label>Points<select id="mp"><option>5</option><option>6</option><option>8</option></select></label><label>Size<input type="range" id="ms" min="8" max="26"></label></div></div>'+
   '<div class="pnl" style="margin-top:10px"><h4>Selected instance</h4><div class="bd" id="si"></div></div><h3>Checklist</h3><ul class="checklist" id="ck"></ul></div></div>'+
   '<div class="row-actions"><button class="btn ghost" id="undo">Remove last star</button>'+nextBtn()+'</div><div id="sc">'+scoreLine(st)+'</div>';
  var sk=$("#sk",stage);
  function draw(){var h='<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#2B1240"/></linearGradient></defs><rect width="480" height="320" fill="url(#sky)"/><path d="M0 280 Q120 240 240 270 T480 260 L480 320 L0 320Z" fill="#14081C"/>';
    st.inst.forEach(function(n,k){var linked=!n.broken,c=linked?st.m.c:n.c,pts=linked?st.m.pts:n.pts,sz=linked?st.m.size:n.size;
      h+='<path data-i="'+k+'" d="'+starPath(n.x,n.y,sz,pts)+'" fill="'+c+'" stroke="'+(k===sel?"#1F7AE0":"none")+'" stroke-width="2" style="cursor:pointer"/>';});
    sk.innerHTML=h;$("#mc",stage).value=st.m.c.toLowerCase();$("#mp",stage).value=st.m.pts;$("#ms",stage).value=st.m.size;
    var n=st.inst[sel];$("#si",stage).innerHTML=n?(n.broken?'<span class="note">Link broken. This star is regular art now.</span><label>Its own color<input type="color" id="ic" value="'+n.c.toLowerCase()+'"></label>':'<span class="note">Linked to the master.</span><button class="btn sm" id="bl">Break Link to Symbol</button>')+'<button class="btn ghost sm" id="del">Delete this star</button>':'<span class="note">Click a star to select it.</span>';
    if($("#bl",stage))$("#bl",stage).onclick=function(){var x=st.inst[sel];x.broken=true;x.c=st.m.c;x.pts=st.m.pts;x.size=st.m.size;save();draw();checks();};
    if($("#ic",stage))$("#ic",stage).oninput=function(e){st.inst[sel].c=e.target.value.toUpperCase();save();draw();checks();};
    if($("#del",stage))$("#del",stage).onclick=function(){st.inst.splice(sel,1);sel=-1;save();draw();checks();};
    $$("#sk [data-i]",stage).forEach(function(el){el.onclick=function(ev){ev.stopPropagation();sel=+el.dataset.i;draw();};});}
  sk.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("[data-i]"))return;var p=sk.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var q=p.matrixTransform(sk.getScreenCTM().inverse());
    st.inst.push({x:Math.round(q.x),y:Math.round(q.y),broken:false});sel=-1;save();draw();checks();});
  $("#mc",stage).oninput=function(e){st.m.c=e.target.value.toUpperCase();save();draw();checks();};$("#mp",stage).onchange=function(e){st.m.pts=+e.target.value;save();draw();checks();};
  $("#ms",stage).oninput=function(e){st.m.size=+e.target.value;save();draw();};$("#undo",stage).onclick=function(){st.inst.pop();sel=-1;save();draw();checks();};
  function checks(){var linked=st.inst.filter(function(n){return !n.broken;}).length,broken=st.inst.filter(function(n){return n.broken&&cdist(n.c,st.m.c)>40;}).length;
    var items=[["Place at least 8 star instances in the sky",st.inst.length>=8],["Change the master symbol&rsquo;s color (watch every linked star update)",cdist(st.m.c,"#F2F2F2")>40],
      ["Change the master to 6 or 8 points",st.m.pts!==5],["Break the link on one star and give it its own color",broken>=1],["Keep at least 7 stars linked to the master",linked>=7]];
    $("#ck",stage).innerHTML=items.map(function(it){return '<li class="'+(it[1]?"ok":"")+'">'+it[0]+'</li>';}).join("");
    var n=items.filter(function(it){return it[1];}).length;record(st,Math.round(n/items.length*100),st.inst.length+" stars, "+broken+" unlinked");$("#sc",stage).innerHTML=scoreLine(st);}
  draw();checks();wireNext(stage);};
/* project */
var PARTS=[["sky","Sky"],["sun","Sun"],["hillB","Back hills"],["hillF","Front hills"],["pole","Flag pole"],["flag","Pennant"],["text","Pennant text"]];
var SCHEMES={"Monochromatic":[0],"Analogous":[-1,0,1],"Complementary":[0,6],"Split-complementary":[0,5,7],"Triadic":[0,4,8]};
function project(){if(!S.proj)S.proj={scheme:"",base:4,fill:{}};return S.proj;}
function palette(p){if(!p.scheme)return [];var hs=SCHEMES[p.scheme].map(function(o){return (p.base+o+12)%12;}),out=[];
  hs.forEach(function(h){var c=WHEEL[h][1];out.push(mix(c,"#FFFFFF",.6),mix(c,"#FFFFFF",.3),c,mix(c,"#000000",.35),mix(c,"#000000",.6));});return out.concat(["#FFFFFF","#0A0A0A"]);}
function sceneSVG(p,w,h){var f=function(k,d){return p.fill[k]||d;};
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="'+w+'" height="'+h+'"><rect width="480" height="320" fill="'+f("sky","#EDEDED")+'" data-p="sky"/><circle cx="370" cy="90" r="46" fill="'+f("sun","#D0D0D0")+'" data-p="sun"/>'+
    '<path d="M0 230 Q90 150 190 205 T400 180 T480 190 L480 320 L0 320Z" fill="'+f("hillB","#BDBDBD")+'" data-p="hillB"/><path d="M0 270 Q120 215 250 255 T480 245 L480 320 L0 320Z" fill="'+f("hillF","#A0A0A0")+'" data-p="hillF"/>'+
    '<rect x="96" y="70" width="8" height="200" fill="'+f("pole","#7A7A7A")+'" data-p="pole"/><path d="M104 74 L280 112 L104 150 Z" fill="'+f("flag","#8C8C8C")+'" data-p="flag"/>'+
    '<text x="114" y="120" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="1" fill="'+f("text","#FFFFFF")+'" data-p="text">COWBOYS</text></svg>';}
function standsOut(a,b){if(contrast(a,b)>=1.5)return true;var x=rgb2hsb(hex2rgb(a)),y=rgb2hsb(hex2rgb(b)),dh=Math.min(Math.abs(x[0]-y[0]),360-Math.abs(x[0]-y[0]));return dh>=60&&x[1]>15&&y[1]>15;}
function projChecks(p){var pal=palette(p),filled=PARTS.filter(function(x){return p.fill[x[0]];}),inPal=filled.every(function(x){return pal.indexOf(p.fill[x[0]])>-1;}),used=new Set(filled.map(function(x){return p.fill[x[0]];}));
  var hasAll=filled.length===PARTS.length;
  return [["Choose a color scheme and a base hue",!!p.scheme],["Color every part of the scene (7 parts)",hasAll],["Every color comes from your scheme&rsquo;s palette",hasAll&&inPal],["Use at least 3 different colors",used.size>=3],
    ["Pennant text is readable on the pennant (contrast 3:1 or more)",hasAll&&contrast(p.fill.text,p.fill.flag)>=3],["The sun stands out from the sky (a different value or a contrasting hue)",hasAll&&standsOut(p.fill.sun,p.fill.sky)],["Front hills are a different value from back hills",hasAll&&Math.abs(lum(p.fill.hillF)-lum(p.fill.hillB))>0.03]];}
KINDS.project=function(stage,i,sd){var st=stState(i),p=project(),part="sky";
  stage.innerHTML=head(sd,i)+'<div class="grid2"><div class="board" id="pv" style="background:#fff"></div><div><div class="pnl"><h4>Color scheme</h4><div class="bd"><label>Scheme<select id="sch"><option value="">Choose\u2026</option>'+Object.keys(SCHEMES).map(function(k){return '<option'+(p.scheme===k?" selected":"")+'>'+k+'</option>';}).join("")+'</select></label>'+
   '<label>Base hue<select id="bh">'+WHEEL.map(function(w,k){return '<option value="'+k+'"'+(p.base===k?" selected":"")+'>'+w[0]+'</option>';}).join("")+'</select></label></div></div>'+
   '<div class="pnl" style="margin-top:10px"><h4>Part: <span id="pn"></span></h4><div class="bd"><div id="parts" class="seg" style="flex-wrap:wrap;width:auto"></div><p class="note" style="margin:0">Then click a color:</p><div class="swatches" id="pal"></div></div></div></div></div>'+
   '<h3>Checklist</h3><ul class="checklist" id="ck"></ul><div class="row-actions">'+nextBtn()+'</div><div id="sc">'+scoreLine(st)+'</div>';
  function draw(){$("#pv",stage).innerHTML=sceneSVG(p,"100%","auto");$$("#pv [data-p]",stage).forEach(function(el){el.style.cursor="pointer";el.onclick=function(){part=el.getAttribute("data-p");draw();};});
    $("#pn",stage).textContent=PARTS.filter(function(x){return x[0]===part;})[0][1];
    $("#parts",stage).innerHTML=PARTS.map(function(x){return '<button data-pt="'+x[0]+'" aria-pressed="'+(x[0]===part)+'">'+x[1]+'</button>';}).join("");
    $$("#parts button",stage).forEach(function(b){b.onclick=function(){part=b.dataset.pt;draw();};});
    var pal=palette(p);$("#pal",stage).innerHTML=pal.length?pal.map(function(c){return '<button data-c="'+c+'" aria-pressed="'+(p.fill[part]===c)+'" title="'+c+'" style="background:'+c+'"></button>';}).join(""):'<span class="note">Choose a scheme first.</span>';
    $$("#pal button",stage).forEach(function(b){b.onclick=function(){p.fill[part]=b.dataset.c;save();draw();checks();};});}
  function checks(){var it=projChecks(p);$("#ck",stage).innerHTML=it.map(function(x){return '<li class="'+(x[1]?"ok":"")+'">'+x[0]+'</li>';}).join("");var n=it.filter(function(x){return x[1];}).length;
    record(st,Math.round(n/it.length*100),(p.scheme||"no scheme")+(p.scheme?" on "+WHEEL[p.base][0]:""));$("#sc",stage).innerHTML=scoreLine(st);}
  $("#sch",stage).onchange=function(e){p.scheme=e.target.value;save();draw();checks();};$("#bh",stage).onchange=function(e){p.base=+e.target.value;save();draw();checks();};
  draw();checks();wireNext(stage);};
function lastFirst(){var parts=(S.name||"").trim().split(/\s+/);if(parts.length<2)return null;var last=parts[parts.length-1].replace(/[^A-Za-z\-]/g,""),first=parts[0].replace(/[^A-Za-z]/g,"");if(!last||!first)return null;return {last:last.charAt(0).toUpperCase()+last.slice(1),fi:first.charAt(0).toUpperCase()};}
KINDS.export=function(stage,i,sd){var st=stState(i),p=project(),lf=lastFirst();
  stage.innerHTML=head(sd,i)+'<p>Class formula: <b>LastName_FirstInitial_ProjectCode_v#.ext</b>. This project&rsquo;s code is <b>ColorScheme</b>.</p><div class="row-actions" style="margin-top:4px"><input class="fname" id="fn" spellcheck="false" placeholder="e.g. Garcia_M_ColorScheme_v1.png" value="'+esc(st.fname||"")+'"><button class="btn" id="ex">Export PNG</button></div><div class="fb" id="sfb"></div><h3>Preview</h3><div style="max-width:480px">'+sceneSVG(p,"100%","auto")+'</div><div class="row-actions">'+nextBtn()+'</div>';
  function validate(v){if(!lf)return "Type your first and last name at the top of the page first.";if(/\s/.test(v))return "No spaces. Use underscores.";var e=lf.last+"_"+lf.fi+"_ColorScheme_v";if(v.indexOf(e)!==0)return "Start with "+e+" (last name, first initial, project code, version).";if(!/^.+_v\d+\.png$/.test(v))return "End with a version number and .png, like _v1.png";return null;}
  $("#ex",stage).onclick=function(){var v=$("#fn",stage).value.trim(),box=$("#sfb",stage),err=validate(v);st.fname=v;save();if(err){fb(box,"bad",err);record(st,0);return;}
    var img=new Image(),url=URL.createObjectURL(new Blob([sceneSVG(p,960,640)],{type:"image/svg+xml"}));
    img.onload=function(){var c=document.createElement("canvas");c.width=960;c.height=640;c.getContext("2d").drawImage(img,0,0);URL.revokeObjectURL(url);
      c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=v;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1500);
        record(st,100,v);fb(box,"ok","<b>Exported "+esc(v)+".</b> Attach it to the assignment in Google Classroom.");},"image/png");};img.src=url;};
  wireNext(stage);};

/* ================= quiz & report ================= */
function quizPage(stage){var day=DAYS[S.day],d=D();
  stage.innerHTML='<h2>Quick check</h2><p class="time">About 5 minutes</p><p class="lede">Full credit if you get it right on the first or second try. Half credit after that.</p><div id="mcb"></div><div class="row-actions">'+nextBtn()+'</div>';
  mcBlock($("#mcb",stage),day.quiz,d.quiz,function(){save();renderNav();});wireNext(stage);}
function reportPage(stage){var day=DAYS[S.day],d=D(),q=quizScore(),pl=payload("");
  var rows=day.stations.map(function(s,i){var r=d.st[i];return '<tr><td>'+esc(s.title)+(r&&r.note?'<br><span class="note">'+esc(r.note)+'</span>':'')+'</td><td>'+(r&&r.passed?"\u2713 Done":(r&&r.checks?"In progress":"Not tried"))+'</td><td class="num">'+(r&&r.checks?r.best+"%":"\u2014")+'</td></tr>';}).join("");
  var all=pl.passed===day.stations.length&&q.done;
  stage.innerHTML='<h2>Lab report: '+esc(day.label+" "+day.date)+'</h2><p class="lede">'+esc(day.title)+'. Scores show how much of each station you finished correctly. Extra tries never lower your score.</p><p><b>Name:</b> '+(S.name?esc(S.name):'<span style="color:var(--bad)">Type your name at the top of the page</span>')+' &nbsp; <b>Period:</b> '+esc(S.period||"\u2014")+'</p>'+
   '<div class="report"><table><thead><tr><th>Station</th><th>Status</th><th class="num">Score</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Stations done: '+pl.passed+' / '+day.stations.length+'</td><td>Quick check: '+q.got+' / '+q.of+'</td><td></td></tr></tfoot></table>'+
   '<h3>'+(S.day==="fri"?"Design rationale":"Exit ticket")+'</h3><p>'+esc(day.exit)+'</p><textarea id="ex">'+esc(d.exit||"")+'</textarea>'+(all&&S.name?'<p><span class="stamp">Full color</span></p>':'')+'</div>'+
   '<p class="no-print">'+(HAS_URL?'Click <b>Submit to teacher</b> when you finish.':'Screenshot this report and attach it in Google Classroom.')+'</p><div class="row-actions">'+(HAS_URL?'<button class="btn" id="sub">Submit to teacher</button>':'')+'<button class="btn ghost" id="pdf">Save as PDF</button></div><div class="fb" id="subfb"></div>';
  $("#ex",stage).addEventListener("input",function(e){d.exit=e.target.value;save();});$("#pdf",stage).onclick=function(){window.print();};
  if(HAS_URL){var sb=$("#sub",stage),sf=$("#subfb",stage);if(d.submittedAt)fb(sf,"ok","Submitted at "+d.submittedAt+". You can submit again if you keep working.");
    sb.onclick=function(){if(!S.name){fb(sf,"bad","Type your name at the top of the page, then submit.");$("#sname").focus();return;}if(!(d.exit||"").trim()){fb(sf,"bad","Answer the question above before you submit.");$("#ex",stage).focus();return;}
      sb.disabled=true;fb(sf,"info","Sending\u2026");send("Submitted",function(ok){sb.disabled=false;if(ok){d.submittedAt=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});save();fb(sf,"ok","Submitted at "+d.submittedAt+". Your teacher can see your results.");}else fb(sf,"bad","Couldn\u2019t reach the results sheet. Try again, or turn in a screenshot.");});};}}

var nm=$("#sname"),pd=$("#speriod");nm.value=S.name;pd.value=S.period;
function needName(){nm.classList.toggle("need",!nm.value.trim());}
nm.addEventListener("input",function(){S.name=nm.value.trim();save();needName();});pd.addEventListener("input",function(){S.period=pd.value.trim();save();});needName();
setInterval(function(){if(isOpen(S.day))$("#timer").textContent="Time in lab today: "+Math.floor((Date.now()-D().start)/60000)+" min";},30000);
window.__colorLab={contrast:contrast,CT_CARDS:CT_CARDS,CT_TEXT:CT_TEXT,rgb2hsb:rgb2hsb,hex2rgb:hex2rgb};
render();
})();
